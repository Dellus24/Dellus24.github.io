            { name: 'Binary',   chars: ' 01' },
            { name: 'Minimal',  chars: ' .:#' },
        ];

        // `which` indexes project.models when a project carries several. Index 0
        // is the model marked in project.txt and the only one openProject opens;
        // the rest come from the 3D View dropdown, each in its own window so two
        // models can sit side by side.
        async function open3D(project, which = 0) {
            const list  = (project.models && project.models.length > 1) ? project.models : null;
            const entry = list ? list[which] : null;
            const src   = entry ? entry.src : project.model;
            if (!src) return;
            const key   = list ? `3d-${project.id}-${which}` : `3d-${project.id}`;
            const label = entry ? entry.label : '3D';
            focusOrCreate(key, async () => {
                const frame = makeFrame({ title: project.title + ' — ' + label, tag: '3D', w: 560, h: 450, minW: 300, minH: 220, key, projectId: project.id });
                const body = frame.querySelector('.win-body');
                Object.assign(body.style, { padding: '0', overflow: 'hidden', position: 'relative' });

                // Read the ink and canvas off THIS FRAME, not the document root.
                // Custom properties inherit, so a frame with no tint of its own
                // still resolves to the site's — but a landing window carrying
                // its project's colour renders in that colour instead.
                const inkOf = () => getComputedStyle(frame).getPropertyValue('--fg').trim() || '#000';
                const canvasOf = () => getComputedStyle(frame).getPropertyValue('--bg').trim() || '#ffffff';
                const bgHex = canvasOf();
                const fgHex = inkOf();
                const BG = parseInt(bgHex.replace('#', ''), 16);
                body.innerHTML = `
                    <div class="cv-canvas" role="img" aria-label="Interactive 3D model of ${project.title}. Drag to orbit. Not conveyable as text; see the project description and images."></div>
                    <div class="cv-ascii" aria-hidden="true"></div>
                    <button class="focus-btn" aria-label="Reset camera to model"><span class="focus-icon" aria-hidden="true">[+]</span><span class="focus-label">Orient on model</span></button>
                    <div class="win-settings">
                        <div class="settings-inner model-settings" style="display:none">
                            <div class="setting-row decon-row" style="display:none"><button class="setting-label label-btn decon-btn" aria-label="Deconstruct the model, or put it back together">Deconstruct</button><input type="range" class="ctrl-slider decon-slider" min="0" max="100" step="0.5" value="0" aria-label="How far the model is deconstructed"><span class="decon-val" style="font-size:0.42rem;opacity:0.5;margin-left:6px">0%</span></div>
                            <div class="setting-row views-row" style="display:none"><span class="setting-label">Views</span><div class="charset-group views-group"></div></div>
                        </div>
                        <div class="settings-inner ascii-settings">
                            <div class="setting-row"><span class="setting-label">Res</span><input type="range" class="ctrl-slider res-slider" min="0.1" max="1.0" step="0.05" value="0.4"></div>
                            <div class="setting-row"><span class="setting-label">Invert</span><button class="ctrl-toggle on invert-toggle">On</button></div>
                            <div class="setting-row"><span class="setting-label">Chars</span><div class="charset-group ascii-charset"></div></div>
                        </div>
                        <div class="settings-inner wire-settings" style="display:none">
                            <div class="setting-row"><span class="setting-label">Lines</span><div class="charset-group wire-lines-group">
                                <button class="charset-option" data-wire="edges">Edges</button>
                                <button class="charset-option" data-wire="all">All</button>
                                <button class="charset-option active" data-wire="hidden">Hidden</button>
                            </div></div>
                            <div class="setting-row"><span class="setting-label">Width</span><input type="range" class="ctrl-slider wire-width-slider" min="1" max="6" step="0.5" value="1"><span class="wire-width-val" style="font-size:0.42rem;opacity:0.5;margin-left:6px">1px</span></div>
                        </div>
                        <div class="settings-inner solid-settings" style="display:none">
                            <div class="setting-row"><span class="setting-label">Edges</span><button class="ctrl-toggle solid-edges-toggle">Off</button></div>
                            <div class="setting-row"><span class="setting-label">Render</span><button class="ctrl-toggle" style="opacity:0.22;cursor:default">Soon</button></div>
                        </div>
                    </div>
                    <div class="win-bottom-hover"></div>
                    <div class="win-bottom-bar">
                        <div class="wbb-left">
                            <button class="mode-btn active" data-mode="ascii">Ascii</button>
                            <button class="mode-btn" data-mode="wireframe">Wire</button>
                            <button class="mode-btn" data-mode="solid">Solid</button>
                            <div class="speed-inline"><span class="speed-inline-label">Speed</span><input type="range" class="ctrl-slider speed-slider" min="0" max="0.015" step="0.001" value="0.003"></div>
                        </div>
                        <button class="settings-toggle-btn">Settings <span class="settings-arrow">&#9652;</span></button>
                    </div>
                `;

                const canvasCont     = body.querySelector('.cv-canvas');
                const asciiCont      = body.querySelector('.cv-ascii');
                const focusBtn       = body.querySelector('.focus-btn');
                const settingsPanel  = body.querySelector('.win-settings');
                const settingsToggle = body.querySelector('.settings-toggle-btn');
                const bottomBar      = body.querySelector('.win-bottom-bar');
                const bottomHover    = body.querySelector('.win-bottom-hover');
                const modelPanel     = body.querySelector('.model-settings');
                const deconRow     = body.querySelector('.decon-row');
                const viewsRow       = body.querySelector('.views-row');
                const viewsGroup     = body.querySelector('.views-group');

                // preserveDrawingBuffer not needed: the ascii effect samples the
                // canvas synchronously right after each render call.
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(1); renderer.setClearColor(BG, 1);
                canvasCont.appendChild(renderer.domElement);

                const vw = body.clientWidth || 560, vh = body.clientHeight || 422;
                const camera = new THREE.PerspectiveCamera(50, vw / vh, 0.1, 1000);
                camera.position.set(3, 2.5, 3);
                // Parallel-projection companion, used only while an authored
                // orthographic view is selected — an elevation that converges
                // is not an elevation. SimpleOrbit drives whichever is active.
                const orthoCam = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.01, 1000);
                let activeCam = camera;
                let orthoRefRadius = 5;   // orbit radius at which orthoCam.zoom is 1

                const scene = new THREE.Scene();
                // Kept as handles because the per-part ascii pass has to clear to
                // pure black (part id 0) rather than to the page background.
                let bgInt = BG;
                const sceneBg = new THREE.Color(BG);
                scene.background = sceneBg;
                scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(5, 8, 5); scene.add(dl);
                const fl = new THREE.DirectionalLight(0xffffff, 0.3); fl.position.set(-3, 2, -3); scene.add(fl);

                renderer.setSize(vw, vh);
                // INVERT FOLLOWS THE CANVAS (2026-09-30). The shading path reads
                // the luminance of each cell, so on a light canvas empty space is
                // bright and must invert to a space; on a DARK canvas it is
                // already dark and inverting fills the whole window with the
                // densest character. Hardcoding `invert: true` made any project
                // with a dark background render as a solid block of glyphs.
                const isDark = (hex) => {
                    const n = parseInt(String(hex).replace('#', ''), 16);
                    if (!Number.isFinite(n)) return false;
                    return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 < 0.5;
                };
                let invertTouched = false;        // a manual toggle wins from then on
                const ascii = new AsciiEffect(renderer, ' .·:;=+x#%@', { invert: !isDark(bgHex), resolution: 0.4, color: fgHex, bg: bgHex });
                ascii.setSize(vw, vh);
                asciiCont.appendChild(ascii.domElement);

                const orbit = new SimpleOrbit(camera, body);

                const matWhite   = new THREE.MeshLambertMaterial({ color: 0xffffff });
                // These were hardcoded black while the background was read from
                // the stylesheet, so a viewer opened under any non-black ink drew
                // black lines until the NEXT theme change happened to correct it.
                const FG = parseInt(fgHex.replace('#', ''), 16);
                const matWireAll = new THREE.MeshBasicMaterial({ color: FG, wireframe: true });
                const matSolid   = new THREE.MeshLambertMaterial({ color: 0xcccccc });
                const solidEdgeMat = new LineMaterial({ color: FG, linewidth: 1, worldUnits: false, opacity: 0.15, transparent: true, resolution: new THREE.Vector2(vw, vh) });
                const wireEdgeMat  = new LineMaterial({ color: FG, linewidth: 1, worldUnits: false, resolution: new THREE.Vector2(vw, vh) });

                // ---- Per-part ascii ------------------------------------------
                // Shading alone reads the model as one mass: every mesh shares one
                // white material, so neighbouring parts whose planes face the same
                // way get the same character. Instead each authored part is given a
                // flat id colour and its own character, so the drawing reads as
                // parts rather than as a silhouette.
                const PART_GLYPHS = '#%@&$XOWMBQ8DHKNRSAZEPGUVTY=+*oxcsv:.';
                let partMats = [], partGlyphs = [], partCount = 0;
                let asciiScheme = 'shade';

                function buildPartGlyphs() {
                    // Grouped by authored name: Blender splits one Rhino object into
                    // many meshes (Name.001, Name.002 ...) which must read as one
                    // part. GLTFLoader sanitizes .name but keeps the authored string
                    // in userData.name, so prefer that and strip only the duplicate
                    // suffix - trailing digits can be part of the name itself.
                    const idOf = new Map(), matOf = new Map();
                    partMats = []; partGlyphs = [];
                    realMeshes.forEach((m, i) => {
                        const authored = (m.userData && m.userData.name) || '';
                        const base = authored ? authored.replace(/\.\d+$/, '')
                                              : (m.name || 'part').replace(/\d+$/, '');
                        if (!idOf.has(base)) {
                            const k = idOf.size;
                            // 216 flat colours are addressable and id 0 is the
                            // background, so ids wrap after 215.
                            const id = (k % 215) + 1;
                            idOf.set(base, id);
                            partGlyphs[id] = PART_GLYPHS[k % PART_GLYPHS.length];
                            matOf.set(id, new THREE.MeshBasicMaterial({
                                color: new THREE.Color().setRGB(
                                    (id % 6) * 51 / 255,
                                    (Math.floor(id / 6) % 6) * 51 / 255,
                                    (Math.floor(id / 36) % 6) * 51 / 255),
                            }));
                        }
                        partMats[i] = matOf.get(idOf.get(base));
                    });
                    partCount = idOf.size;
                }

                // Parts mode needs the render to carry ids, not light, so it swaps
                // the materials and the clear colour together with the decoder.
                function applyAsciiScheme() {
                    const parts = mode === 'ascii' && asciiScheme === 'parts' && partCount > 0;
                    if (modelGroup && mode === 'ascii') {
                        realMeshes.forEach((c, i) => c.material = parts ? partMats[i] : matWhite);
                    }
                    ascii.partPass = parts ? { glyphs: partGlyphs } : null;
                    scene.background = parts ? null : sceneBg;
                    renderer.setClearColor(parts ? 0x000000 : bgInt, 1);
                }

                let modelGroup = null, edgeMeshes = [], wireFillMeshes = [], realMeshes = [], edgeSources = [];
                let wireLinesMode = 'hidden', solidEdges = false, edgesBuilt = false;
                let alive = true;

                // Load model asynchronously — the viewer opens immediately and
                // the model pops in when ready, with download progress shown.
                if (src) {
                    const CIRC = 125.66; // 2πr for r=20
                    const loadingEl = document.createElement('div');
                    loadingEl.className = 'viewer-loading indet';
                    loadingEl.innerHTML = `
                        <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
                            <circle class="ld-track" cx="22" cy="22" r="20" fill="none" stroke="currentColor" stroke-width="1"/>
                            <circle class="ld-arc" cx="22" cy="22" r="20" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" stroke-linecap="round" transform="rotate(-90 22 22)"/>
                        </svg>
                        <div class="ld-txt">Loading model</div>`;
                    body.appendChild(loadingEl);
                    const ldArc = loadingEl.querySelector('.ld-arc');
                    const ldTxt = loadingEl.querySelector('.ld-txt');

                    gltfLoader.loadAsync(src, e => {
                        if (!e.total) return; // no content-length: keep the spinner
                        const frac = Math.min(1, e.loaded / e.total);
                        loadingEl.classList.remove('indet');
                        ldArc.style.strokeDashoffset = CIRC * (1 - frac);
                        ldTxt.textContent = `Loading model ${Math.round(frac * 100)}%`;
                    }).then(gltf => {
                        loadingEl.remove();
                        if (!alive) return;
                        const group = gltf.scene;
                        normalizeModel(group, 3);
                        group.traverse(c => { if (c.isMesh && c.geometry) { c.material = matWhite; realMeshes.push(c); } });
                        scene.add(group);
                        modelGroup = group;
                        buildPartGlyphs();
                        setupDeconstruct(gltf);
                        setupViews(gltf);
                        setMode(mode); // re-apply the active mode to the freshly loaded meshes
                        // Per-part characters are for models authored as an
                        // assembly. A model carrying no deconstruction was not
                        // authored that way, so it keeps the shading ramp.
                        selectCharset(mixer && partCount >= 2 ? 'Parts' : 'Standard');
                    }).catch(err => {
                        console.error('3D load failed:', err);
                        loadingEl.classList.remove('indet');
                        loadingEl.querySelector('svg').remove();
                        ldTxt.textContent = 'Model unavailable.\nOpen via local server to load 3D files.';
                    });
                }

                // ---- Deconstruct ---------------------------------------------
                // The model carries its own deconstruction as glTF animation tracks
                // authored in Blender. Nothing ever plays: the mixer is used purely
                // as a posing function driven by the Deconstruct slider, so at any
                // value this is still a model you can orbit, pan and zoom.
                let mixer = null, deconActions = [], deconDur = 0;
                function pose(frac) {
                    if (!mixer) return;
                    const t = Math.max(0, Math.min(1, frac)) * deconDur;
                    for (const a of deconActions) a.time = t;
                    // mixer.setTime() is useless here: `paused` zeroes an action's
                    // effective timeScale, so the delta it would apply is multiplied
                    // by zero and nothing moves. Setting .time by hand and evaluating
                    // with a zero delta is what actually poses the parts.
                    mixer.update(0);
                    syncClones();
                }
                function setupDeconstruct(gltf) {
                    if (!gltf.animations || !gltf.animations.length) return;
                    mixer = new THREE.AnimationMixer(modelGroup);
                    deconActions = gltf.animations.map(clip => {
                        const a = mixer.clipAction(clip);
                        a.play(); a.paused = true;   // registered and bound, never advancing
                        return a;
                    });
                    deconDur = Math.max(...gltf.animations.map(c => c.duration)) || 0;
                    if (!deconDur) { mixer.stopAllAction(); mixer = null; deconActions = []; return; }
                    pose(0);
                    deconRow.style.display = '';
                    modelPanel.style.display = '';
                }

                // ---- Authored views ------------------------------------------
                // Cameras placed in Blender travel inside the .glb. They are read
                // AFTER normalizeModel, so their world transforms have already been
                // through the same fit as the geometry and need no mapping; only the
                // orthographic magnification has to be scaled by hand.
                function setupViews(gltf) {
                    const cams = (gltf.cameras || []).filter(c => c.isCamera);
                    if (!cams.length) return;
                    const k = modelGroup.scale.x || 1;
                    cams.forEach((src, i) => {
                        src.updateWorldMatrix(true, false);
                        const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
                        src.matrixWorld.decompose(pos, quat, scl);
                        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
                        // Orbit about the point on this camera's own view axis nearest
                        // the model centre: that keeps the authored direction exactly
                        // as framed, and leaves dragging pivoting somewhere sensible.
                        const dist = Math.max(0.3, pos.clone().negate().dot(dir));
                        const target = pos.clone().addScaledVector(dir, dist);
                        // GLTFLoader sanitises names (spaces to underscores); the
                        // original is kept in userData.name, so prefer that.
                        const label = (src.userData && src.userData.name) || src.name || `View ${i + 1}`;
                        addViewButton(label.replace(/_/g, ' '), {
                            pos, target, dist,
                            fov: src.isPerspectiveCamera ? src.fov : null,
                            orthoHalfH: src.isOrthographicCamera ? Math.abs(src.top - src.bottom) / 2 * k : null,
                        });
                    });
                    viewsRow.style.display = '';
                    modelPanel.style.display = '';
                }

                function setActiveCam(cam) { activeCam = cam; orbit.camera = cam; resizeVP(); }

                function applyView(v) {
                    // Auto-spin would drift straight back off an authored view, so
                    // picking one stops it and the Speed slider follows.
                    orbit.autoSpeed = 0;
                    const sp = body.querySelector('.speed-slider'); if (sp) sp.value = '0';

                    if (v.orthoHalfH) {
                        orthoCam.top = v.orthoHalfH; orthoCam.bottom = -v.orthoHalfH;
                        orthoRefRadius = v.dist;
                        setActiveCam(orthoCam);
                    } else {
                        if (v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
                        setActiveCam(camera);
                    }
                    orbit.target.copy(v.target);
                    orbit.radius = v.dist;
                    const off = v.pos.clone().sub(v.target);
                    orbit.tRotX = orbit.rotX = Math.asin(Math.max(-1, Math.min(1, off.y / v.dist)));
                    orbit.tRotY = orbit.rotY = Math.atan2(off.x, off.z);
                }

                function addViewButton(label, v) {
                    const btn = document.createElement('button');
                    btn.className = 'charset-option';
                    btn.textContent = label;
                    btn.addEventListener('click', () => {
                        viewsGroup.querySelectorAll('.charset-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        applyView(v);
                    });
                    viewsGroup.appendChild(btn);
                }

                // The edge and fill clones are siblings of the mesh they trace, so
                // when the deconstruction moves a part they must move with it or the
                // linework detaches from the geometry it belongs to.
                function syncClones() {
                    for (let i = 0; i < edgeMeshes.length; i++) {
                        const src = edgeSources[i];
                        edgeMeshes[i].position.copy(src.position);
                        edgeMeshes[i].quaternion.copy(src.quaternion);
                        edgeMeshes[i].scale.copy(src.scale);
                        wireFillMeshes[i].position.copy(src.position);
                        wireFillMeshes[i].quaternion.copy(src.quaternion);
                        wireFillMeshes[i].scale.copy(src.scale);
                    }
                }

                // Edge/fill helper meshes are expensive to compute (EdgesGeometry
                // over the full mesh), so they're built on first use only.
                function ensureEdges() {
                    if (edgesBuilt || !modelGroup) return;
                    edgesBuilt = true;
                    const curBg = new THREE.Color(canvasOf());
                    realMeshes.forEach(child => {
                        const eg = new THREE.EdgesGeometry(child.geometry, 15);
                        const lg = new LineSegmentsGeometry(); lg.setPositions(eg.attributes.position.array); eg.dispose();
                        const em = new LineSegments2(lg, wireEdgeMat);
                        em.visible = false;
                        // Added to the source's OWN parent so their local transforms
                        // share a space and syncClones() can copy one to the other.
                        (child.parent || modelGroup).add(em);
                        edgeMeshes.push(em); edgeSources.push(child);

                        const fm = new THREE.Mesh(child.geometry, new THREE.MeshBasicMaterial({
                            color: curBg, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.FrontSide
                        }));
                        fm.visible = false; (child.parent || modelGroup).add(fm); wireFillMeshes.push(fm);
                    });
                    syncClones();   // the model may already be part-way deconstructed
                }

                function resetMeshes() {
                    realMeshes.forEach(c => c.visible = true);
                    wireFillMeshes.forEach(f => f.visible = false);
                    edgeMeshes.forEach(e => e.visible = false);
                }
                function applyWire() {
                    if (!modelGroup) return; ensureEdges(); resetMeshes();
                    if (wireLinesMode === 'all') {
                        realMeshes.forEach(c => c.material = matWireAll);
                    } else if (wireLinesMode === 'edges') {
                        realMeshes.forEach(c => c.visible = false);
                        edgeMeshes.forEach(e => { e.material = wireEdgeMat; e.visible = true; });
                    } else {
                        realMeshes.forEach(c => c.visible = false);
                        wireFillMeshes.forEach(f => f.visible = true);
                        edgeMeshes.forEach(e => { e.material = wireEdgeMat; e.visible = true; });
                    }
                }
                function applySolid() {
                    if (!modelGroup) return;
                    if (solidEdges) ensureEdges();
                    resetMeshes();
                    realMeshes.forEach(c => c.material = matSolid);
                    edgeMeshes.forEach(e => { e.material = solidEdgeMat; e.visible = solidEdges; });
                }

                let mode = 'ascii';
                function setMode(m) {
                    mode = m;
                    body.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
                    body.querySelector('.ascii-settings').style.display = m === 'ascii'     ? '' : 'none';
                    body.querySelector('.wire-settings').style.display  = m === 'wireframe' ? '' : 'none';
                    body.querySelector('.solid-settings').style.display = m === 'solid'     ? '' : 'none';
                    if (modelGroup) {
                        if (m === 'ascii') { resetMeshes(); applyAsciiScheme(); }
                        else if (m === 'wireframe') applyWire();
                        else applySolid();
                    }
                    if (!modelGroup) applyAsciiScheme();
                    canvasCont.style.display = m === 'ascii' ? 'none'  : 'block';
                    asciiCont.style.display  = m === 'ascii' ? 'flex'   : 'none';
                }
                body.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
                setMode('ascii');

                function selectCharset(name) {
                    const btns = [...charsetGrp.querySelectorAll('.charset-option')];
                    const btn = btns.find(b => b.dataset.cs === name) || btns[0];
                    const cs  = CHAR_SETS.find(c => c.name === btn.dataset.cs);
                    btns.forEach(b => b.classList.toggle('active', b === btn));
                    asciiScheme = cs.parts ? 'parts' : 'shade';
                    if (cs.chars) ascii.characters = cs.chars;
                    applyAsciiScheme();
                }

                // Bottom bar show/hide
                let barLocked = false, hideT = null;
                const showBar = () => { clearTimeout(hideT); bottomBar.classList.add('visible'); };
                const hideBar = () => { if (barLocked) return; hideT = setTimeout(() => bottomBar.classList.remove('visible'), 300); };
                const closeSettings = thenHide => {
                    settingsPanel.classList.remove('open');
                    settingsToggle.classList.remove('open');
                    barLocked = false;
                    if (thenHide) hideBar();
                };
                bottomHover.addEventListener('mouseenter', showBar);
                bottomBar.addEventListener('mouseenter', () => clearTimeout(hideT));
                bottomBar.addEventListener('mouseleave', hideBar);
                // Settings is the only part of the resting bar that stays
                // hit-testable, so hovering it has to reveal the rest itself - the
                // hover strip underneath never sees that pointer.
                settingsToggle.addEventListener('mouseenter', showBar);
                // The faded controls stay in the tab order, so reveal the bar when
                // focus lands inside it rather than leaving a keyboard user driving
                // buttons they cannot see.
                bottomBar.addEventListener('focusin', showBar);
                bottomBar.addEventListener('focusout', e => { if (!bottomBar.contains(e.relatedTarget)) hideBar(); });
                body.addEventListener('pointerdown', e => {
                    if (e.target.closest('.win-bottom-bar, .win-settings')) return;
                    // An open panel is pinned and stays pinned: orbiting, panning and
                    // zooming the model are the whole point of having it open, so only
                    // the Settings button itself closes it.
                    if (e.pointerType === 'mouse') return;
                    // Touch has no hover: a tap on the viewer reveals the bar, which
                    // hides itself after a few seconds (unless settings are open).
                    showBar();
                    hideT = setTimeout(() => { if (!barLocked) bottomBar.classList.remove('visible'); }, 3500);
                });
                settingsPanel.addEventListener('mouseenter', () => clearTimeout(hideT));
                settingsPanel.addEventListener('mouseleave', hideBar);
                settingsToggle.addEventListener('click', () => {
                    // Closing from the button itself leaves the pointer over the bar,
                    // so let mouseleave hide it rather than racing a timer against it.
                    if (settingsPanel.classList.contains('open')) { closeSettings(false); return; }
                    settingsPanel.classList.add('open'); settingsToggle.classList.add('open');
                    barLocked = true; showBar();
                });

                // Controls
                body.querySelector('.res-slider').addEventListener('input', e => {
                    ascii.resolution = parseFloat(e.target.value); ascii.setSize(body.clientWidth, body.clientHeight);
                });
                body.querySelector('.speed-slider').addEventListener('input', e => { orbit.autoSpeed = parseFloat(e.target.value); });
                const deconVal    = body.querySelector('.decon-val');
                const deconSlider = body.querySelector('.decon-slider');
                const setDecon = pct => {
                    deconVal.textContent = Math.round(pct) + '%';
                    pose(pct / 100);
                };
                // Scrubbing by hand takes over from a running tween rather than
                // fighting it for the slider value.
                let deconTween = null;
                const stopTween = () => { if (deconTween) cancelAnimationFrame(deconTween); deconTween = null; };
                deconSlider.addEventListener('input', e => { stopTween(); setDecon(parseFloat(e.target.value)); });
                // The row label doubles as the button: it runs the slider all the
                // way out, and a second click brings it back.
                body.querySelector('.decon-btn').addEventListener('click', () => {
                    const from = parseFloat(deconSlider.value), to = from > 50 ? 0 : 100;
                    stopTween();
                    const t0 = performance.now(), dur = 900;
                    const step = now => {
                        const k = Math.min(1, (now - t0) / dur);
                        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
                        const v = from + (to - from) * e;
                        deconSlider.value = String(v);
                        setDecon(v);
                        deconTween = k < 1 ? requestAnimationFrame(step) : null;
                    };
                    deconTween = requestAnimationFrame(step);
                });
                const invBtn = body.querySelector('.invert-toggle');
                function setInvert(v) {
                    ascii.invert = v;
                    invBtn.classList.toggle('on', v);
                    invBtn.textContent = v ? 'On' : 'Off';
                }
                setInvert(ascii.invert);          // the markup assumes On; the canvas decides
                invBtn.addEventListener('click', () => { invertTouched = true; setInvert(!ascii.invert); });

                const charsetGrp = body.querySelector('.ascii-charset');
                CHAR_SETS.forEach((cs, i) => {
                    const btn = document.createElement('button');
                    btn.classList.add('charset-option'); if (cs.name === 'Standard') btn.classList.add('active');
                    btn.textContent = cs.name; btn.dataset.cs = cs.name;
                    btn.addEventListener('click', () => selectCharset(cs.name));
                    charsetGrp.appendChild(btn);
                });

                body.querySelectorAll('.wire-lines-group .charset-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        wireLinesMode = btn.dataset.wire;
                        body.querySelectorAll('.wire-lines-group .charset-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        if (mode === 'wireframe') applyWire();
                    });
                });
                const wireW = body.querySelector('.wire-width-slider'), wireWVal = body.querySelector('.wire-width-val');
                wireW.addEventListener('input', e => { const v = parseFloat(e.target.value); wireEdgeMat.linewidth = v; wireWVal.textContent = v + 'px'; });

                const solidEdgesBtn = body.querySelector('.solid-edges-toggle');
                solidEdgesBtn.addEventListener('click', () => {
                    solidEdges = !solidEdges; solidEdgesBtn.classList.toggle('on', solidEdges); solidEdgesBtn.textContent = solidEdges ? 'On' : 'Off';
                    if (mode === 'solid') applySolid();
                });

                const _mc = new THREE.Vector3(0, 0, 0);
                focusBtn.addEventListener('click', () => {
                    camera.fov = 50; camera.updateProjectionMatrix();
                    setActiveCam(camera);
                    viewsGroup.querySelectorAll('.charset-option').forEach(b => b.classList.remove('active'));
                    orbit.target.set(0, 0, 0); orbit.radius = 5; orbit.tRotX = 0.4;
                });

                function resizeVP() {
                    const w = body.clientWidth, h = body.clientHeight;
                    if (w < 1 || h < 1) return;
                    camera.aspect = w / h; camera.updateProjectionMatrix();
                    // The authored frame's height is what we honour; width follows
                    // the window, which is resizable and so cannot match Blender's.
                    orthoCam.left = -orthoCam.top * (w / h); orthoCam.right = orthoCam.top * (w / h);
                    orthoCam.updateProjectionMatrix();
                    renderer.setSize(w, h); ascii.setSize(w, h);
                    wireEdgeMat.resolution.set(w, h); solidEdgeMat.resolution.set(w, h);
                }
                frame.addEventListener('win-resize', resizeVP);

                const onThemeChange = () => {
                    const bg = canvasOf();
                    const fg = inkOf();
                    bgInt = parseInt(bg.replace('#',''), 16);
                    const fgInt = parseInt(fg.replace('#',''), 16);
                    ascii.domElement.style.color = fg;
                    ascii.domElement.style.backgroundColor = bg;
                    if (!invertTouched) setInvert(!isDark(bg));
                    sceneBg.set(bgInt);
                    applyAsciiScheme();   // keeps the clear colour right in either scheme
                    matWireAll.color.set(fgInt); wireEdgeMat.color.set(fgInt); solidEdgeMat.color.set(fgInt);
                    wireFillMeshes.forEach(f => f.material.color.set(bgInt));
                };
                window.addEventListener('theme-change', onThemeChange);
                frame.addEventListener('frame-tint', onThemeChange);
                frame.querySelector('.win-close').addEventListener('click', () => {
                    alive = false;
                    window.removeEventListener('theme-change', onThemeChange);
                    if (mixer) { mixer.stopAllAction(); if (modelGroup) mixer.uncacheRoot(modelGroup); mixer = null; }
                    orbit.dispose();
                    // Free GPU memory held by geometries and materials
                    scene.traverse(o => {
                        if (o.geometry) o.geometry.dispose();
                        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
                    });
                    solidEdgeMat.dispose(); wireEdgeMat.dispose();
                    ascii.dispose();
                    renderer.dispose();
                });

                (function loop() {
                    if (!alive) return;
                    requestAnimationFrame(loop);
                    orbit.update();
                    if (activeCam === orthoCam) {
                        // Orthographic has no perspective divide, so distance cannot
                        // zoom it; map the orbit radius onto the frustum instead.
                        const z = orthoRefRadius / Math.max(0.0001, orbit.radius);
                        if (Math.abs(orthoCam.zoom - z) > 1e-4) { orthoCam.zoom = z; orthoCam.updateProjectionMatrix(); }
                    }
                    if (mode === 'ascii') ascii.render(scene, activeCam);
                    else renderer.render(scene, activeCam);
                    if (modelGroup) {
                        const ndc = _mc.clone().project(activeCam);
                        focusBtn.classList.toggle('visible', Math.abs(ndc.x) > 0.92 || Math.abs(ndc.y) > 0.92 || ndc.z > 1);
                    }
                })();
            });
        }

        // ================================================================
        // MENU WINDOW  (permanent — no close button)
        // ================================================================
        // ================================================================
        // ORDER LAYOUT
        // ================================================================
        function orderWindows() {
            const ws  = document.getElementById('workspace');
            const sw  = window.innerWidth, sh = window.innerHeight;
            const gap = 8,  leftX = 28, topY = 28;

            // Pin menu top-left
            const menuEl = document.getElementById('menu-body-inner')?.closest('.win-frame');
            if (menuEl) { menuEl.style.left = leftX + 'px'; menuEl.style.top = topY + 'px'; menuEl.style.zIndex = ++topZ; }

            // Pin theme below menu
            const themeFrame = openWins['theme'];
            const menuBottom = menuEl ? menuEl.offsetTop + menuEl.offsetHeight : topY;
            const leftColW   = menuEl ? menuEl.offsetWidth + gap : 228 + gap;
            if (themeFrame) {
                themeFrame.style.left = leftX + 'px';
                themeFrame.style.top  = (menuBottom + gap) + 'px';
                themeFrame.style.zIndex = ++topZ;
            }

            // Collect all movable windows + floating images + slideshows
            const frames = [...ws.querySelectorAll('.win-frame')].filter(f => f !== menuEl && f !== themeFrame);
            const floats = [...ws.querySelectorAll('.img-float')];
            const slides = [...ws.querySelectorAll('.slide-float')];
            const all    = [...frames, ...floats, ...slides];
            if (!all.length) return;

            // Weight determines relative area: heavier = more space
            function weight(f) {
                if (f.classList.contains('img-float')) return 1.5;
                if (f.classList.contains('slide-float')) return 3;
                if (f.querySelector('.cv-canvas')) return 4;
                if (f.querySelector('.gallery-body')) {
                    const n = f.querySelectorAll('.gallery-thumb').length || 1;
                    return n <= 2 ? 1.5 : n <= 6 ? 2.5 : 4;
                }
                return 1;
            }
            const totalW = arr => arr.reduce((s, f) => s + weight(f), 0);

            // Sort heaviest first so large windows anchor the layout
            all.sort((a, b) => weight(b) - weight(a));

            // BSP: recursively fill rect with windows
            function bsp(rect, wins) {
                if (!wins.length) return;

                if (wins.length === 1) {
                    const f = wins[0];
                    const w = Math.max(f.classList.contains('img-float') ? 120 : 260, rect.w);
                    const h = Math.max(f.classList.contains('img-float') ? 80  : 180, rect.h);
                    Object.assign(f.style, {
                        left: rect.x + 'px', top: rect.y + 'px',
                        width: w + 'px', height: h + 'px', zIndex: ++topZ
                    });
                    f.dispatchEvent(new CustomEvent('win-resize'));
                    return;
                }

                // Split: along the longer axis
                const splitH = rect.w >= rect.h;
                const half   = Math.ceil(wins.length / 2);
                const left   = wins.slice(0, half);
                const right  = wins.slice(half);
                const ratio  = totalW(left) / totalW(wins);

                if (splitH) {
                    const cut = Math.round(rect.x + (rect.w - gap) * ratio);
                    bsp({ x: rect.x,     y: rect.y, w: cut - rect.x,                    h: rect.h }, left);
                    bsp({ x: cut + gap,  y: rect.y, w: rect.x + rect.w - cut - gap,     h: rect.h }, right);
                } else {
                    const cut = Math.round(rect.y + (rect.h - gap) * ratio);
                    bsp({ x: rect.x, y: rect.y,     w: rect.w, h: cut - rect.y               }, left);
                    bsp({ x: rect.x, y: cut + gap,  w: rect.w, h: rect.y + rect.h - cut - gap }, right);
                }
            }

            const areaX = leftX + leftColW;
            bsp({ x: areaX, y: topY, w: sw - areaX - gap, h: sh - topY - gap }, all);
        }

        function buildMenuWindow() {
            const categories = [
                { id: 'academic',   label: 'Academic' },
                { id: 'employment', label: 'Employment' },
            ];

            const ws = document.getElementById('workspace');
            const frame = document.createElement('div');
            frame.className = 'win-frame spawning';
            frame.style.cssText = `left:28px;top:28px;width:220px;z-index:${++topZ};min-height:0;`;

            const projSections = categories.map(cat => {
                const projs = PROJECTS.filter(p => p.category === cat.id);
                return `
                    <div class="proj-row menu-cat-toggle" data-cat="${cat.id}" style="cursor:pointer;margin-top:4px;"
                         role="button" tabindex="0" aria-expanded="true" aria-controls="cat-list-${cat.id}"
                         aria-label="${cat.label} projects, collapse section">
                        <span class="proj-name" style="opacity:0.4;font-size:0.5rem;letter-spacing:0.04em;">${cat.label}</span>
                        <span class="cat-icon" style="font-size:0.5rem;opacity:0.3;user-select:none;" aria-hidden="true">&#x2212;</span>
                    </div>
                    <div class="cat-proj-list" data-cat-list="${cat.id}" id="cat-list-${cat.id}" role="group" aria-label="${cat.label} projects">
                        ${projs.map(p => `
                            <div class="proj-row" data-id="${p.id}" style="padding-left:8px;${inkOf(p) ? `--sig:${inkOf(p)};` : ''}"
                                 role="button" tabindex="0"
                                 aria-label="Open ${p.title}. Shift+Enter to open it alongside what is already here.">
                                <span class="proj-name">${p.title}</span>
                                <span class="proj-mark" aria-hidden="true"></span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');

            frame.setAttribute('role', 'navigation');
            frame.setAttribute('aria-label', 'Site menu');
            frame.innerHTML = `
                <div class="win-titlebar" style="cursor:move;">
                    <span class="win-title menu-home" role="button" tabindex="0" aria-label="Home — close the open project and return to the landing">Nir Dellus</span>
                    <span class="menu-collapse" style="font-size:0.55rem;opacity:0.3;cursor:pointer;user-select:none;padding:0 2px;flex-shrink:0;"
                          role="button" tabindex="0" aria-expanded="true" aria-label="Collapse menu">&#x2212;</span>
                </div>
                <div class="win-body menu-body" id="menu-body-inner">
                    <div class="menu-landing-title">Nir Dellus</div>
                    <div class="menu-landing-sub">Architecture &amp; Design</div>
                    <hr class="menu-rule" style="margin-bottom:6px;">
                    ${projSections}
                    <hr class="menu-rule">
                    <div class="proj-row" data-static="about"   role="button" tabindex="0" aria-label="Open About"><span class="proj-name">About</span></div>
                    <div class="proj-row" data-static="cv"      role="button" tabindex="0" aria-label="Open CV"><span class="proj-name">CV</span></div>
                    <div class="proj-row" data-static="contact" role="button" tabindex="0" aria-label="Open Contact"><span class="proj-name">Contact</span></div>
                    <hr class="menu-rule">
                    <div class="proj-row" style="gap:8px;">
                        <span class="proj-name" data-action="theme"   style="cursor:pointer;" role="button" tabindex="0" aria-label="Open theme editor">Theme</span>
                        <span style="font-size:0.5rem;opacity:0.25;user-select:none;" aria-hidden="true">&#xb7;</span>
                        <span class="proj-name" data-action="arrange" style="cursor:pointer;" role="button" tabindex="0" aria-label="Arrange open windows">Arrange</span>
                    </div>
                </div>
            `;

            ws.appendChild(frame);
            frame.addEventListener('pointerdown', () => frame.style.zIndex = ++topZ);

            // Per-category collapse
            frame.querySelectorAll('.menu-cat-toggle').forEach(toggle => {
                const cat = toggle.dataset.cat;
                const list = frame.querySelector(`[data-cat-list="${cat}"]`);
                const icon = toggle.querySelector('.cat-icon');
                let open = true;
                const toggleCat = () => {
                    open = !open;
                    list.style.display = open ? '' : 'none';
                    icon.textContent = open ? String.fromCharCode(8722) : '+';
                    toggle.setAttribute('aria-expanded', String(open));
                    toggle.setAttribute('aria-label',
                        `${toggle.querySelector('.proj-name').textContent} projects, ${open ? 'collapse' : 'expand'} section`);
                };
                toggle.addEventListener('click', toggleCat);
                onActivateKey(toggle, toggleCat);
            });

            // Window collapse
            let collapsed = false;
            const body = frame.querySelector('#menu-body-inner');
            const toggleBtn = frame.querySelector('.menu-collapse');
            function toggleCollapse() {
                collapsed = !collapsed;
                body.style.display = collapsed ? 'none' : '';
                toggleBtn.textContent = collapsed ? '+' : String.fromCharCode(8722);
                toggleBtn.setAttribute('aria-expanded', String(!collapsed));
                toggleBtn.setAttribute('aria-label', collapsed ? 'Expand menu' : 'Collapse menu');
            }
            frame._toggleCollapse = toggleCollapse;
            frame._collapsed = () => collapsed;
            toggleBtn.addEventListener('click', e => { e.stopPropagation(); toggleCollapse(); });
            onActivateKey(toggleBtn, toggleCollapse);
            frame.querySelector('.win-titlebar').addEventListener('dblclick', toggleCollapse);

            // Drag
            const tb = frame.querySelector('.win-titlebar');
            let dragging = false, ox = 0, oy = 0;
            tb.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target === toggleBtn) return;
                dragging = true;
                ox = e.clientX - frame.offsetLeft;
                oy = e.clientY - frame.offsetTop;
                document.body.classList.add('dragging'); e.preventDefault();
            });
            document.addEventListener('pointermove', e => {
                if (!dragging || !e.isPrimary) return;
                frame.style.left = Math.max(0, e.clientX - ox) + 'px';
                frame.style.top  = Math.max(0, e.clientY - oy) + 'px';
            });
            document.addEventListener('pointerup', () => {
                if (dragging) { dragging = false; document.body.classList.remove('dragging'); }
            });
            document.addEventListener('pointercancel', () => {
                if (dragging) { dragging = false; document.body.classList.remove('dragging'); }
            });

            // Bind click + Enter/Space together so every menu row is reachable
            // by keyboard, not just by pointer.
            const bind = (el, fn) => { el.addEventListener('click', fn); onActivateKey(el, fn); };

            // A project row has two behaviours (Nir, 2026-09-29):
            //   left-click / Enter   → GO TO the project: the one you were in
            //                          closes, this one opens, and its colour
            //                          becomes the colour of the whole site
            //   right-click / Shift+Enter → open it ALONGSIDE whatever is
            //                          already here, tinted in its own colour
            //                          but leaving the site's alone
            // Right-click is mouse-only, hence the Shift+Enter twin — every
            // other control in this file is reachable from the keyboard and
            // this one is no exception.
            frame.querySelectorAll('.proj-row[data-id]').forEach(el => {
                const project = PROJECTS.find(p => p.id === el.dataset.id);
                if (!project) return;
                el.addEventListener('click', () => goToProject(project));
                onActivateKey(el, (e) => {
                    if (e && e.shiftKey) openAlongside(project);
                    else goToProject(project);
                });
                el.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    openAlongside(project);
                });
                el.addEventListener('pointerenter', () => setMenuHot(project.id, true));
                el.addEventListener('pointerleave', () => setMenuHot(project.id, false));
            });
            frame.querySelectorAll('.proj-row[data-static]').forEach(el => {
                bind(el, () => openText(el.dataset.static));
            });
            frame.querySelectorAll('[data-action]').forEach(el => {
                const action = el.dataset.action;
                if (action === 'theme')   bind(el, () => openTheme());
                if (action === 'arrange') bind(el, () => { orderWindows(); announce('Windows arranged'); });
            });

            // Home. The title sits inside the titlebar, which is also the drag
            // handle and carries a dblclick-to-collapse — so this has to stop
            // pointerdown from reaching the drag, or every click would start a
            // drag instead of going home.
            const homeEl = frame.querySelector('.menu-home');
            if (homeEl) {
                homeEl.addEventListener('pointerdown', e => e.stopPropagation());
                homeEl.addEventListener('dblclick', e => e.stopPropagation());
                bind(homeEl, e => { if (e) e.stopPropagation(); goHome(); });
            }

            // Roving arrow-key navigation between menu rows, so a keyboard
            // user can walk the project list without tabbing through every
            // interactive element in the window.
            frame.addEventListener('keydown', e => {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                const rows = [...frame.querySelectorAll('[role="button"][tabindex="0"]')]
                    .filter(r => r.offsetParent !== null);
                const i = rows.indexOf(document.activeElement);
                if (i === -1) return;
                e.preventDefault();
                rows[(i + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length].focus();
            });

            return frame;
        }
        // ── LANDING ───────────────────────────────────────────────────────
        // Opens what content/landing.txt describes. Nothing here is a new kind
        // of window: an `image` entry goes through openImage and a `model`
        // entry through open3D, exactly as a project's own windows do. The only
        // additions are the project's colour painted onto the frame, and the
        // hatch that offers the way in.
        function landingWindows() {
            return [...document.querySelectorAll('[data-landing]')].filter(el => !el.classList.contains('closing'));
        }
        function closeLanding() {
            const wins = landingWindows();
            wins.forEach(el => el._close && el._close());
            return wins.length;
        }

        // The pointer rests → the window hatches over and offers the way in.
        // Live FIRST, invitation second (Nir, 2026-09-29): the overlay is
        // pointer-events:none until it actually appears, and any movement or
        // press restarts the timer, so orbiting a model never summons it.
        function attachHatch(el, project) {
            const host = el.querySelector('.win-body') || el;
            if (getComputedStyle(host).position === 'static') host.style.position = 'relative';

            const ov = document.createElement('div');
            ov.className = 'win-hatch';
            ov.innerHTML = `
                <div class="win-hatch-inner">
                    <button type="button" class="win-hatch-go">Go to ${project.title}</button>
                    <button type="button" class="win-hatch-stay">Stay here</button>
                </div>`;
            host.appendChild(ov);

            let timer = null, shown = false, suppressed = false;
            const show = () => { if (shown || suppressed) return; shown = true; ov.classList.add('shown'); };
            const hide = () => { shown = false; ov.classList.remove('shown'); };
            const arm  = () => {
                if (shown || suppressed) return;
                clearTimeout(timer);
                timer = setTimeout(show, 900);
            };
            const disarm = () => clearTimeout(timer);

            host.addEventListener('pointerenter', () => { setMenuHot(project.id, true); arm(); });
            host.addEventListener('pointermove', arm);
            host.addEventListener('pointerdown', arm);
            host.addEventListener('pointerleave', () => {
                setMenuHot(project.id, false);
                disarm(); hide(); suppressed = false;   // leaving clears the refusal
            });

            ov.querySelector('.win-hatch-go').addEventListener('click', () => goToProject(project));
            // The clear "no" Nir asked for. Suppressed until the pointer leaves
            // and comes back, so it cannot immediately nag again.
            const cancel = () => { disarm(); hide(); suppressed = true; };
            ov.querySelector('.win-hatch-stay').addEventListener('click', cancel);
            // Escape must cancel the HATCH, not close the window. makeFrame
            // registers its own Escape→close on the frame at creation, and a
            // later frame listener runs after it — so this goes on the overlay,
            // a descendant, which fires first. Same fix as the model dropdown.
            ov.addEventListener('keydown', e => {
                if (e.key !== 'Escape' || !shown) return;
                e.stopPropagation();
                cancel();
            });
            ov.tabIndex = -1;
        }

        // Authored geometry is in PERCENT of the viewport, so a composition
        // holds its proportions on any screen instead of being pinned to the
        // pixels of whatever display it was arranged on.
        function placeLanding(el, entry) {
            if (!entry || !entry.at || !entry.size) return;
            const [x, y] = entry.at, [w, h] = entry.size;
            el.dataset.sizeLocked = '1';
            Object.assign(el.style, {
                left:   (x / 100 * window.innerWidth)  + 'px',
                top:    (y / 100 * window.innerHeight) + 'px',
                width:  (w / 100 * window.innerWidth)  + 'px',
                height: (h / 100 * window.innerHeight) + 'px',
            });
            el.dispatchEvent(new CustomEvent('win-resize'));
        }

        // ── LAYOUT TOOL — DEVELOPMENT ONLY ────────────────────────────────
        // Off unless the URL carries ?layout, so a visitor can never reach it
        // and nothing about it is built into the page they load. Arrange the
        // landing windows by hand, press Copy, paste the block into
        // content/landing.txt.
        //
        // An image window is the awkward one: openImage resizes it to the
        // image's natural size on load, so its authored height is only
        // honoured once — read the real rect, not the authored numbers.
        function initLayoutTool() {
            if (!new URLSearchParams(location.search).has('layout')) return;
            if (document.getElementById('layout-tool')) return;

            const pct = (v, total) => Math.round(v / total * 1000) / 10;   // percent, one decimal
            const block = () => {
                const rows = [...document.querySelectorAll('[data-landing]')]
                    .sort((a, b) => (+a.dataset.landingIdx) - (+b.dataset.landingIdx))
                    .map(el => {
                        const r = el.getBoundingClientRect();
                        const geo = `at ${pct(r.left, innerWidth)} ${pct(r.top, innerHeight)}` +
                                    ` size ${pct(r.width, innerWidth)} ${pct(r.height, innerHeight)}`;
                        if (el.dataset.landing === 'text') return `  text${' '.repeat(38)}${geo}`;
                        // Only an image line carries a filename, and it is the
                        // path relative to that project's gallery/ — a model
                        // line names no file at all.
                        const file = el.dataset.landing === 'image' && el.dataset.landingSrc
                            ? ' ' + el.dataset.landingSrc.split('/gallery/')[1] : '';
                        const head = `  ${el.dataset.projectId}  ${el.dataset.landing}${file}`;
                        return head + ' '.repeat(Math.max(2, 42 - head.length)) + geo;
                    });
                return 'windows:\n' + rows.join('\n');
            };

            const el = document.createElement('div');
            el.id = 'layout-tool';
            el.innerHTML = `
                <div class="layout-tool-head">
                    <button type="button" class="layout-fold" aria-expanded="true" title="Fold">−</button>
                    <strong>Layout</strong>
                    <span class="layout-hint">— drag and resize, then copy into content/landing.txt</span>
                    <button type="button" class="layout-copy">Copy</button>
                    <button type="button" class="layout-refresh">Refresh</button>
                </div>
                <textarea class="layout-out" readonly rows="6" spellcheck="false"></textarea>`;
            document.body.appendChild(el);

            // Folds to a single strip so it stops covering the canvas you are
            // composing. Copy and Refresh stay reachable while folded — the
            // whole point is to arrange, copy, and never unfold. The state is
            // remembered, so it does not spring open on every reload.
            const foldBtn = el.querySelector('.layout-fold');
            const setFold = (folded, save = true) => {
                el.classList.toggle('folded', folded);
                foldBtn.textContent = folded ? '+' : '\u2212';
                foldBtn.title = folded ? 'Unfold' : 'Fold';
                foldBtn.setAttribute('aria-expanded', String(!folded));
                if (save) { try { localStorage.setItem('dellus-layout-folded', folded ? '1' : '0'); } catch {} }
            };
            let startFolded = false;
            try { startFolded = localStorage.getItem('dellus-layout-folded') === '1'; } catch {}
            setFold(startFolded, false);
            foldBtn.addEventListener('click', () => setFold(!el.classList.contains('folded')));

            const out = el.querySelector('.layout-out');
            const refresh = () => { out.value = block(); };
            refresh();
            el.querySelector('.layout-refresh').addEventListener('click', refresh);
            el.querySelector('.layout-copy').addEventListener('click', async () => {
                refresh();
                out.select();
                const btn = el.querySelector('.layout-copy');
                try { await navigator.clipboard.writeText(out.value); btn.textContent = 'Copied'; }
                catch { btn.textContent = 'Select + copy'; }
                setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
            });
            // Keep it current as the windows are moved about.
            document.addEventListener('pointerup', () => setTimeout(refresh, 60));
        }

        function openLanding() {
            if (typeof LANDING === 'undefined' || !LANDING) { menuFrame._toggleCollapse(); return; }
            restoreUserTheme();     // the landing's own pair, unless the visitor has chosen

            // The text window. Plain makeFrame — it belongs to no project, so it
            // carries no colour and no hatch.
            const tf = makeFrame({ title: LANDING.title, w: 380, h: 200, minH: 120, key: 'landing-text', bodyDrag: true });
            tf.dataset.landing = 'text';
            const textEntry = LANDING.windows.find(w => w.kind === 'text');
            tf.dataset.landingIdx = String(LANDING.windows.indexOf(textEntry));
            placeLanding(tf, textEntry);
            const tb = tf.querySelector('.win-body');
            tb.className += ' info-body';
            tb.innerHTML = `<div class="info-desc">${descHTML(LANDING.text)}</div>`;

            // open3D awaits the GLTF loader, so its window does not exist yet
            // when this returns. Each entry dresses itself once its window
            // appears, and the canvas is only laid out when the last one has —
            // tiling earlier arranges a half-built landing.
            // Geometry is all-or-nothing: a composition is either fully authored
            // (every window carries at + size) or fully auto-tiled. A mixture
            // would leave some windows placed and some landing wherever, which
            // reads as a bug rather than as a layout.
            const placed = LANDING.windows.length > 0 &&
                           LANDING.windows.every(w => w.at && w.size);
            let pending = LANDING.windows.filter(w => w.kind !== 'text').length;
            const finish = () => {
                if (!placed) requestAnimationFrame(() => orderWindows());
                requestAnimationFrame(initLayoutTool);
            };
            const settle = () => { if (--pending <= 0) finish(); };

            LANDING.windows.forEach((w, i) => {
                if (w.kind === 'text') return;              // already built above
                const project = PROJECTS.find(p => p.id === w.project);
                if (!project) { settle(); return; }
                if (w.kind === 'model') {
                    open3D(project);
                } else {
                    openImage({ src: w.src, key: `landing-img-${i}`, projectId: project.id,
                                fallbackLabel: `${project.title} — from the gallery` });
                }
                let tries = 0;
                const dress = () => {
                    const wins = projectWindows(project.id).filter(el => !el.dataset.landing);
                    if (!wins.length) {
                        if (++tries < 180) requestAnimationFrame(dress);
                        else settle();                       // gave up; don't strand the layout
                        return;
                    }
                    wins.forEach(el => {
                        el.dataset.landing = w.kind;
                        // INK ONLY on the landing (Nir, 2026-09-29). Every window
                        // here shares the landing's background; what differs per
                        // project is the ink — the border, the title, the ASCII.
                        // The background only shifts once you enter a project and
                        // that project owns the page.
                        tintFrame(el, inkOf(project), null);
                        attachHatch(el, project);
                        el.dataset.landingIdx = String(i);
                        if (w.src) el.dataset.landingSrc = w.src;
                        placeLanding(el, w);
                    });
                    // openImage resizes the window to the image's natural size
                    // on load — which lands AFTER the tiler would have run and
                    // snaps the window back to its own width while keeping the
                    // tiled position, pushing it off a narrow screen. So an
                    // image entry is not "settled" until its image is in.
                    const img = w.kind === 'image' && wins[0].querySelector('img');
                    if (img && !img.complete) {
                        img.addEventListener('load',  settle, { once: true });
                        img.addEventListener('error', settle, { once: true });
                    } else {
                        settle();
                    }
                };
                dress();
            });

            if (pending <= 0) finish();   // a landing with no project windows
        }

        // ── STRUCTURED DATA (SEO-06) ──────────────────────────────────────
        // Built from PROJECTS/STATIC at runtime rather than hand-written into
        // the markup, so it can never drift from the content the site shows
        // (the meta.md lesson — one source of truth, see assets/projects/README.md).
        //
        // Tradeoff: this requires the crawler to execute JS. Google does;
        // some others do not. Static JSON-LD would be more robust, but with
        // no build step in this repo it would mean a second copy of every
        // project's metadata. If a build step ever lands, prerender this.
        //
        // Deliberately omits email and date of birth — STATIC.cv holds both,
        // and structured data is exactly the wrong place to publish them.
        function injectStructuredData() {
            const SITE = 'https://dellus.xyz/';
            const person = {
                '@type': 'Person',
                '@id': SITE + '#nir-dellus',
                name: 'Nir Dellus',
                jobTitle: 'Architect and Researcher',
                url: SITE,
                alumniOf: { '@type': 'CollegeOrUniversity', name: 'Bezalel Academy of Arts and Design' },
                knowsAbout: ['Architecture', 'Computational Design', 'Architectural Theory', 'Digital Fabrication'],
            };
            const works = (typeof PROJECTS !== 'undefined' ? PROJECTS : []).map(p => {
                const w = {
                    '@type': 'CreativeWork',
                    name: p.title,
                    creator: { '@id': SITE + '#nir-dellus' },
                    isPartOf: { '@id': SITE + '#portfolio' },
                };
                if (p.year)        w.dateCreated     = p.year;
                if (p.location)    w.locationCreated = { '@type': 'Place', name: p.location };
                if (p.type)        w.genre           = p.type;
                // First line only — the full descriptions run to 4,000+ chars.
                if (p.description) w.description     = String(p.description).split('\n')[0].slice(0, 500);
                if (p.images && p.images.length) w.image = SITE + (p.images[0].src || p.images[0]);
                return w;
            });
            const graph = {
                '@context': 'https://schema.org',
                '@graph': [
                    person,
                    {
                        '@type': 'WebSite',
                        '@id': SITE + '#portfolio',
                        url: SITE,
                        name: 'Nir Dellus — Architecture & Design Portfolio',
                        inLanguage: 'en',
                        author: { '@id': SITE + '#nir-dellus' },
                    },
                    ...works,
                ],
            };
            const tag = document.createElement('script');
            tag.type = 'application/ld+json';
            // textContent, never innerHTML — project text is user-authored.
            tag.textContent = JSON.stringify(graph);
            document.head.appendChild(tag);
        }
        injectStructuredData();

        // ── LANDING STATE (2026-09-29) ────────────────────────────────────
        // Replaces the 2026-09-21 placeholder (the menu, collapsed, and nothing
        // else). A visitor now arrives at a set of ORDINARY windows borrowed
        // from real projects — same openImage / open3D factories as everything
        // else, no special case — each tinted in its project's own colour, plus
        // one text window. What appears is authored in content/landing.txt.
        //
        // The theme editor is still not opened at load; it is reachable from
        // the menu's Theme row. Every openWins['theme'] read is null-guarded
        // (tileProjectWindows, orderWindows), so nothing assumes it exists.
        // The saved theme is restored BEFORE the landing opens: a landing 3D
        // viewer reads its ink and canvas at construction, so applying the
        // visitor's theme afterwards would leave that first render stale.
        const savedScale = parseFloat(localStorage.getItem('dellus-font-scale'));
        if (!isNaN(savedScale)) document.documentElement.style.setProperty('--font-scale', savedScale);
        const savedBg = localStorage.getItem('dellus-bg');
        if (savedBg) document.documentElement.style.setProperty('--bg', savedBg);
        const savedFg = localStorage.getItem('dellus-fg');
        if (savedFg) {
            document.documentElement.style.setProperty('--fg', savedFg);
            document.documentElement.style.setProperty('--border-strong', savedFg);
        }
        const savedFontId = localStorage.getItem('dellus-font-id');
        if (savedFontId) {
            const savedFont = FONTS.find(f => f.id === savedFontId);
            if (savedFont) {
                document.documentElement.style.setProperty('--font-family', savedFont.family);
                document.documentElement.style.setProperty('--font-var', savedFont.varSet);
            }
        }

        const menuFrame = buildMenuWindow();

        // The menu's "open" dimming is derived from the canvas, so it has to be
        // recomputed whenever a window appears or disappears — including the
        // 220ms-delayed removal inside closeFrame, and closes triggered by
        // Escape or by code rather than by the × button.
        new MutationObserver(syncMenuOpen)
            .observe(document.getElementById('workspace'), { childList: true });

        openLanding();

        document.getElementById('err-banner').style.display = 'none';

    </script>
    <script>
        window.addEventListener('error', e => {
            const b = document.getElementById('err-banner');
            if (b) { b.style.display = 'block'; b.textContent = 'JS ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + e.lineno; }
        });
        window.addEventListener('unhandledrejection', e => {
            const b = document.getElementById('err-banner');
            if (b) { b.style.display = 'block'; b.textContent = 'MODULE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason); }
        });
    </script>
</body>
</html>
