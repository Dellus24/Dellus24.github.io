        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: calc(var(--font-scale) * 16px); }

        html, body {
            height: 100%; width: 100%; overflow: hidden;

            font-family: var(--font-family);
            font-variation-settings: var(--font-var);

        /* ── MENU WINDOW ─────────────────────────────────────── */
        .menu-body { padding: 20px 20px 16px 20px; overflow-y: auto; }

        .menu-landing-title {
            font-size: 1.45rem; letter-spacing: 0.22em;
            text-transform: uppercase; font-weight: bold;
            user-select: none; line-height: 1;
            margin-bottom: 4px;
        }
        .menu-landing-sub {
            font-size: 0.45rem; letter-spacing: 0.16em;
            text-transform: uppercase; opacity: 0.35;
            user-select: none; margin-bottom: 16px;
        }

        .menu-title {
            font-size: 0.95rem; letter-spacing: 0.18em;
            text-transform: uppercase; font-weight: bold;
            margin-bottom: 18px; user-select: none;
        }

        .menu-nav {
            display: flex; align-items: center; gap: 5px;
            margin-bottom: 14px; flex-wrap: wrap;
        }

        .nav-link {
            font-size: 0.6rem; letter-spacing: 0.1em;
            text-transform: uppercase; cursor: pointer;
            opacity: 0.45; transition: opacity 0.15s, font-weight 0.15s;
            user-select: none;
        }
        .nav-link:hover { opacity: 1; font-weight: bold; }

        .nav-sep { font-size: 0.55rem; opacity: 0.25; user-select: none; }

        .menu-rule {
            border: none; border-top: 1px solid rgba(0,0,0,0.1);
            margin: 12px 0;
        }

        .cat-label {
            font-size: 0.5rem; letter-spacing: 0.14em;
            text-transform: uppercase; opacity: 0.3;
            margin: 10px 0 5px 0; user-select: none;
        }

        .proj-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 3px 0; cursor: pointer; gap: 6px;
        }

        .proj-name {
            font-size: 0.65rem; letter-spacing: 0.05em;
            text-transform: uppercase; opacity: 0.6;
            transition: opacity 0.15s, font-weight 0.15s;
            user-select: none; line-height: 1.4;
        }
        .proj-row:hover .proj-name { opacity: 1; font-weight: bold; }
        .proj-row.open .proj-name  { opacity: 0.3; }

        /* ── WORKSPACE ──────────────────────────────────────── */
        .workspace {
            position: fixed; top: 0;
            left: 0; right: 0; bottom: 0;
            overflow: auto;
        }

        body.dragging  { cursor: move !important; user-select: none; }
        .win-frame.win-draggable { cursor: grab; }
        .win-frame.win-draggable:active { cursor: grabbing; }
        body.resizing  { user-select: none; }

        /* Touch: drag surfaces must not pan/zoom the page */
        .win-titlebar, .win-resize-edge, .slide-float, .img-float,
        .slide-resize, .img-float-resize { touch-action: none; }

        /* ── Slideshow ── */
        .slide-float {
            position: absolute; overflow: hidden;
            background: var(--bg); border: 1px solid var(--border-strong);
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            user-select: none; transition: box-shadow 0.15s;
            cursor: grab;
        }
        .slide-float:active { cursor: grabbing; }
        .slide-float img {
            position: absolute; inset: 0 0 28px 0;
            width: 100%; height: calc(100% - 28px);
            object-fit: contain; display: block; pointer-events: none;
        }
        .slide-nav {
            position: absolute; top: 0; bottom: 28px; width: 22%;
            display: flex; align-items: center;
            cursor: pointer; opacity: 0; transition: opacity 0.15s;
        }
        .slide-float:hover .slide-nav { opacity: 1; }
        .slide-nav-prev { left: 0; justify-content: flex-start; padding-left: 10px; }
        .slide-nav-next { right: 0; justify-content: flex-end;  padding-right: 10px; }
        .slide-chevron {
            font-size: 1.1rem; color: var(--fg); opacity: 0.4;
            transition: opacity 0.1s; text-shadow: 0 0 6px var(--bg);
        }
        .slide-nav:hover .slide-chevron { opacity: 1; }
        .slide-bar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 28px;
            display: flex; align-items: center; padding: 0 8px; gap: 8px;
            border-top: 1px solid var(--border-strong);
            font-size: 0.55rem; opacity: 0; transition: opacity 0.2s;
        }
        .slide-float:hover .slide-bar { opacity: 1; }
        .slide-title  { flex: 1; opacity: 0.5; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .slide-counter { opacity: 0.35; flex-shrink: 0; }
        .slide-close  { opacity: 0.3; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; }
        .slide-close:hover { opacity: 0.9; }
        .slide-resize {
            position: absolute; bottom: 0; right: 0;
            width: 14px; height: 14px; cursor: nwse-resize;
        }

        /* ג"€ג"€ WINDOW FRAME ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .win-frame {
            position: absolute;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            display: flex; flex-direction: column;
            min-width: 260px; min-height: 180px;
        }
        .win-frame.focused { z-index: 500; }

        @keyframes winSpawn {
            from { opacity: 0; transform: scale(0.93); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes winClose {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0; transform: scale(0.93); }
        }
        .win-frame.spawning { animation: winSpawn 0.3s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
        .win-frame.closing  { animation: winClose 0.22s ease forwards; pointer-events: none; }

        .win-titlebar {
            height: 24px; min-height: 24px;
            border-bottom: 1px solid transparent;
            display: flex; align-items: center;
            padding: 0 8px; cursor: move;
            user-select: none; gap: 8px; flex-shrink: 0;
            transition: border-color 0.2s;
        }
        .win-frame:hover .win-titlebar { border-bottom-color: var(--border-strong); }

        .win-title {
            font-size: 0.5rem; letter-spacing: 0.12em;
            text-transform: uppercase; opacity: 0; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: opacity 0.2s;
        }
        .win-frame:hover .win-title { opacity: 0.5; }
        .win-type-tag { transition: opacity 0.2s; }
        .win-frame:hover .win-type-tag { opacity: 0.25; }

        .win-type-tag {
            font-size: 0.38rem; letter-spacing: 0.08em;
            text-transform: uppercase; opacity: 0;
            white-space: nowrap;
        }

        .win-close {
            font-size: 0.55rem; opacity: 0; cursor: pointer;
            transition: opacity 0.15s; padding: 0 2px;
            user-select: none; flex-shrink: 0;
        }
        .win-frame:hover .win-close { opacity: 0.3; }
        .win-close:hover { opacity: 0.9 !important; }
        .win-collapse {
            font-size: 0.55rem; opacity: 0; cursor: pointer;
            transition: opacity 0.15s; padding: 0 2px;
            user-select: none; flex-shrink: 0;
        }
        .win-frame:hover .win-collapse { opacity: 0.3; }
        .win-collapse:hover { opacity: 0.9 !important; }

        .win-body {
            flex: 1; overflow: auto; position: relative;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .win-body::-webkit-scrollbar { display: none; }

        .cscroll-track {
            position: absolute; right: 5px; width: 1px;
            background: var(--fg); opacity: 0; pointer-events: none;
            transition: opacity 0.2s;
        }
        .win-frame:hover .cscroll-track { opacity: 0.12; }
        .cscroll-thumb {
            position: absolute; left: -3px; right: -3px;
            height: 6px; border-radius: 50%;
            background: var(--fg); opacity: 0.45;
        }

        .win-resize-edge { position: absolute; z-index: 10; }
        .win-resize-edge[data-dir="n"]  { top: -3px; left: 10px; right: 10px; height: 7px; cursor: ns-resize; }
        .win-resize-edge[data-dir="s"]  { bottom: -3px; left: 10px; right: 10px; height: 7px; cursor: ns-resize; }
        .win-resize-edge[data-dir="e"]  { right: -3px; top: 10px; bottom: 10px; width: 7px; cursor: ew-resize; }
        .win-resize-edge[data-dir="w"]  { left: -3px; top: 10px; bottom: 10px; width: 7px; cursor: ew-resize; }
        .win-resize-edge[data-dir="nw"] { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
        .win-resize-edge[data-dir="ne"] { top: -3px; right: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-edge[data-dir="sw"] { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-edge[data-dir="se"] { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: nwse-resize; }

        /* ג"€ג"€ INFO WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .info-body {
            padding: 16px 18px;
            display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto;
        }

        .info-meta {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.48rem; letter-spacing: 0.08em;
            text-transform: uppercase; opacity: 0.4;
            flex-wrap: wrap;
        }
        .info-meta-sep { opacity: 0.4; }

        .info-participants {
            font-size: 0.48rem; letter-spacing: 0.06em;

        }

        .info-desc {
            font-size: 0.62rem; letter-spacing: 0.03em;
            line-height: 1.7; opacity: 0.75; flex: 1;
        }

        .info-tags {
            display: flex; flex-wrap: wrap; gap: 5px;
        }

        .tag {
            font-size: 0.38rem; letter-spacing: 0.1em;
            text-transform: uppercase; opacity: 0.3;

        }

        .info-actions {

        }

        .action-btn {
            font-family: var(--font-family);

            border: 1px solid rgba(0,0,0,0.25); cursor: pointer;

            transition: opacity 0.15s, background 0.15s, color 0.15s;
        }
        .action-btn:hover { opacity: 1; background: var(--fg); color: var(--bg); }

        /* ג"€ג"€ GALLERY WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .gallery-body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1px; padding: 1px; overflow-y: auto; flex: 1;
        }

        .gallery-thumb {
            position: relative; aspect-ratio: 4/3;
            overflow: hidden; cursor: pointer; background: rgba(0,0,0,0.04);
        }
        .gallery-thumb img {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 0.2s; display: block;
        }
        .gallery-thumb:hover img { opacity: 0.75; }

        .thumb-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            font-size: 0.38rem; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 4px 6px;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            opacity: 0; transition: opacity 0.2s;
        }
        .gallery-thumb:hover .thumb-label { opacity: 1; }

        .gallery-present {
            display: flex; flex-direction: column; flex: 1; height: 100%;
        }
        .gallery-present img {
            flex: 1; width: 100%; object-fit: contain;
            display: block; background: var(--bg); min-height: 0;
        }
        .present-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-top: 1px solid var(--border-strong);
            flex-shrink: 0;
        }
        .present-nav, .present-back {
            font-family: var(--font-family);
            font-size: 0.5rem; letter-spacing: 0.1em;
            background: none; border: none; cursor: pointer;
            opacity: 0.4; transition: opacity 0.15s; color: var(--fg);
            padding: 2px 4px;
        }
        .present-nav:hover, .present-back:hover { opacity: 1; }
        .present-label {
            flex: 1; font-size: 0.45rem; letter-spacing: 0.08em;
            text-transform: uppercase; opacity: 0.4; text-align: center;
        }

        /* -- THEME WINDOW -- */

            padding: 18px 20px; display: flex; flex-direction: column; gap: 18px;
        }

        .theme-row-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .theme-row-label {
            font-size: 0.45rem; letter-spacing: 0.14em;
            text-transform: uppercase; opacity: 0.4; user-select: none;
        }
        .theme-row-sublabel {
            font-size: 0.38rem; letter-spacing: 0.12em;
            text-transform: uppercase; opacity: 0.25;
            margin-top: 2px; user-select: none;
        }
        .theme-font-line { display: flex; align-items: center; gap: 10px; }
        .theme-font-label {
            font-size: 0.55rem; opacity: 0.5;
            user-select: none; line-height: 1;
        }
        .theme-font-label.lg { font-size: 0.85rem; }
        .theme-slider {
            -webkit-appearance: none; appearance: none;
            flex: 1; height: 1px; background: var(--fg);

        }
        .theme-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;

        }
        .theme-slider::-webkit-slider-thumb:hover { transform: scale(1.35); }
        .theme-slider::-moz-range-thumb {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--fg); cursor: pointer; border: none;
        }
        .theme-swatches {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .theme-swatch {
            width: 16px; height: 16px; border-radius: 50%;
            border: 1px solid var(--border-strong);
            cursor: pointer; padding: 0; flex-shrink: 0;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative; font-family: var(--font-family);
            font-size: 0.55rem; color: var(--fg);
            display: flex; align-items: center; justify-content: center;
        }
        .theme-swatch:hover { transform: scale(1.2); }
        .theme-swatch.active {
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg);

        }
        .theme-swatch-custom {
            background: transparent; border-style: dashed; opacity: 0.5;
        }
        .theme-swatch-custom:hover { opacity: 1; }
        .theme-color-input {
            position: absolute; width: 0; height: 0;

        }

            outline-offset: 2px;

        /* Frames get focus programmatically on open; a ring around the whole
           window would be noisy, so mark it with the titlebar instead. */
        .win-frame:focus { outline: none; }
        .win-frame:focus-visible { outline: none; }
        .win-frame:focus-visible > .win-titlebar,

        .skip-link {

<body>

    <a href="#menu-body-inner" class="skip-link">Skip to menu</a>
    <div class="workspace" id="workspace" role="main" aria-label="Project workspace"></div>
    <div id="err-banner" style="display:none;position:fixed;top:0;left:0;right:0;padding:10px 16px;background:#c00;color:#fff;font:12px monospace;z-index:9999;white-space:pre-wrap;"></div>

    <script src="js/config.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

        // ================================================================
        // WINDOW SYSTEM
        // ================================================================
        let topZ = 50;
        const openWins = {};

        function nextSpawn(w = 300, h = 250) {
            const sw = window.innerWidth, sh = window.innerHeight;
            const pad = 28, step = 32, margin = 10;
            const frames = [...document.querySelectorAll('.win-frame')].map(f => ({
                x: f.offsetLeft, y: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight
            }));
            function free(x, y) {
                if (x + w > sw - pad || y + h > sh - pad) return false;
                for (const f of frames) {
                    if (x < f.x + f.w + margin && x + w + margin > f.x &&
                        y < f.y + f.h + margin && y + h + margin > f.y) return false;
                }
                return true;
            }
            for (let row = pad; row + h < sh - pad; row += step)
                for (let col = pad; col + w < sw - pad; col += step)
                    if (free(col, row)) return { x: col, y: row };
            return { x: Math.max(pad, Math.min(sw - w - pad, (sw - w) / 2)), y: Math.max(pad, Math.min(sh - h - pad, (sh - h) / 2)) };
        }
        function focusOrCreate(key, createFn) {
            if (openWins[key]) {
                openWins[key].style.zIndex = ++topZ;
                openWins[key].focus?.();          // re-focus instead of silently doing nothing
                return;
            }
            // Remember what the user activated, so closing can hand focus back.
            const opener = document.activeElement;
            const userDriven = opener && opener !== document.body && opener !== document.documentElement;
            createFn();
            const win = openWins[key];
            if (win && userDriven) {
                win._opener = opener;
                // Only move focus for windows the user actually opened. The
                // menu and theme editor are created during page load, and
                // stealing focus then would move it without user action and
                // knock the skip link out of first-Tab position.
                requestAnimationFrame(() => win.focus?.());
            }
        }

        // ── KEYBOARD / SCREEN-READER HELPERS (A11Y-02) ────────────────────
        // Div-based controls need Enter and Space wired up by hand; real
        // <button>s would get this free, but restyling the whole chrome is a
        // bigger change than this task.
        function onActivateKey(el, fn) {
            el.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
                e.preventDefault();
                e.stopPropagation();
                fn(e);
            });
        }

        // Single polite live region, reused for every announcement.
        let _liveRegion = null;
        function announce(msg) {
            if (!_liveRegion) {
                _liveRegion = document.createElement('div');
                _liveRegion.className = 'sr-only';
                _liveRegion.setAttribute('role', 'status');
                _liveRegion.setAttribute('aria-live', 'polite');
                document.body.appendChild(_liveRegion);
            }
            // Clear first so repeat messages are re-announced.
            _liveRegion.textContent = '';
            requestAnimationFrame(() => { _liveRegion.textContent = msg; });
        }

        // After closing a window with no recorded opener, land on whatever is
        // now on top rather than dumping focus on <body>.
        function focusTopmostWindow() {
            const wins = [...document.querySelectorAll('.win-frame, .slide-float')]
                .filter(el => !el.classList.contains('closing'));
            if (!wins.length) return;
            wins.sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
            wins[wins.length - 1].focus?.();
        }

        function makeFrame({ title, tag = '', w, h, key, minW = 260, minH = 180, bodyDrag = false, collapsible = false }) {
            const { x, y } = nextSpawn(w, h);
            const ws = document.getElementById('workspace');

            const frame = document.createElement('div');
            frame.className = 'win-frame spawning';
            frame.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++topZ}`;

            // role=dialog + tabindex=-1 so the window can take focus on open
            // and be reached again with Escape/Tab. Not aria-modal: these
            // windows are non-modal by design, several are open at once.
            frame.setAttribute('role', 'dialog');
            frame.setAttribute('aria-label', tag ? `${title} (${tag})` : title);
            frame.tabIndex = -1;

            frame.innerHTML = `
                <div class="win-titlebar">
                    <span class="win-title">${title}</span>
                    ${tag ? `<span class="win-type-tag">${tag}</span>` : ''}
                    ${collapsible ? `<span class="win-collapse" role="button" tabindex="0" aria-label="Collapse ${title}" aria-expanded="true">&#x2212;</span>` : ''}
                    <span class="win-close" role="button" tabindex="0" aria-label="Close ${title}">&#x2014;</span>
                </div>
                <div class="win-body"></div>
                <div class="cscroll-track"><div class="cscroll-thumb"></div></div>
                <div class="win-resize-edge" data-dir="n"></div>
                <div class="win-resize-edge" data-dir="s"></div>
                <div class="win-resize-edge" data-dir="e"></div>
                <div class="win-resize-edge" data-dir="w"></div>
                <div class="win-resize-edge" data-dir="nw"></div>
                <div class="win-resize-edge" data-dir="ne"></div>
                <div class="win-resize-edge" data-dir="sw"></div>
                <div class="win-resize-edge" data-dir="se"></div>
            `;

            ws.appendChild(frame);
            if (key) openWins[key] = frame;

            frame.addEventListener('pointerdown', () => frame.style.zIndex = ++topZ);

            // Document-level listeners are registered with this controller and
            // released when the window closes, so they don't accumulate.
            const docAC = new AbortController();
            const docSig = { signal: docAC.signal };

            // Close. closeFrame is shared by the button, Enter/Space on it,
            // and Escape from anywhere inside the window.
            function closeFrame() {
                docAC.abort();
                frame.classList.add('closing');
                announce(`${title} window closed`);
                // Hand focus back so the keyboard user isn't dropped on <body>.
                const back = frame._opener;
                setTimeout(() => {
                    frame.remove();
                    if (key) delete openWins[key];
                    if (back && back.isConnected) back.focus();
                    else focusTopmostWindow();
                }, 220);
            }
            const closeBtn = frame.querySelector('.win-close');
            closeBtn.addEventListener('click', e => { e.stopPropagation(); closeFrame(); });
            onActivateKey(closeBtn, closeFrame);
            frame._close = closeFrame;

            // Escape closes the focused window. Ignored while a text field or
            // the theme editor's colour input has focus.
            frame.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                if (e.target.closest('input, select, textarea')) return;
                e.stopPropagation();
                closeFrame();
            });

            // Collapse
            let _collapsed = false;
            if (collapsible) {
                const colBtn = frame.querySelector('.win-collapse');
                const winBody = frame.querySelector('.win-body');
                const collapseFrame = () => { _collapsed = true;  winBody.style.display = 'none'; colBtn.textContent = '+'; frame.style.height = ''; frame.style.minHeight = '0'; colBtn.setAttribute('aria-expanded', 'false'); colBtn.setAttribute('aria-label', `Expand ${title}`); };
                const expandFrame  = () => { _collapsed = false; winBody.style.display = '';     colBtn.textContent = String.fromCharCode(8722); frame.style.minHeight = ''; colBtn.setAttribute('aria-expanded', 'true'); colBtn.setAttribute('aria-label', `Collapse ${title}`); };
                const toggleCollapseFrame = () => _collapsed ? expandFrame() : collapseFrame();
                colBtn.addEventListener('click', e => { e.stopPropagation(); toggleCollapseFrame(); });
                onActivateKey(colBtn, toggleCollapseFrame);
                frame.querySelector('.win-titlebar').addEventListener('dblclick', () => _collapsed ? expandFrame() : collapseFrame());
                frame._collapse = collapseFrame;
                frame._expand   = expandFrame;
            }

            // Drag
            const tb = frame.querySelector('.win-titlebar');
            if (bodyDrag) frame.classList.add('win-draggable');
            let dragging = false, ox = 0, oy = 0;
            const dragTarget = bodyDrag ? frame : tb;
            dragTarget.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target.closest('.win-resize-edge, .win-close, button, a, input, select')) return;
                // On touch, body-draggable windows drag from the titlebar only,
                // so the body content stays touch-scrollable.
                if (bodyDrag && e.pointerType !== 'mouse' && !e.target.closest('.win-titlebar')) return;
                dragging = true;
                ox = e.clientX + ws.scrollLeft - frame.offsetLeft;
                oy = e.clientY + ws.scrollTop - frame.offsetTop;
                if (bodyDrag) frame.style.cursor = 'grabbing';
                document.body.classList.add('dragging'); e.preventDefault();
            });
            document.addEventListener('pointermove', e => {
                if (!dragging || !e.isPrimary) return;
                frame.style.left = Math.max(0, e.clientX + ws.scrollLeft - ox) + 'px';
                frame.style.top  = Math.max(0, e.clientY + ws.scrollTop - oy) + 'px';
            }, docSig);
            const endFrameDrag = () => {
                if (dragging && bodyDrag) frame.style.cursor = '';
                dragging = false; document.body.classList.remove('dragging');
            };
            document.addEventListener('pointerup', endFrameDrag, docSig);
            document.addEventListener('pointercancel', endFrameDrag, docSig);

            // Resize (8 directions)
            let resizing = false, resizeDir = '', rsx = 0, rsy = 0, rsw = 0, rsh = 0, rsl = 0, rst = 0;
            frame.querySelectorAll('.win-resize-edge').forEach(handle => {
                handle.addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    resizeDir = handle.dataset.dir;
                    resizing = true; rsx = e.clientX; rsy = e.clientY;
                    rsw = frame.offsetWidth; rsh = frame.offsetHeight;
                    rsl = frame.offsetLeft;  rst = frame.offsetTop;
                    const cursors = { n:'ns-resize', s:'ns-resize', e:'ew-resize', w:'ew-resize', nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize' };
                    document.body.style.cursor = cursors[resizeDir] || 'default';
                    document.body.classList.add('resizing'); e.preventDefault(); e.stopPropagation();
                });
            });

                if (!resizing || !e.isPrimary) return;
                const dx = e.clientX - rsx, dy = e.clientY - rsy;
                if (resizeDir.includes('e')) frame.style.width  = Math.max(minW, rsw + dx) + 'px';
                if (resizeDir.includes('s')) frame.style.height = Math.max(minH, rsh + dy) + 'px';
                if (resizeDir.includes('w')) {
                    const nw = Math.max(minW, rsw - dx);
                    frame.style.width = nw + 'px';
                    frame.style.left  = (rsl + rsw - nw) + 'px';
                }
                if (resizeDir.includes('n')) {
                    const nh = Math.max(minH, rsh - dy);
                    frame.style.height = nh + 'px';
                    frame.style.top    = (rst + rsh - nh) + 'px';
                }
                frame.dispatchEvent(new CustomEvent('win-resize'));
            }, docSig);
            const endFrameResize = () => {
                if (resizing) { resizing = false; document.body.style.cursor = ''; document.body.classList.remove('resizing'); }
            };
            document.addEventListener('pointerup', endFrameResize, docSig);
            document.addEventListener('pointercancel', endFrameResize, docSig);

            // Custom scrollbar
            const cTrack = frame.querySelector('.cscroll-track');
            const cThumb = frame.querySelector('.cscroll-thumb');
            const cBody  = frame.querySelector('.win-body');
            function syncScroll() {
                const tbH = frame.querySelector('.win-titlebar').offsetHeight;
                cTrack.style.top    = (tbH + 6) + 'px';
                cTrack.style.bottom = '6px';
                if (cBody.scrollHeight <= cBody.clientHeight + 1) { cTrack.style.opacity = '0'; return; }
                cTrack.style.opacity = '';
                const ratio   = cBody.scrollTop / (cBody.scrollHeight - cBody.clientHeight);
                const availH  = cTrack.offsetHeight - 6;
                cThumb.style.top = Math.round(ratio * availH) + 'px';
            }
            cBody.addEventListener('scroll', syncScroll);
            frame.addEventListener('mouseenter', syncScroll);
            new ResizeObserver(syncScroll).observe(cBody);

            setTimeout(() => frame.classList.remove('spawning'), 320);
            return frame;
        }

        // ג"€ג"€ INFO WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // ── SLIDESHOW WINDOW ──────────────────────────────────────────────────────
        function openSlideshow(project) {
            focusOrCreate(`slides-${project.id}`, () => {
                const ws = document.getElementById('workspace');
                const { x, y } = nextSpawn(640, 440);
                const slides = project.slides;
                let idx = 0;

                const el = document.createElement('div');
                el.className = 'slide-float spawning';
                el.style.cssText = `left:${x}px;top:${y}px;z-index:${++topZ};width:640px;height:440px;`;
                openWins[`slides-${project.id}`] = el;

                // Alt text is positional rather than descriptive: these are
                // 145-slide project sequences with no per-slide captions in
                // config.js, and inventing descriptions would be worse than
                // stating position honestly. Add captions to config.js and
                // this can use them.
                const slideAlt = i => `${project.title} — slide ${i + 1} of ${slides.length}`;

                el.setAttribute('role', 'group');
                el.setAttribute('aria-label', `${project.title} — slideshow, ${slides.length} slides`);
                el.tabIndex = -1;

                el.innerHTML = `
                    <img class="slide-img" draggable="false" decoding="async" src="${slides[0].src || slides[0]}" alt="${slideAlt(0)}">
                    <div class="slide-nav slide-nav-prev" role="button" tabindex="0" aria-label="Previous slide"><span class="slide-chevron" aria-hidden="true">&lt;</span></div>
                    <div class="slide-nav slide-nav-next" role="button" tabindex="0" aria-label="Next slide"><span class="slide-chevron" aria-hidden="true">&gt;</span></div>
                    <div class="slide-bar">
                        <span class="slide-title">${project.title}</span>
                        <span class="slide-counter" aria-live="polite" aria-atomic="true">1 / ${slides.length}</span>
                        <span class="slide-close" role="button" tabindex="0" aria-label="Close ${project.title} slideshow">&#x2014;</span>
                    </div>
                    <div class="slide-resize"></div>
                `;

                ws.appendChild(el);
                setTimeout(() => el.classList.remove('spawning'), 320);

                const imgEl      = el.querySelector('.slide-img');
                const counterEl  = el.querySelector('.slide-counter');
                const docAC      = new AbortController();
                const docSig     = { signal: docAC.signal };

                // Warm the browser cache for the neighbouring slides so
                // prev/next doesn't wait on a fresh download.
                function preloadAround() {
                    [1, -1, 2].forEach(n => {
                        const s = slides[(idx + n + slides.length) % slides.length];
                        const im = new Image();
                        im.decoding = 'async';
                        im.src = s.src || s;
                    });
                }
                preloadAround();

                function go(n) {
                    idx = (idx + n + slides.length) % slides.length;
                    imgEl.src = slides[idx].src || slides[idx];
                    imgEl.alt = slideAlt(idx);
                    counterEl.textContent = `${idx + 1} / ${slides.length}`;
                    preloadAround();
                }

                const prevBtn = el.querySelector('.slide-nav-prev');
                const nextBtn = el.querySelector('.slide-nav-next');
                prevBtn.addEventListener('click', () => go(-1));
                nextBtn.addEventListener('click', () => go(1));
                onActivateKey(prevBtn, () => go(-1));
                onActivateKey(nextBtn, () => go(1));

                function closeSlides() {
                    docAC.abort();
                    el.classList.add('closing');
                    announce(`${project.title} slideshow closed`);
                    const back = el._opener;
                    setTimeout(() => {
                        el.remove();
                        delete openWins[`slides-${project.id}`];
                        if (back && back.isConnected) back.focus();
                        else focusTopmostWindow();
                    }, 220);
                }
                const slideCloseBtn = el.querySelector('.slide-close');
                slideCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeSlides(); });
                onActivateKey(slideCloseBtn, closeSlides);
                el._close = closeSlides;

                // Arrow keys / Home / End drive the sequence; Escape closes.
                // Scoped to the window so it only applies while focused.
                el.addEventListener('keydown', e => {
                    if (e.target.closest('input, select, textarea')) return;
                    switch (e.key) {
                        case 'ArrowLeft':  case 'ArrowUp':   go(-1); break;
                        case 'ArrowRight': case 'ArrowDown': go(1);  break;
                        case 'Home':       go(-idx); break;
                        case 'End':        go(slides.length - 1 - idx); break;
                        case 'Escape':     closeSlides(); break;
                        default: return;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                });

                // Drag
                el.addEventListener('pointerdown', () => el.style.zIndex = ++topZ);
                let dragging = false, resizing = false, ox = 0, oy = 0, rw = 0, rh = 0;
                el.addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    if (e.target.closest('.slide-nav, .slide-close, .slide-resize')) return;
                    dragging = true;
                    ox = e.clientX + ws.scrollLeft - el.offsetLeft;
                    oy = e.clientY + ws.scrollTop  - el.offsetTop;
                    el.style.cursor = 'grabbing';
                    document.body.classList.add('dragging'); e.preventDefault();
                });
                el.querySelector('.slide-resize').addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    e.stopPropagation(); resizing = true;
                    ox = e.clientX; oy = e.clientY;
                    rw = el.offsetWidth; rh = el.offsetHeight;
                    document.body.classList.add('resizing'); e.preventDefault();
                });
                document.addEventListener('pointermove', e => {
                    if (!e.isPrimary) return;
                    if (dragging) {
                        el.style.left = Math.max(0, e.clientX + ws.scrollLeft - ox) + 'px';
                        el.style.top  = Math.max(0, e.clientY + ws.scrollTop  - oy) + 'px';
                    } else if (resizing) {
                        el.style.width  = Math.max(280, rw + e.clientX - ox) + 'px';
                        el.style.height = Math.max(200, rh + e.clientY - oy) + 'px';
                    }
                }, docSig);
                const endSlideDrag = () => {
                    if (dragging) { dragging = false; el.style.cursor = ''; document.body.classList.remove('dragging'); }
                    if (resizing) { resizing = false; document.body.classList.remove('resizing'); }
                };
                document.addEventListener('pointerup', endSlideDrag, docSig);
                document.addEventListener('pointercancel', endSlideDrag, docSig);
            });
        }

        function openInfo(project) {
            focusOrCreate(`info-${project.id}`, () => {
                const frame = makeFrame({ title: project.title, tag: 'Info', w: 360, h: 340, key: `info-${project.id}`, bodyDrag: true });
                const body = frame.querySelector('.win-body');
                body.className += ' info-body';

                const hasModel  = !!project.model;
                const hasImages = project.images && project.images.length > 0;
                const hasSlides = project.slides && project.slides.length > 0;

                // Warm the HTTP cache so the 3D viewer opens without a download wait
                if (hasModel) fetch(project.model, { priority: 'low' }).catch(() => {});

                body.innerHTML = `
                    <div class="info-meta">
                        <span>${project.year}</span>
                        <span class="info-meta-sep">ֲ·</span>
                        <span>${project.location}</span>
                        <span class="info-meta-sep">ֲ·</span>
                        <span>${project.type}</span>
                    </div>
                    <div class="info-participants">${project.participants}</div>
                    <div class="info-desc">${project.description}</div>
                    <div class="info-actions">
                        ${hasSlides ? `<button class="action-btn slides-btn">Slides</button>` : ''}
                        ${hasImages ? `<button class="action-btn gallery-btn">Gallery</button>` : ''}
                        ${hasModel  ? `<button class="action-btn viewer-btn">3D View</button>` : ''}
                    </div>
                `;

                if (hasSlides) body.querySelector('.slides-btn').addEventListener('click', () => openSlideshow(project));
                if (hasImages) body.querySelector('.gallery-btn').addEventListener('click', () => openGallery(project));
                if (hasModel)  body.querySelector('.viewer-btn').addEventListener('click', () => open3D(project));

                // Mark sidebar row as open
                const row = document.querySelector(`.proj-row[data-id="${project.id}"]`);
                if (row) row.classList.add('open');
                frame.querySelector('.win-close').addEventListener('click', () => {
                    if (row) row.classList.remove('open');
                });
            });
        }

        // Open a project = Info + every feature it has, then tile them.
        function openProject(project) {
            openInfo(project);
            if (project.slides && project.slides.length) openSlideshow(project);
            if (project.images && project.images.length) openGallery(project);
            if (project.model) open3D(project);
            requestAnimationFrame(() => tileProjectWindows(project));
        }

        // Content-proportional packer for a single project's windows.
        // (Separate from orderWindows/BSP — this one sizes each window to its
        // content and packs into rows, never stretching to fill the canvas.)
        function tileProjectWindows(project) {
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const ws = document.getElementById('workspace');
            const vw = window.innerWidth, vh = window.innerHeight;
            const gap = 10, topY = 28, leftX = 28;

            // Reserve the pinned left column (menu + theme)
            const menuEl   = document.getElementById('menu-body-inner')?.closest('.win-frame');
            const leftColW = (menuEl ? menuEl.offsetWidth : 228) + gap;
            const areaX    = leftX + leftColW;
            const availW   = vw - areaX - gap;
            const availH   = vh - topY  - gap;

            // Per-window caps so nothing dominates an unknown viewport
            const capW = Math.min(availW, vw * 0.46);
            const capH = Math.min(availH, vh * 0.62);

            const items = [];

            // 3D — the hero, a little bigger than the rest
            const el3d = openWins[`3d-${project.id}`];
            if (el3d) {
                let w = clamp(vw * 0.40, 460, capW);
                let h = clamp(w * 0.78, 340, capH);
                items.push({ el: el3d, w, h, frame: true });
            }

            // Slideshow — match the image's aspect ratio (object-fit:contain,
            // so no dead space). Real ratio known only once the image loads.
            const elSl = openWins[`slides-${project.id}`];
            if (elSl) {
                const img = elSl.querySelector('.slide-img');
                const ar  = (img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : 3 / 2;
                let h = clamp(vh * 0.40, 240, capH);
                let w = h * ar;
                if (w > capW) { w = capW; h = w / ar; }
                items.push({ el: elSl, w, h, frame: false });
                if (img && !img.naturalWidth && !img.dataset.tileHook) {
                    img.dataset.tileHook = '1';
                    img.addEventListener('load', () => tileProjectWindows(project), { once: true });
                }
            }

            // Gallery — tidy grid, aim for 2 rows; body scrolls if there are more.
            // Match the CSS grid: minmax(140px,1fr) columns, 4:3 thumbs (see .gallery-grid).
            const elG = openWins[`gallery-${project.id}`];
            if (elG) {
                const n = (project.images && project.images.length) || 1;
                const colW = 190, bar = 34, gg = 1;            // colW ≥ 140 so auto-fill keeps our column count
                const maxCols = Math.max(1, Math.floor(capW / 150));
                let cols = clamp(Math.ceil(n / 2), 1, 4);
                cols = Math.min(cols, n, maxCols);
                const rows = Math.min(2, Math.ceil(n / cols));
                let w = clamp(cols * colW + (cols + 1) * gg, 260, capW);   // 260 = .win-frame min-width
                const thumbH = ((w - (cols + 1) * gg) / cols) * 3 / 4;   // actual stretched thumb height
                let h = clamp(rows * thumbH + (rows + 1) * gg + bar, 200, capH);
                items.push({ el: elG, w, h, frame: true });
            }

            // Info / text — modest and readable, never stretched
            const elI = openWins[`info-${project.id}`];
            if (elI) {
                items.push({ el: elI, w: 340, h: clamp(vh * 0.40, 300, capH), frame: true });
            }

            if (!items.length) return;

            const themeFrame = openWins['theme'];
            const mine = new Set(items.map(it => it.el));

            // Shelf-pack tallest-first into a block with a LOCAL origin (0,0),
            // so we can drop the whole block anywhere afterwards.
            items.sort((a, b) => b.h - a.h);
            function pack(scale) {
                let x = 0, y = 0, rowH = 0, maxR = 0, maxB = 0;
                const rects = [];
                for (const it of items) {
                    // .win-frame has CSS min 260x180 — never size a frame below it,
                    // or it renders larger than we think and overlaps its neighbour.
                    const w = it.frame ? Math.max(260, it.w * scale) : it.w * scale;
                    const h = it.frame ? Math.max(180, it.h * scale) : it.h * scale;
                    if (x > 0 && x + w > availW) { x = 0; y += rowH + gap; rowH = 0; }
                    rects.push({ el: it.el, frame: it.frame, x, y, w, h });
                    x += w + gap; rowH = Math.max(rowH, h);
                    maxR = Math.max(maxR, x - gap); maxB = Math.max(maxB, y + rowH);
                }
                return { rects, maxR, maxB };
            }
            let L = pack(1);
            // Global fit-to-screen: shrink the block uniformly if it overflows
            const s = Math.min(1, availW / L.maxR, availH / L.maxB);
            if (s < 1) L = pack(s);
            const bw = L.maxR, bh = L.maxB;

            // Drop the block in the first free spot: to the RIGHT of an earlier
            // project if it fits there, otherwise BELOW it. Not strict — just
            // uses the screen instead of always stacking straight down.
            const obstacles = [...ws.querySelectorAll('.win-frame, .slide-float, .img-float')]
                .filter(f => f !== menuEl && f !== themeFrame && !mine.has(f))
                .map(f => ({ x: f.offsetLeft, y: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight }));
            const maxBottom = obstacles.reduce((y, o) => Math.max(y, o.y + o.h), topY);
            const hits = (x, y) => obstacles.some(o =>
                x < o.x + o.w + gap && x + bw + gap > o.x &&
                y < o.y + o.h + gap && y + bh + gap > o.y);
            let spot = { x: areaX, y: maxBottom + gap };   // fallback: below everything
            scan:
            for (let y = topY; y <= maxBottom + bh + 20; y += 20)
                for (let x = areaX; x + bw <= vw - gap; x += 20)
                    if (!hits(x, y)) { spot = { x, y }; break scan; }

            for (const r of L.rects) {
                Object.assign(r.el.style, {
                    left:   Math.round(spot.x + r.x) + 'px',
                    top:    Math.round(spot.y + r.y) + 'px',
                    width:  Math.round(r.w) + 'px',
                    height: Math.round(r.h) + 'px',
                    zIndex: ++topZ,
                });
                if (r.frame) r.el.dispatchEvent(new CustomEvent('win-resize'));
            }
        }

        // ג"€ג"€ GALLERY WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // Gallery grids render 400px derivatives from gallery/thumbs/, not the
        // full-size originals — the originals run 1900-3840px wide, which cost
        // ~29 MB to draw a grid of ~190px cells. Clicking still opens the full
        // image via openImage(). Regenerate with D:/projects/Website/tools/make-thumbs.mjs (outside git).
        // Falls back to the original if a thumb is missing (see 'error' handler).
        const thumbSrc = src => src.replace(/\/gallery\/(?!thumbs\/)([^/]+)$/, '/gallery/thumbs/$1');

        function openGallery(project) {
            focusOrCreate(`gallery-${project.id}`, () => {
                const frame = makeFrame({ title: project.title + ' — Gallery', tag: 'Gallery', w: 500, h: 400, minW: 300, key: `gallery-${project.id}` });
                const body = frame.querySelector('.win-body');
                body.className += ' gallery-body';

                const primaryKey = `img-primary-${project.id}`;
                let secondaryCount = 0;

                function showGrid() {
                    body.innerHTML = `
                        <div class="gallery-grid">
                            ${project.images.map((img, i) => `
                                <div class="gallery-thumb" data-i="${i}" role="button" tabindex="0"
                                     aria-label="${img.label ? `${img.label} — open full size` : `${project.title} — image ${i + 1} of ${project.images.length}, open full size`}">
                                    <img src="${thumbSrc(img.src)}" data-full="${img.src}" alt="" loading="lazy" decoding="async">
                                    ${img.label ? `<div class="thumb-label">${img.label}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    body.querySelectorAll('.gallery-thumb').forEach(el => {
                        const i = parseInt(el.dataset.i);
                        // Missing/failed thumb: fall back to the full image once,
                        // so a project without generated thumbs still renders.
                        const thumbEl = el.querySelector('img');
                        thumbEl.addEventListener('error', () => { thumbEl.src = thumbEl.dataset.full; }, { once: true });
                        const openPrimary = () => {
                            const img = project.images[i];
                            const existing = openWins[primaryKey];
                            if (existing && existing.isConnected) {
                                swapImageContent(existing, img.src, img.label);
                            } else {
                                openImage({ src: img.src, label: img.label, key: primaryKey,
                                            fallbackLabel: `${project.title} — image ${i + 1} of ${project.images.length}` });
                            }
                        };
                        el.addEventListener('click', openPrimary);
                        onActivateKey(el, openPrimary);
                        el.addEventListener('contextmenu', e => {
                            e.preventDefault();
                            const img = project.images[i];
                            openImage({ src: img.src, label: img.label, key: `img-sec-${project.id}-${++secondaryCount}` });
                        });
                    });
                }

                showGrid();
            });
        }

        // ג"€ג"€ TEXT WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // ── IMAGE VIEWER ──────────────────────────────────────────────────────
        function swapImageContent(el, src, label) {
            const img = el.querySelector('img');
            const title = el.querySelector('.img-float-title');
            const alt = label || src.split('/').pop().replace(/\.[a-z0-9]+$/i, '');
            img.src = src; img.alt = alt;
            el.setAttribute('aria-label', alt);
            title.textContent = label || '';
            el.style.zIndex = ++topZ;
            announce(alt);          // the window is reused, so nothing else signals the change
        }

        function openImage({ src, label = '', key, fallbackLabel = '' }) {
            const ws = document.getElementById('workspace');
            const { x, y } = nextSpawn(220, 220);
            // The visible bar shows label only (blank is fine there), but the
            // image always needs a non-empty accessible name.
            const altText = label || fallbackLabel || src.split('/').pop().replace(/\.[a-z0-9]+$/i, '');

            const el = document.createElement('div');
            el.className = 'img-float';
            el.style.cssText = `left:${x}px;top:${y}px;z-index:${++topZ};width:400px;height:300px;`;
            el.setAttribute('role', 'group');
            el.setAttribute('aria-label', altText);
            el.tabIndex = -1;
            // Opened straight from a thumb click, not via focusOrCreate, so
            // record the opener here for focus return.
            const opener = document.activeElement;
            if (opener && opener !== document.body) el._opener = opener;
            if (key) openWins[key] = el;

            el.innerHTML = `
                <img draggable="false" src="${src}" alt="${altText}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;">
                <div class="img-float-bar">
                    <span class="img-float-title">${label}</span>
                    <span class="img-float-close" role="button" tabindex="0" aria-label="Close image">×</span>
                </div>
                <div class="img-float-chrome"></div>
                <div class="img-float-resize"></div>
            `;

            ws.appendChild(el);

            // Size to natural image dimensions once loaded
            const img = el.querySelector('img');
            img.addEventListener('load', () => {
                const maxW = window.innerWidth  * 0.80;
                const maxH = window.innerHeight * 0.75;
                const scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
                el.style.width  = Math.round(img.naturalWidth  * scale) + 'px';
                el.style.height = Math.round(img.naturalHeight * scale) + 'px';
            }, { once: true });

            el.addEventListener('pointerdown', () => el.style.zIndex = ++topZ);

            const docAC  = new AbortController();
            const docSig = { signal: docAC.signal };
            function closeImage() {
                docAC.abort();
                el.classList.add('closing');
                const back = el._opener;
                setTimeout(() => {
                    el.remove();
                    if (key) delete openWins[key];
                    if (back && back.isConnected) back.focus();
                    else focusTopmostWindow();
                }, 220);
            }
            const imgCloseBtn = el.querySelector('.img-float-close');
            imgCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeImage(); });
            onActivateKey(imgCloseBtn, closeImage);
            el._close = closeImage;
            el.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                e.stopPropagation();
                closeImage();
            });

            // Drag
            let dragging = false, resizing = false, ox = 0, oy = 0, rw = 0, rh = 0;
            el.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target.classList.contains('img-float-close') || e.target.classList.contains('img-float-resize')) return;
                dragging = true;
                ox = e.clientX + ws.scrollLeft - el.offsetLeft;
                oy = e.clientY + ws.scrollTop - el.offsetTop;
                document.body.classList.add('dragging'); e.preventDefault();
            });

            // Resize
            el.querySelector('.img-float-resize').addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                e.stopPropagation();
                resizing = true;
                ox = e.clientX; oy = e.clientY;
                rw = el.offsetWidth; rh = el.offsetHeight;
                document.body.classList.add('resizing'); e.preventDefault();
            });

            document.addEventListener('pointermove', e => {
                if (!e.isPrimary) return;
                if (dragging) {

        class SimpleOrbit {
            constructor(camera, el) {
                this.camera = camera; this.el = el;
                this.target = new THREE.Vector3();
                this.radius = camera.position.length();
                this.rotX = 0; this.rotY = 0; this.tRotX = 0; this.tRotY = 0;
                this.autoSpeed = 0.003; this.isOrbit = false; this.isPan = false;
                this.pX = 0; this.pY = 0;

                this._ac = new AbortController();
                const sig = { signal: this._ac.signal };
                const skip = e => e.target.closest('.win-bottom-bar') || e.target.closest('.win-settings');
                this._pts = new Map();   // active pointers over the viewer
                this._pinch = null;      // pinch gesture start state
                this.el.style.touchAction = 'none';
                this.el.addEventListener('contextmenu', e => e.preventDefault());
                this.el.addEventListener('pointerdown', e => {
                    if (skip(e)) return;
                    this._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (this._pts.size === 2) {
                        // second finger: switch from orbit to pinch-zoom
                        const [a, b] = [...this._pts.values()];
                        this._pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), radius: this.radius };
                        this.isOrbit = false; this.isPan = false;
                        return;
                    }
                    if (e.button === 0) this.isOrbit = true;
                    if (e.button === 1 || e.button === 2) this.isPan = true;
                    this.pX = e.clientX; this.pY = e.clientY;
                });
                window.addEventListener('pointermove', e => {
                    if (this._pts.has(e.pointerId)) this._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (this._pinch && this._pts.size >= 2) {
                        const [a, b] = [...this._pts.values()];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d > 1) this.radius = Math.max(0.3, Math.min(200, this._pinch.radius * this._pinch.dist / d));
                        return;
                    }
                    if (!e.isPrimary) return;
                    const dx = e.clientX - this.pX, dy = e.clientY - this.pY;
                    if (this.isOrbit) {
                        this.tRotY += dx * 0.005; this.tRotX += dy * 0.005;
                        this.tRotX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, this.tRotX));
                    }
                    if (this.isPan) {
                        const s = this.radius * 0.0012;
                        const fwd = new THREE.Vector3(); this.camera.getWorldDirection(fwd);
                        const right = new THREE.Vector3().crossVectors(fwd, this.camera.up).normalize();
                        const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
                        this.target.addScaledVector(right, -dx * s);
                        this.target.addScaledVector(up, dy * s);
                    }
                    this.pX = e.clientX; this.pY = e.clientY;
                }, sig);
                const endPtr = e => {
                    this._pts.delete(e.pointerId);
                    if (this._pts.size < 2) this._pinch = null;
                    if (this._pts.size === 0) { this.isOrbit = false; this.isPan = false; }
                };
                window.addEventListener('pointerup', endPtr, sig);
                window.addEventListener('pointercancel', endPtr, sig);
                this.el.addEventListener('wheel', e => {
                    e.preventDefault();
                    this.radius = Math.max(0.3, Math.min(200, this.radius * (e.deltaY > 0 ? 1.1 : 0.9)));
                }, { passive: false });
            }
            dispose() { this._ac.abort(); }
            update() {
                if (!this.isOrbit && !this.isPan) this.tRotY += this.autoSpeed;
                this.rotX += (this.tRotX - this.rotX) * 0.08;
                this.rotY += (this.tRotY - this.rotY) * 0.08;
                this.camera.position.x = this.target.x + this.radius * Math.sin(this.rotY) * Math.cos(this.rotX);
                this.camera.position.y = this.target.y + this.radius * Math.sin(this.rotX);
                this.camera.position.z = this.target.z + this.radius * Math.cos(this.rotY) * Math.cos(this.rotX);
                this.camera.lookAt(this.target);
            }
        }

        class AsciiEffect {
            constructor(renderer, chars, opts = {}) {
                this.renderer = renderer;
                this._chars = chars; this._inv = opts.invert || false; this._res = opts.resolution || 0.4;
                this.domElement = document.createElement('div');
                Object.assign(this.domElement.style, {
                    whiteSpace: 'pre', fontFamily: "'Courier New',Courier,monospace",
                    letterSpacing: '0.05em', color: opts.color || '#000',
                    backgroundColor: opts.bg || '#f5fccc', overflow: 'hidden',
                });
                this._c = document.createElement('canvas');
                this._x = this._c.getContext('2d', { willReadFrequently: true });
                this._w = 0; this._h = 0;
            }
            get characters() { return this._chars; } set characters(v) { this._chars = v; }
            get invert() { return this._inv; } set invert(v) { this._inv = v; }
            get resolution() { return this._res; } set resolution(v) { this._res = v; if (this._w) this.setSize(this._w, this._h); }
            setSize(w, h) {
                this._w = w; this._h = h;
                this._c.width  = Math.max(1, Math.floor(w * this._res));
                this._c.height = Math.max(1, Math.floor(h * this._res));
                this.renderer.setSize(w, h);
                const cols = this._c.width, rows = Math.ceil(this._c.height / 2);
                const fs = Math.max(0.4, Math.min(w / (cols * 0.601), h / rows));
                this.domElement.style.fontSize = fs.toFixed(2) + 'px';
                this.domElement.style.lineHeight = (h / rows / fs).toFixed(3);
            }
            render(scene, camera) {
                this.renderer.render(scene, camera);
                const cW = this._c.width, cH = this._c.height;
                this._x.clearRect(0, 0, cW, cH);
                this._x.drawImage(this.renderer.domElement, 0, 0, cW, cH);
                const d = this._x.getImageData(0, 0, cW, cH).data, ch = this._chars, inv = this._inv;
                let s = '';
                for (let y = 0; y < cH; y += 2) {
                    for (let x = 0; x < cW; x++) {
                        const i = (y * cW + x) * 4;
                        let b = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
                        if (inv) b = 1 - b;
                        s += ch[Math.min(Math.floor(b * (ch.length - 1)), ch.length - 1)];
                    }
                    s += '\n';
                }
                this.domElement.textContent = s;
            }
        }

        function normalizeModel(group, targetSize = 3) {
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            group.position.sub(center);
            group.scale.multiplyScalar(targetSize / Math.max(size.x, size.y, size.z));
            const box2 = new THREE.Box3().setFromObject(group);
            group.position.sub(box2.getCenter(new THREE.Vector3()));
        }
