    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

        // ================================================================
        // WINDOW SYSTEM
        // ================================================================
        let topZ = 50;
        const openWins = {};

        function nextSpawn(w = 300, h = 250) {
            const sw = window.innerWidth, sh = window.innerHeight;
            const pad = 28, step = 32, margin = 10;
            const frames = [...document.querySelectorAll('.win-frame')].map(f => ({
                x: f.offsetLeft, y: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight
            }));
            function free(x, y) {
                if (x + w > sw - pad || y + h > sh - pad) return false;
                for (const f of frames) {
                    if (x < f.x + f.w + margin && x + w + margin > f.x &&
                        y < f.y + f.h + margin && y + h + margin > f.y) return false;
                }
                return true;
            }
            for (let row = pad; row + h < sh - pad; row += step)
                for (let col = pad; col + w < sw - pad; col += step)
                    if (free(col, row)) return { x: col, y: row };
            return { x: Math.max(pad, Math.min(sw - w - pad, (sw - w) / 2)), y: Math.max(pad, Math.min(sh - h - pad, (sh - h) / 2)) };
        }
        function focusOrCreate(key, createFn) {
            if (openWins[key]) {
                openWins[key].style.zIndex = ++topZ;
                openWins[key].focus?.();          // re-focus instead of silently doing nothing
                return;
            }
            // Remember what the user activated, so closing can hand focus back.
            const opener = document.activeElement;
            const userDriven = opener && opener !== document.body && opener !== document.documentElement;
            createFn();
            const win = openWins[key];
            if (win && userDriven) {
                win._opener = opener;
                // Only move focus for windows the user actually opened. The
                // menu and theme editor are created during page load, and
                // stealing focus then would move it without user action and
                // knock the skip link out of first-Tab position.
                requestAnimationFrame(() => win.focus?.());
            }
        }

        // ── KEYBOARD / SCREEN-READER HELPERS (A11Y-02) ────────────────────
        // Div-based controls need Enter and Space wired up by hand; real
        // <button>s would get this free, but restyling the whole chrome is a
        // bigger change than this task.
        function onActivateKey(el, fn) {
            el.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
                e.preventDefault();
                e.stopPropagation();
                fn(e);
            });
        }

        // Single polite live region, reused for every announcement.
        let _liveRegion = null;
        function announce(msg) {
            if (!_liveRegion) {
                _liveRegion = document.createElement('div');
                _liveRegion.className = 'sr-only';
                _liveRegion.setAttribute('role', 'status');
                _liveRegion.setAttribute('aria-live', 'polite');
                document.body.appendChild(_liveRegion);
            }
            // Clear first so repeat messages are re-announced.
            _liveRegion.textContent = '';
            requestAnimationFrame(() => { _liveRegion.textContent = msg; });
        }

        // After closing a window with no recorded opener, land on whatever is
        // now on top rather than dumping focus on <body>.
        function focusTopmostWindow() {
            const wins = [...document.querySelectorAll('.win-frame, .slide-float')]
                .filter(el => !el.classList.contains('closing'));
            if (!wins.length) return;
            wins.sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
            wins[wins.length - 1].focus?.();
        }

        function makeFrame({ title, tag = '', w, h, key, minW = 260, minH = 180, bodyDrag = false, collapsible = false, projectId = null }) {
            const { x, y } = nextSpawn(w, h);
            const ws = document.getElementById('workspace');

            const frame = document.createElement('div');
            frame.className = 'win-frame spawning';
            frame.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++topZ}`;

            // role=dialog + tabindex=-1 so the window can take focus on open
            // and be reached again with Escape/Tab. Not aria-modal: these
            // windows are non-modal by design, several are open at once.
            frame.setAttribute('role', 'dialog');
            frame.setAttribute('aria-label', tag ? `${title} (${tag})` : title);
            frame.tabIndex = -1;

            frame.innerHTML = `
                <div class="win-titlebar">
                    <span class="win-title">${title}</span>
                    ${tag ? `<span class="win-type-tag">${tag}</span>` : ''}
                    ${collapsible ? `<span class="win-collapse" role="button" tabindex="0" aria-label="Collapse ${title}" aria-expanded="true">&#x2212;</span>` : ''}
                    <span class="win-close" role="button" tabindex="0" aria-label="Close ${title}">&#x00D7;</span>
                </div>
                <div class="win-body"></div>
                <div class="cscroll-track"><div class="cscroll-thumb"></div></div>
                <div class="win-resize-edge" data-dir="n"></div>
                <div class="win-resize-edge" data-dir="s"></div>
                <div class="win-resize-edge" data-dir="e"></div>
                <div class="win-resize-edge" data-dir="w"></div>
                <div class="win-resize-edge" data-dir="nw"></div>
                <div class="win-resize-edge" data-dir="ne"></div>
                <div class="win-resize-edge" data-dir="sw"></div>
                <div class="win-resize-edge" data-dir="se"></div>
            `;

            ws.appendChild(frame);
            if (key) openWins[key] = frame;
            // Which project this window belongs to. The openWins key encodes it
            // too, but only as a dictionary key — and the 3D keys carry an
            // open-ended `-<n>` suffix for multi-model projects. Stamping the
            // element means "close everything belonging to project A" is one
            // querySelectorAll, with no key spelling to keep in sync.
            if (projectId) frame.dataset.projectId = projectId;

            frame.addEventListener('pointerdown', () => frame.style.zIndex = ++topZ);

            // Document-level listeners are registered with this controller and
            // released when the window closes, so they don't accumulate.
            const docAC = new AbortController();
            const docSig = { signal: docAC.signal };
            // Exposed so a window's own content can hang document-level
            // listeners off the same lifetime (openInfo's model dropdown uses
            // it for its click-away handler).
            frame._sig = docAC.signal;

            // Close. closeFrame is shared by the button, Enter/Space on it,
            // and Escape from anywhere inside the window.
            function closeFrame() {
                docAC.abort();
                frame.classList.add('closing');
                announce(`${title} window closed`);
                // Hand focus back so the keyboard user isn't dropped on <body>.
                const back = frame._opener;
                setTimeout(() => {
                    frame.remove();
                    if (key) delete openWins[key];
                    if (back && back.isConnected) back.focus();
                    else focusTopmostWindow();
                }, 220);
            }
            const closeBtn = frame.querySelector('.win-close');
            closeBtn.addEventListener('click', e => { e.stopPropagation(); closeFrame(); });
            onActivateKey(closeBtn, closeFrame);
            frame._close = closeFrame;

            // Escape closes the focused window. Ignored while a text field or
            // the theme editor's colour input has focus.
            frame.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                if (e.target.closest('input, select, textarea')) return;
                e.stopPropagation();
                closeFrame();
            });

            // Collapse
            let _collapsed = false;
            if (collapsible) {
                const colBtn = frame.querySelector('.win-collapse');
                const winBody = frame.querySelector('.win-body');
                const collapseFrame = () => { _collapsed = true;  winBody.style.display = 'none'; colBtn.textContent = '+'; frame.style.height = ''; frame.style.minHeight = '0'; colBtn.setAttribute('aria-expanded', 'false'); colBtn.setAttribute('aria-label', `Expand ${title}`); };
                const expandFrame  = () => { _collapsed = false; winBody.style.display = '';     colBtn.textContent = String.fromCharCode(8722); frame.style.minHeight = ''; colBtn.setAttribute('aria-expanded', 'true'); colBtn.setAttribute('aria-label', `Collapse ${title}`); };
                const toggleCollapseFrame = () => _collapsed ? expandFrame() : collapseFrame();
                colBtn.addEventListener('click', e => { e.stopPropagation(); toggleCollapseFrame(); });
                onActivateKey(colBtn, toggleCollapseFrame);
                frame.querySelector('.win-titlebar').addEventListener('dblclick', () => _collapsed ? expandFrame() : collapseFrame());
                frame._collapse = collapseFrame;
                frame._expand   = expandFrame;
            }

            // Drag
            const tb = frame.querySelector('.win-titlebar');
            if (bodyDrag) frame.classList.add('win-draggable');
            let dragging = false, ox = 0, oy = 0;
            const dragTarget = bodyDrag ? frame : tb;
            dragTarget.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target.closest('.win-resize-edge, .win-close, button, a, input, select')) return;
                // On touch, body-draggable windows drag from the titlebar only,
                // so the body content stays touch-scrollable.
                if (bodyDrag && e.pointerType !== 'mouse' && !e.target.closest('.win-titlebar')) return;
                dragging = true;
                ox = e.clientX + ws.scrollLeft - frame.offsetLeft;
                oy = e.clientY + ws.scrollTop - frame.offsetTop;
                if (bodyDrag) frame.style.cursor = 'grabbing';
                document.body.classList.add('dragging'); e.preventDefault();
            });
            document.addEventListener('pointermove', e => {
                if (!dragging || !e.isPrimary) return;
                frame.style.left = Math.max(0, e.clientX + ws.scrollLeft - ox) + 'px';
                frame.style.top  = Math.max(0, e.clientY + ws.scrollTop - oy) + 'px';
            }, docSig);
            const endFrameDrag = () => {
                if (dragging && bodyDrag) frame.style.cursor = '';
                dragging = false; document.body.classList.remove('dragging');
            };
            document.addEventListener('pointerup', endFrameDrag, docSig);
            document.addEventListener('pointercancel', endFrameDrag, docSig);

            // Resize (8 directions)
            let resizing = false, resizeDir = '', rsx = 0, rsy = 0, rsw = 0, rsh = 0, rsl = 0, rst = 0;
            frame.querySelectorAll('.win-resize-edge').forEach(handle => {
                handle.addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    resizeDir = handle.dataset.dir;
                    resizing = true; rsx = e.clientX; rsy = e.clientY;
                    rsw = frame.offsetWidth; rsh = frame.offsetHeight;
                    rsl = frame.offsetLeft;  rst = frame.offsetTop;
                    const cursors = { n:'ns-resize', s:'ns-resize', e:'ew-resize', w:'ew-resize', nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize' };
                    document.body.style.cursor = cursors[resizeDir] || 'default';
                    document.body.classList.add('resizing'); e.preventDefault(); e.stopPropagation();
                });
            });
            document.addEventListener('pointermove', e => {
                if (!resizing || !e.isPrimary) return;
                const dx = e.clientX - rsx, dy = e.clientY - rsy;
                if (resizeDir.includes('e')) frame.style.width  = Math.max(minW, rsw + dx) + 'px';
                if (resizeDir.includes('s')) frame.style.height = Math.max(minH, rsh + dy) + 'px';
                if (resizeDir.includes('w')) {
                    const nw = Math.max(minW, rsw - dx);
                    frame.style.width = nw + 'px';
                    frame.style.left  = (rsl + rsw - nw) + 'px';
                }
                if (resizeDir.includes('n')) {
                    const nh = Math.max(minH, rsh - dy);
                    frame.style.height = nh + 'px';
                    frame.style.top    = (rst + rsh - nh) + 'px';
                }
                frame.dispatchEvent(new CustomEvent('win-resize'));
            }, docSig);
            const endFrameResize = () => {
                if (resizing) { resizing = false; document.body.style.cursor = ''; document.body.classList.remove('resizing'); }
            };
            document.addEventListener('pointerup', endFrameResize, docSig);
            document.addEventListener('pointercancel', endFrameResize, docSig);

            // Custom scrollbar. Tracks .win-body by default, but a window whose
            // body does not itself scroll can point it at the element that does
            // (openInfo scrolls .info-desc so its buttons stay put).
            const cTrack = frame.querySelector('.cscroll-track');
            const cThumb = frame.querySelector('.cscroll-thumb');
            const cBody  = frame.querySelector('.win-body');
            let cScrollEl = cBody;
            function syncScroll() {
                const tbH = frame.querySelector('.win-titlebar').offsetHeight;
                cTrack.style.top    = (tbH + 6) + 'px';
                cTrack.style.bottom = '6px';
                if (cScrollEl.scrollHeight <= cScrollEl.clientHeight + 1) { cTrack.style.opacity = '0'; return; }
                cTrack.style.opacity = '';
                const ratio   = cScrollEl.scrollTop / (cScrollEl.scrollHeight - cScrollEl.clientHeight);
                const availH  = cTrack.offsetHeight - 6;
                cThumb.style.top = Math.round(ratio * availH) + 'px';
            }
            const cRO = new ResizeObserver(syncScroll);
            cScrollEl.addEventListener('scroll', syncScroll);
            frame.addEventListener('mouseenter', syncScroll);
            cRO.observe(cScrollEl);
            frame._setScrollEl = (el) => {
                if (!el || el === cScrollEl) return;
                cScrollEl.removeEventListener('scroll', syncScroll);
                cRO.unobserve(cScrollEl);
                cScrollEl = el;
                cScrollEl.addEventListener('scroll', syncScroll);
                cRO.observe(cScrollEl);
                syncScroll();
            };

            setTimeout(() => frame.classList.remove('spawning'), 320);
            return frame;
        }

        // ג"€ג"€ INFO WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // ── SLIDESHOW WINDOW ──────────────────────────────────────────────────────
        function openSlideshow(project) {
            focusOrCreate(`slides-${project.id}`, () => {
                const ws = document.getElementById('workspace');
                const { x, y } = nextSpawn(640, 440);
                const slides = project.slides;
                let idx = 0;

                const el = document.createElement('div');
                el.className = 'slide-float spawning';
                el.style.cssText = `left:${x}px;top:${y}px;z-index:${++topZ};width:640px;height:440px;`;
                openWins[`slides-${project.id}`] = el;
                el.dataset.projectId = project.id;

                // Alt text is positional rather than descriptive: these are
                // 145-slide project sequences with no per-slide captions
                // authored anywhere, and inventing descriptions would be worse
                // than stating position honestly. Slides are auto-scanned from
                // the folder, so per-slide captions would need a `slides:`
                // block in project.txt carrying `file | caption` pairs — the
                // same shape the `gallery:` block already uses.
                const slideAlt = i => `${project.title} — slide ${i + 1} of ${slides.length}`;

                el.setAttribute('role', 'group');
                el.setAttribute('aria-label', `${project.title} — slideshow, ${slides.length} slides`);
                el.tabIndex = -1;

                el.innerHTML = `
                    <img class="slide-img" draggable="false" decoding="async" src="${slides[0].src || slides[0]}" alt="${slideAlt(0)}">
                    <div class="slide-nav slide-nav-prev" role="button" tabindex="0" aria-label="Previous slide"><span class="slide-chevron" aria-hidden="true">&lt;</span></div>
                    <div class="slide-nav slide-nav-next" role="button" tabindex="0" aria-label="Next slide"><span class="slide-chevron" aria-hidden="true">&gt;</span></div>
                    <div class="slide-bar">
                        <span class="slide-title">${project.title}</span>
                        <span class="slide-counter" aria-live="polite" aria-atomic="true">1 / ${slides.length}</span>
                        <span class="slide-close" role="button" tabindex="0" aria-label="Close ${project.title} slideshow">&#x00D7;</span>
                    </div>
                    <div class="slide-resize"></div>
                `;

                ws.appendChild(el);
                setTimeout(() => el.classList.remove('spawning'), 320);

                const imgEl      = el.querySelector('.slide-img');
                const counterEl  = el.querySelector('.slide-counter');
                const docAC      = new AbortController();
                const docSig     = { signal: docAC.signal };

                // Warm the browser cache for the neighbouring slides so
                // prev/next doesn't wait on a fresh download.
                function preloadAround() {
                    [1, -1, 2].forEach(n => {
                        const s = slides[(idx + n + slides.length) % slides.length];
                        const im = new Image();
                        im.decoding = 'async';
                        im.src = s.src || s;
                    });
                }
                preloadAround();

                function go(n) {
                    idx = (idx + n + slides.length) % slides.length;
                    imgEl.src = slides[idx].src || slides[idx];
                    imgEl.alt = slideAlt(idx);
                    counterEl.textContent = `${idx + 1} / ${slides.length}`;
                    preloadAround();
                }

                const prevBtn = el.querySelector('.slide-nav-prev');
                const nextBtn = el.querySelector('.slide-nav-next');
                prevBtn.addEventListener('click', () => go(-1));
                nextBtn.addEventListener('click', () => go(1));
                onActivateKey(prevBtn, () => go(-1));
                onActivateKey(nextBtn, () => go(1));

                function closeSlides() {
                    docAC.abort();
                    el.classList.add('closing');
                    announce(`${project.title} slideshow closed`);
                    const back = el._opener;
                    setTimeout(() => {
                        el.remove();
                        delete openWins[`slides-${project.id}`];
                        if (back && back.isConnected) back.focus();
                        else focusTopmostWindow();
                    }, 220);
                }
                const slideCloseBtn = el.querySelector('.slide-close');
                slideCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeSlides(); });
                onActivateKey(slideCloseBtn, closeSlides);
                el._close = closeSlides;

                // Arrow keys / Home / End drive the sequence; Escape closes.
                // Scoped to the window so it only applies while focused.
                el.addEventListener('keydown', e => {
                    if (e.target.closest('input, select, textarea')) return;
                    switch (e.key) {
                        case 'ArrowLeft':  case 'ArrowUp':   go(-1); break;
                        case 'ArrowRight': case 'ArrowDown': go(1);  break;
                        case 'Home':       go(-idx); break;
                        case 'End':        go(slides.length - 1 - idx); break;
                        case 'Escape':     closeSlides(); break;
                        default: return;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                });

                // Drag
                el.addEventListener('pointerdown', () => el.style.zIndex = ++topZ);
                let dragging = false, resizing = false, ox = 0, oy = 0, rw = 0, rh = 0;
                el.addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    if (e.target.closest('.slide-nav, .slide-close, .slide-resize')) return;
                    dragging = true;
                    ox = e.clientX + ws.scrollLeft - el.offsetLeft;
                    oy = e.clientY + ws.scrollTop  - el.offsetTop;
                    el.style.cursor = 'grabbing';
                    document.body.classList.add('dragging'); e.preventDefault();
                });
                el.querySelector('.slide-resize').addEventListener('pointerdown', e => {
                    if (!e.isPrimary) return;
                    e.stopPropagation(); resizing = true;
                    ox = e.clientX; oy = e.clientY;
                    rw = el.offsetWidth; rh = el.offsetHeight;
                    document.body.classList.add('resizing'); e.preventDefault();
                });
                document.addEventListener('pointermove', e => {
                    if (!e.isPrimary) return;
                    if (dragging) {
                        el.style.left = Math.max(0, e.clientX + ws.scrollLeft - ox) + 'px';
                        el.style.top  = Math.max(0, e.clientY + ws.scrollTop  - oy) + 'px';
                    } else if (resizing) {
                        el.style.width  = Math.max(280, rw + e.clientX - ox) + 'px';
                        el.style.height = Math.max(200, rh + e.clientY - oy) + 'px';
                    }
                }, docSig);
                const endSlideDrag = () => {
                    if (dragging) { dragging = false; el.style.cursor = ''; document.body.classList.remove('dragging'); }
                    if (resizing) { resizing = false; document.body.classList.remove('resizing'); }
                };
                document.addEventListener('pointerup', endSlideDrag, docSig);
                document.addEventListener('pointercancel', endSlideDrag, docSig);
            });
        }

        // The project box is the project's menu, so it opens already showing its
        // text and its buttons rather than a fixed rectangle with both cut off.
        // Nir's rule (2026-09-28): about 10 words to a line, at most 20 lines,
        // and only then does the description scroll.
        const INFO_WORDS_PER_LINE = 10;
        const INFO_MAX_LINES      = 20;

        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Blank lines in a project.txt description are real paragraph breaks and
        // are rendered as such. They used to be discarded: the text went into a
        // single div, so CSS collapsed every break and ran the paragraphs
        // together — Pray & Play's seven became one block. Escaped rather than
        // interpolated raw, so an & or < in authored text can't break the markup.
        const descHTML = (text) => String(text ?? '')
            .split(/\n\s*\n/)
            .map(p => p.trim())
            .filter(Boolean)
            .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`)
            .join('');

        function sizeInfoToText(frame, body) {
            const desc = body.querySelector('.info-desc');
            if (!desc) return;
            const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

            const words = (desc.textContent || '').trim().split(/\s+/).filter(Boolean).length;
            const lineH = parseFloat(getComputedStyle(desc).lineHeight) || 20;

            // Width is DERIVED, never a fixed 400px: the theme editor can swap
            // the font family and scale it, and 400px of Junicode is not 400px
            // of Courier. Measure the real text offscreen, then solve for the
            // width that yields ~10 words a line. Characters-per-line scales
            // about linearly with width, so one probe plus one correction lands
            // within a word.
            const probe = desc.cloneNode(true);
            probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;' +
                                  'max-height:none;overflow:visible;flex:none;';
            document.body.appendChild(probe);

            const REF = 360;
            probe.style.width = REF + 'px';
            const refLines  = Math.max(1, Math.round(probe.offsetHeight / lineH));
            const wantLines = Math.max(1, Math.ceil(words / INFO_WORDS_PER_LINE));
            const innerW    = clampN(Math.round(REF * refLines / wantLines), 240, 520);

            probe.style.width = innerW + 'px';
            const fullH = probe.offsetHeight;                       // unclamped text height
            probe.remove();

            const bcs  = getComputedStyle(body);
            const padH = parseFloat(bcs.paddingLeft) + parseFloat(bcs.paddingRight);
            frame.style.width = Math.round(innerW + padH + 2) + 'px';   // +2 = frame border

            desc.style.flex = '0 0 auto';

            // Measure everything that is NOT the description — the meta line,
            // the participants line, the buttons, padding and titlebar. Summed
            // explicitly rather than read off scrollHeight, because the meta
            // line and the buttons wrap, so their heights are only real once the
            // width above has been applied.
            const padV    = parseFloat(bcs.paddingTop) + parseFloat(bcs.paddingBottom);
            const gap     = parseFloat(bcs.rowGap) || 0;
            const kids    = [...body.children];
            const chromeH = frame.querySelector('.win-titlebar').offsetHeight + 2;
            let fixedH    = padV + gap * Math.max(0, kids.length - 1) + chromeH;
            for (const k of kids) if (k !== desc) fixedH += k.offsetHeight;

            // The description takes its own height, the 20-line cap, or whatever
            // the screen leaves once the fixed parts are paid for — whichever is
            // smallest. The screen term matters on a laptop, where 20 lines does
            // not fit; without it the box is clamped but the description is not,
            // and the buttons are the thing pushed out of view. They are what
            // makes this box the project's menu, so they are never squeezed.
            const capPx  = Math.round(INFO_MAX_LINES * lineH);
            const roomPx = (window.innerHeight - 38) - fixedH;
            const descH  = Math.max(lineH, Math.min(fullH, capPx, roomPx));

            desc.style.maxHeight = Math.round(descH) + 'px';
            const h = Math.max(180, Math.round(fixedH + descH));
            frame.style.height = h + 'px';

            // Hand the measured size to the packer so it arranges around the box
            // instead of recomputing one for it.
            frame._naturalW = frame.offsetWidth;
            frame._naturalH = h;
        }

        function openInfo(project) {
            focusOrCreate(`info-${project.id}`, () => {
                // No type tag: the window title is the project name, and an
                // "Info" tag beside it said nothing the title did not.
                const frame = makeFrame({ title: project.title, w: 360, h: 340, key: `info-${project.id}`, bodyDrag: true, projectId: project.id });
                const body = frame.querySelector('.win-body');
                body.className += ' info-body';

                const hasModel  = !!project.model;
                const hasImages = project.images && project.images.length > 0;
                const hasSlides = project.slides && project.slides.length > 0;
                // Several models ⇒ the 3D button grows a caret and drops a list.
                const modelList = (project.models && project.models.length > 1) ? project.models : null;

                // Warm the HTTP cache so the 3D viewer opens without a download wait
                if (hasModel) fetch(project.model, { priority: 'low' }).catch(() => {});

                body.innerHTML = `
                    <div class="info-meta">
                        <span>${project.year}</span>
                        <span class="info-meta-sep">·</span>
                        <span>${project.location}</span>
                        <span class="info-meta-sep">·</span>
                        <span>${project.type}</span>
                    </div>
                    <div class="info-desc">${descHTML(project.description)}</div>
                    <div class="info-participants">${esc(project.participants)}</div>
                    ${project.credit ? `<div class="info-credit">${esc(project.credit).replace(/\n/g, '<br>')}</div>` : ''}
                    <div class="info-actions">
                        ${hasSlides ? `<button class="action-btn slides-btn">Slides</button>` : ''}
                        ${hasImages ? `<button class="action-btn gallery-btn">Gallery</button>` : ''}
                        ${hasModel ? (modelList ? `
                            <span class="model-picker">
                                <button class="action-btn viewer-btn" aria-haspopup="true" aria-expanded="false">3D View<span class="action-caret" aria-hidden="true">&#x25BE;</span></button>
                                <div class="model-menu" role="menu" hidden>
                                    ${modelList.map((m, i) => `<button class="model-menu-item" role="menuitem" data-model-index="${i}">${m.label}</button>`).join('')}
                                </div>
                            </span>`
                            : `<button class="action-btn viewer-btn">3D View</button>`) : ''}
                    </div>
                `;

                sizeInfoToText(frame, body);
                frame._setScrollEl(body.querySelector('.info-desc'));

                if (hasSlides) body.querySelector('.slides-btn').addEventListener('click', () => openSlideshow(project));
                if (hasImages) body.querySelector('.gallery-btn').addEventListener('click', () => openGallery(project));

                if (hasModel && !modelList) {
                    body.querySelector('.viewer-btn').addEventListener('click', () => open3D(project));
                } else if (hasModel) {
                    const trigger = body.querySelector('.viewer-btn');
                    const menu    = body.querySelector('.model-menu');
                    const setOpen = (open) => {
                        menu.hidden = !open;
                        trigger.setAttribute('aria-expanded', String(open));
                    };
                    const picker = body.querySelector('.model-picker');
                    trigger.addEventListener('click', e => {
                        e.stopPropagation();
                        setOpen(menu.hidden);
                        trigger.focus();     // so Escape below has somewhere to land
                    });
                    menu.querySelectorAll('.model-menu-item').forEach(item => {
                        item.addEventListener('click', e => {
                            e.stopPropagation();
                            setOpen(false);
                            open3D(project, Number(item.dataset.modelIndex));
                        });
                    });
                    // Close on click-away and on Escape. Scoped to the window's
                    // own AbortController so it tears down with the frame.
                    document.addEventListener('click', e => {
                        if (!e.target.closest('.model-picker')) setOpen(false);
                    }, { signal: frame._sig });
                    // On the PICKER, not the frame. makeFrame already has an
                    // Escape→close-window listener on the frame, registered
                    // first, so a second frame listener fires too late and the
                    // whole box closes instead of the menu. A listener on this
                    // descendant runs before the frame's, so Escape closes the
                    // menu when focus is inside the picker and still closes the
                    // window from anywhere else.
                    picker.addEventListener('keydown', e => {
                        if (e.key !== 'Escape' || menu.hidden) return;
                        e.stopPropagation();
                        setOpen(false);
                        trigger.focus();
                    });
                }

                // Sidebar "open" state is DERIVED from what is actually on the
                // canvas (see syncMenuOpen). It used to be added here and removed
                // only by a click on the × — so closing with Escape, or from
                // code, left the row dimmed to 0.3 forever. Switching projects
                // does exactly that, which is how the old bug surfaced.
                syncMenuOpen();
            });
        }

        // Open a project = Info + every feature it has, then tile them.
        // Opening a project shows the text box, the gallery and the 3D model —
        // NOT the slides, which are one button away (Nir, 2026-09-28). Opening
        // everything at once made the box's buttons a re-opener rather than a
        // way in; now they are the way in. A project carrying several models
        // still opens only ONE window, the one marked in its project.txt.
        function openProject(project) {
            openInfo(project);
            if (project.images && project.images.length) openGallery(project);
            if (project.model) open3D(project);
            requestAnimationFrame(() => tileProjectWindows(project));
        }

        // ── NAVIGATING BETWEEN PROJECTS ───────────────────────────────────────
        // Every window a project owns is stamped with data-project-id when it is
        // built, so this needs no knowledge of the openWins key spelling — which
        // matters because a multi-model project's 3D keys carry an open-ended
        // `-<n>` suffix.
        const projectWindows = id =>
            [...document.querySelectorAll(`[data-project-id="${id}"]`)].filter(el => !el.classList.contains('closing'));

        function closeProjectWindows(id) {
            const wins = id ? projectWindows(id) : [];
            wins.forEach(el => el._close && el._close());
            return wins.length;
        }

        // Every project window on the canvas except one project's. Left-click
        // means "take me here", so it clears whatever else is open — including
        // a project that was added alongside by right-click, which is not the
        // active one and so used to survive the swap.
        function closeOtherProjects(keepId) {
            const wins = [...document.querySelectorAll('[data-project-id]')]
                .filter(el => !el.classList.contains('closing') && el.dataset.projectId !== keepId);
            wins.forEach(el => el._close && el._close());
            return wins.length;
        }

        // Left-click / Enter on a menu row, and the landing's "Go to project".
        // The old project's windows go; About / CV / Contact and the theme
        // editor are not owned by any project, so they survive (Nir's call).
        // The open is DELAYED past the close animation, so it has to be
        // cancellable: clicking a third project before the previous open landed
        // used to let that pending open fire with nothing left to close it, and
        // its windows stayed on screen for good.
        let pendingOpen = null;

        function goToProject(project) {
            clearTimeout(pendingOpen);
            const closed = closeOtherProjects(project.id) + closeLanding();

            activeProject = project;
            tintSite(project);
            syncMenuActive();
            syncProjectColorRow();
            announce(`${project.title} opened`);

            // closeFrame removes the element on a 220ms timer, and the tiler
            // treats every .win-frame on screen as an obstacle — so opening
            // immediately would lay the new project out around windows that are
            // already dying. Wait them out, but only when something closed.
            if (closed) pendingOpen = setTimeout(() => openProject(project), 240);
            else openProject(project);
        }

        // Right-click / Shift+Enter. Opens next to what is already here and
        // tints only its OWN windows, leaving the site's colour untouched.
        function openAlongside(project) {
            openProject(project);
            // Ink only, same reason as the landing: the page background belongs
            // to whichever project owns the page, not to one opened beside it.
            const paint = () => projectWindows(project.id).forEach(el => tintFrame(el, inkOf(project), null));
            paint();
            requestAnimationFrame(paint);      // catch windows built on the next frame
            announce(`${project.title} opened alongside`);
        }

        // Home closes EVERY project window, not just the active project's. The
        // "only the old project closes" rule is about switching between
        // projects; Home means "back to the front door", and a project opened
        // alongside by right-click would otherwise be left scattered across the
        // landing it just reopened. About / CV / Contact and the theme editor
        // belong to no project and survive, as they do everywhere else.
        function goHome() {
            clearTimeout(pendingOpen);
            const stray = [...document.querySelectorAll('[data-project-id]')]
                .filter(el => !el.classList.contains('closing'));
            stray.forEach(el => el._close && el._close());
            closeLanding();
            clearTint();
            announce('Home');
            setTimeout(openLanding, 260);
        }

        // Menu feedback: `hot` is the hover signal, shown both when you hover
        // the row itself and when you hover one of that project's windows on
        // the landing, so the two light up together.
        function setMenuHot(id, on) {
            const row = document.querySelector(`.proj-row[data-id="${id}"]`);
            if (row) row.classList.toggle('hot', !!on);
        }
        // `.open` dims a project's menu row while its windows are on screen.
        // Derived, never bookkept: a row is open if a window carrying that
        // project id exists and is not already closing.
        function syncMenuOpen() {
            const live = new Set([...document.querySelectorAll('[data-project-id]')]
                .filter(el => !el.classList.contains('closing') && !el.dataset.landing)
                .map(el => el.dataset.projectId));
            document.querySelectorAll('.proj-row[data-id]').forEach(row => {
                row.classList.toggle('open', live.has(row.dataset.id));
            });
        }

        function syncMenuActive() {
            document.querySelectorAll('.proj-row[data-id]').forEach(row => {
                row.classList.toggle('active', !!activeProject && row.dataset.id === activeProject.id);
            });
        }

        // Content-proportional packer for a single project's windows.
        // (Separate from orderWindows/BSP — this one sizes each window to its
        // content and packs into rows, never stretching to fill the canvas.)
        function tileProjectWindows(project) {
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const ws = document.getElementById('workspace');
            const vw = window.innerWidth, vh = window.innerHeight;
            const gap = 10, topY = 28, leftX = 28;

            // Reserve the pinned left column (menu + theme)
            const menuEl   = document.getElementById('menu-body-inner')?.closest('.win-frame');
            const leftColW = (menuEl ? menuEl.offsetWidth : 228) + gap;
            const areaX    = leftX + leftColW;
            const availW   = vw - areaX - gap;
            const availH   = vh - topY  - gap;

            // Per-window caps so nothing dominates an unknown viewport
            const capW = Math.min(availW, vw * 0.46);
            const capH = Math.min(availH, vh * 0.62);

            const items = [];

            // 3D — the hero, a little bigger than the rest
            // A multi-model project keys its windows `3d-<id>-<n>`; a single
            // model keeps the plain key. Only the one openProject opened (n=0)
            // takes part in the tiling — later picks from the dropdown spawn
            // normally, like any window opened on its own.
            const el3d = openWins[`3d-${project.id}`] || openWins[`3d-${project.id}-0`];
            if (el3d) {
                let w = clamp(vw * 0.40, 460, capW);
                let h = clamp(w * 0.78, 340, capH);
                items.push({ el: el3d, w, h, frame: true });
            }

            // Slideshow — match the image's aspect ratio (object-fit:contain,
            // so no dead space). Real ratio known only once the image loads.
            const elSl = openWins[`slides-${project.id}`];
            if (elSl) {
                const img = elSl.querySelector('.slide-img');
                const ar  = (img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : 3 / 2;
                let h = clamp(vh * 0.40, 240, capH);
                let w = h * ar;
                if (w > capW) { w = capW; h = w / ar; }
                items.push({ el: elSl, w, h, frame: false });
                if (img && !img.naturalWidth && !img.dataset.tileHook) {
                    img.dataset.tileHook = '1';
                    img.addEventListener('load', () => tileProjectWindows(project), { once: true });
                }
            }

            // Gallery — tidy grid, aim for 2 rows; body scrolls if there are more.
            // Match the CSS grid: minmax(140px,1fr) columns, 4:3 thumbs (see .gallery-grid).
            const elG = openWins[`gallery-${project.id}`];
            if (elG) {
                const n = (project.images && project.images.length) || 1;
                const colW = 190, bar = 34, gg = 1;            // colW ≥ 140 so auto-fill keeps our column count
                const maxCols = Math.max(1, Math.floor(capW / 150));
                let cols = clamp(Math.ceil(n / 2), 1, 4);
                cols = Math.min(cols, n, maxCols);
                const rows = Math.min(2, Math.ceil(n / cols));
                let w = clamp(cols * colW + (cols + 1) * gg, 260, capW);   // 260 = .win-frame min-width
                const thumbH = ((w - (cols + 1) * gg) / cols) * 3 / 4;   // actual stretched thumb height
                let h = clamp(rows * thumbH + (rows + 1) * gg + bar, 200, capH);
                items.push({ el: elG, w, h, frame: true });
            }

            // The project box keeps the size openInfo measured for its text —
            // the packer arranges AROUND it rather than computing a size for it.
            // It is also pinned first so it packs leftmost, nearest the menu:
            //   menu | text box | 3D / slides / gallery
            // It used to land rightmost, because the packer sorts tallest-first
            // and it was the shortest window.
            const elI = openWins[`info-${project.id}`];
            if (elI) {
                items.push({
                    el: elI,
                    w: elI._naturalW || elI.offsetWidth || 340,
                    h: elI._naturalH || elI.offsetHeight || 340,
                    frame: true, pinFirst: true, noShrink: true,
                });
            }

            if (!items.length) return;

            const themeFrame = openWins['theme'];
            const mine = new Set(items.map(it => it.el));

            // Shelf-pack into a block with a LOCAL origin (0,0), so we can drop
            // the whole block anywhere afterwards. Tallest-first, EXCEPT the
            // pinned project box, which always goes first so it sits leftmost.
            const pinned = items.filter(it => it.pinFirst);
            const others = items.filter(it => !it.pinFirst).sort((a, b) => b.h - a.h);
            const order  = [...pinned, ...others];
            function pack(scale) {
                let x = 0, y = 0, rowH = 0, maxR = 0, maxB = 0;
                const rects = [];
                for (const it of order) {
                    // noShrink windows sit out the global fit-to-screen pass —
                    // the project box was sized to its text and shrinking it
                    // would clip the text again, which is the whole point.
                    const sc = it.noShrink ? 1 : scale;
                    // .win-frame has CSS min 260x180 — never size a frame below it,
                    // or it renders larger than we think and overlaps its neighbour.
                    const w = it.frame ? Math.max(260, it.w * sc) : it.w * sc;
                    const h = it.frame ? Math.max(180, it.h * sc) : it.h * sc;
                    if (x > 0 && x + w > availW) { x = 0; y += rowH + gap; rowH = 0; }
                    rects.push({ el: it.el, frame: it.frame, x, y, w, h });
                    x += w + gap; rowH = Math.max(rowH, h);
                    maxR = Math.max(maxR, x - gap); maxB = Math.max(maxB, y + rowH);
                }
                return { rects, maxR, maxB };
            }
            // Global fit-to-screen: shrink the block if it overflows. Iterated,
            // because the pinned project box sits out the shrink — one pass of
            // availW/maxR would undershoot now that part of the block is fixed.
            let L = pack(1), s = 1;
            for (let i = 0; i < 4 && (L.maxR > availW + 0.5 || L.maxB > availH + 0.5); i++) {
                s *= Math.min(1, availW / L.maxR, availH / L.maxB);
                L = pack(s);
            }
            const bw = L.maxR, bh = L.maxB;

            // Drop the block in the first free spot: to the RIGHT of an earlier
            // project if it fits there, otherwise BELOW it. Not strict — just
            // uses the screen instead of always stacking straight down.
            const obstacles = [...ws.querySelectorAll('.win-frame, .slide-float, .img-float')]
                .filter(f => f !== menuEl && f !== themeFrame && !mine.has(f))
                .map(f => ({ x: f.offsetLeft, y: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight }));
            const maxBottom = obstacles.reduce((y, o) => Math.max(y, o.y + o.h), topY);
            const hits = (x, y) => obstacles.some(o =>
                x < o.x + o.w + gap && x + bw + gap > o.x &&
                y < o.y + o.h + gap && y + bh + gap > o.y);
            let spot = { x: areaX, y: maxBottom + gap };   // fallback: below everything
            scan:
            for (let y = topY; y <= maxBottom + bh + 20; y += 20)
                for (let x = areaX; x + bw <= vw - gap; x += 20)
                    if (!hits(x, y)) { spot = { x, y }; break scan; }

            for (const r of L.rects) {
                Object.assign(r.el.style, {
                    left:   Math.round(spot.x + r.x) + 'px',
                    top:    Math.round(spot.y + r.y) + 'px',
                    width:  Math.round(r.w) + 'px',
                    height: Math.round(r.h) + 'px',
                    zIndex: ++topZ,
                });
                if (r.frame) r.el.dispatchEvent(new CustomEvent('win-resize'));
            }
        }

        // ג"€ג"€ GALLERY WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // Gallery grids render 400px derivatives from gallery/thumbs/, not the
        // full-size originals — the originals run 1900-3840px wide, which cost
        // ~29 MB to draw a grid of ~190px cells. Clicking still opens the full
        // image via openImage(). Regenerate with D:/projects/Website/_local/tools/make-thumbs.mjs (outside git).
        // Falls back to the original if a thumb is missing (see 'error' handler).
        const thumbSrc = src => src.replace(/\/gallery\/(?!thumbs\/)([^/]+)$/, '/gallery/thumbs/$1');

        function openGallery(project) {
            focusOrCreate(`gallery-${project.id}`, () => {
                const frame = makeFrame({ title: project.title + ' — Gallery', tag: 'Gallery', w: 500, h: 400, minW: 300, key: `gallery-${project.id}`, projectId: project.id });
                const body = frame.querySelector('.win-body');
                body.className += ' gallery-body';

                const primaryKey = `img-primary-${project.id}`;
                let secondaryCount = 0;

                function showGrid() {
                    body.innerHTML = `
                        <div class="gallery-grid">
                            ${project.images.map((img, i) => `
                                <div class="gallery-thumb" data-i="${i}" role="button" tabindex="0"
                                     aria-label="${img.label ? `${img.label} — open full size` : `${project.title} — image ${i + 1} of ${project.images.length}, open full size`}">
                                    <img src="${thumbSrc(img.src)}" data-full="${img.src}" alt="" loading="lazy" decoding="async">
                                    ${img.label ? `<div class="thumb-label">${img.label}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    body.querySelectorAll('.gallery-thumb').forEach(el => {
                        const i = parseInt(el.dataset.i);
                        // Missing/failed thumb: fall back to the full image once,
                        // so a project without generated thumbs still renders.
                        const thumbEl = el.querySelector('img');
                        thumbEl.addEventListener('error', () => { thumbEl.src = thumbEl.dataset.full; }, { once: true });
                        const openPrimary = () => {
                            const img = project.images[i];
                            const existing = openWins[primaryKey];
                            if (existing && existing.isConnected) {
                                swapImageContent(existing, img.src, img.label);
                            } else {
                                openImage({ src: img.src, label: img.label, key: primaryKey, projectId: project.id,
                                            fallbackLabel: `${project.title} — image ${i + 1} of ${project.images.length}` });
                            }
                        };
                        el.addEventListener('click', openPrimary);
                        onActivateKey(el, openPrimary);
                        el.addEventListener('contextmenu', e => {
                            e.preventDefault();
                            const img = project.images[i];
                            openImage({ src: img.src, label: img.label, key: `img-sec-${project.id}-${++secondaryCount}`, projectId: project.id });
                        });
                    });
                }

                showGrid();
            });
        }

        // ג"€ג"€ TEXT WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        // ── IMAGE VIEWER ──────────────────────────────────────────────────────
        function swapImageContent(el, src, label) {
            const img = el.querySelector('img');
            const title = el.querySelector('.img-float-title');
            const alt = label || src.split('/').pop().replace(/\.[a-z0-9]+$/i, '');
            img.src = src; img.alt = alt;
            el.setAttribute('aria-label', alt);
            title.textContent = label || '';
            el.style.zIndex = ++topZ;
            announce(alt);          // the window is reused, so nothing else signals the change
        }

        function openImage({ src, label = '', key, fallbackLabel = '', projectId = null }) {
            const ws = document.getElementById('workspace');
            const { x, y } = nextSpawn(220, 220);
            // The visible bar shows label only (blank is fine there), but the
            // image always needs a non-empty accessible name.
            const altText = label || fallbackLabel || src.split('/').pop().replace(/\.[a-z0-9]+$/i, '');

            const el = document.createElement('div');
            el.className = 'img-float';
            el.style.cssText = `left:${x}px;top:${y}px;z-index:${++topZ};width:400px;height:300px;`;
            el.setAttribute('role', 'group');
            el.setAttribute('aria-label', altText);
            el.tabIndex = -1;
            // Opened straight from a thumb click, not via focusOrCreate, so
            // record the opener here for focus return.
            const opener = document.activeElement;
            if (opener && opener !== document.body) el._opener = opener;
            if (key) openWins[key] = el;
            if (projectId) el.dataset.projectId = projectId;

            el.innerHTML = `
                <img draggable="false" src="${src}" alt="${altText}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;">
                <div class="img-float-bar">
                    <span class="img-float-title">${label}</span>
                    <span class="img-float-close" role="button" tabindex="0" aria-label="Close image">×</span>
                </div>
                <div class="img-float-chrome"></div>
                <div class="img-float-resize"></div>
            `;

            ws.appendChild(el);

            // Size to natural image dimensions once loaded
            const img = el.querySelector('img');
            img.addEventListener('load', () => {
                // An authored landing size wins over the image's own dimensions
                // — sizing the window is the whole point of composing a landing,
                // and this handler would otherwise snap it back on load.
                if (el.dataset.sizeLocked) return;
                const maxW = window.innerWidth  * 0.80;
                const maxH = window.innerHeight * 0.75;
                const scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
                el.style.width  = Math.round(img.naturalWidth  * scale) + 'px';
                el.style.height = Math.round(img.naturalHeight * scale) + 'px';
            }, { once: true });

            el.addEventListener('pointerdown', () => el.style.zIndex = ++topZ);

            const docAC  = new AbortController();
            const docSig = { signal: docAC.signal };
            function closeImage() {
                docAC.abort();
                el.classList.add('closing');
                const back = el._opener;
                setTimeout(() => {
                    el.remove();
                    if (key) delete openWins[key];
                    if (back && back.isConnected) back.focus();
                    else focusTopmostWindow();
                }, 220);
            }
            const imgCloseBtn = el.querySelector('.img-float-close');
            imgCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeImage(); });
            onActivateKey(imgCloseBtn, closeImage);
            el._close = closeImage;
            el.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                e.stopPropagation();
                closeImage();
            });

            // Drag
            let dragging = false, resizing = false, ox = 0, oy = 0, rw = 0, rh = 0;
            el.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target.classList.contains('img-float-close') || e.target.classList.contains('img-float-resize')) return;
                dragging = true;
                ox = e.clientX + ws.scrollLeft - el.offsetLeft;
                oy = e.clientY + ws.scrollTop - el.offsetTop;
                document.body.classList.add('dragging'); e.preventDefault();
            });

            // Resize
            el.querySelector('.img-float-resize').addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                e.stopPropagation();
                resizing = true;
                ox = e.clientX; oy = e.clientY;
                rw = el.offsetWidth; rh = el.offsetHeight;
                document.body.classList.add('resizing'); e.preventDefault();
            });

            document.addEventListener('pointermove', e => {
                if (!e.isPrimary) return;
                if (dragging) {
                    el.style.left = Math.max(0, e.clientX + ws.scrollLeft - ox) + 'px';
                    el.style.top  = Math.max(0, e.clientY + ws.scrollTop - oy) + 'px';
                } else if (resizing) {
                    el.style.width  = Math.max(120, rw + e.clientX - ox) + 'px';
                    el.style.height = Math.max(80,  rh + e.clientY - oy) + 'px';
                }
            }, docSig);
            const endImgDrag = () => {
                if (dragging)  { dragging  = false; document.body.classList.remove('dragging'); }
                if (resizing)  { resizing  = false; document.body.classList.remove('resizing'); }
            };
            document.addEventListener('pointerup', endImgDrag, docSig);
            document.addEventListener('pointercancel', endImgDrag, docSig);
        }

        // ── TEXT WINDOW ────────────────────────────────────────────────────────
        function openText(key) {
            const content = STATIC[key];
            if (!content) return;
            focusOrCreate(`text-${key}`, () => {
                const tagLabel = key === 'cv' ? 'CV' : key[0].toUpperCase() + key.slice(1);
                const frame = makeFrame({ title: content.title, tag: tagLabel, w: 420, h: 460, key: `text-${key}`, bodyDrag: true });
                const body = frame.querySelector('.win-body');
                body.className += ' text-body';
                body.innerHTML = `<pre class="text-content">${content.body}</pre>`;
            });
        }

        // ── PROJECT COLOUR ─────────────────────────────────────────────────────
        // Every project can own a colour, authored as `color:` in its own
        // project.txt. It is used at two scopes, and they are the SAME two CSS
        // custom properties in both cases — which is the whole trick:
        //
        //   on one .win-frame  →  that window alone is tinted (the landing, and
        //                         projects opened alongside by right-click)
        //   on :root           →  the entire site is tinted (the active project)
        //
        // Custom properties inherit, and every rule in this stylesheet already
        // reads var(--fg) / var(--border-strong), so a frame-level override
        // repaints that window's border, title, body text and buttons for free.
        //
        // A project with no `color:` returns null here and tints nothing, so the
        // whole system is invisible until a colour is actually authored.
        const projectColorKey = (id, which) => `dellus-proj-${which}-${id}`;
        const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

        // A project's pair: ink and background. Either can be overridden by the
        // visitor from the Theme window; neither is required.
        function inkOf(project) {
            if (!project) return null;
            return lsGet(projectColorKey(project.id, 'color')) || project.color || null;
        }
        function bgOf(project) {
            if (!project) return null;
            return lsGet(projectColorKey(project.id, 'background')) || project.background || null;
        }
        // Kept as the one-call form used all over the window code.
        const colorOf = inkOf;

        // Paint a pair onto an element (or the document root). Kept separate
        // from persistence on purpose — see applyFg below.
        //
        // A PROJECT OWNS BOTH COLOURS (Nir, 2026-09-29). The site already works
        // in exactly two — a background and an ink — so a project simply sets
        // both. Nothing is derived or mixed: what is authored is what is shown.
        // The site is 1px linework, so an ink-only change had almost no area to
        // read in; the background is where the colour actually lives.
        function paintPair(el, ink, bg) {
            if (ink) { el.style.setProperty('--fg', ink); el.style.setProperty('--border-strong', ink); }
            if (bg)  { el.style.setProperty('--bg', bg); }
        }
        const paintInk = (el, hex) => paintPair(el, hex, null);
        function tintFrame(frame, ink, bg) {
            if (!frame || (!ink && !bg)) return;
            paintPair(frame, ink, bg);
            // The 3D viewer reads its colours from its own frame, not the root,
            // so a tinted landing model needs to be told the frame changed.
            frame.dispatchEvent(new CustomEvent('frame-tint', { bubbles: false }));
        }

        // `userInk` is the visitor's OWN choice and the only ink that is ever
        // persisted. A project tint borrows the site's colour and gives it back
        // untouched when the tint ends, so browsing the site never destroys a
        // theme the visitor picked (Nir, 2026-09-29).
        // The site's colours at rest. A visitor's own Theme choice wins; with
        // none saved, the landing's authored pair is the default — that is what
        // the site wears before any project is opened, and what Home returns to.
        const LAND = (typeof LANDING !== 'undefined' && LANDING) || {};
        let userInk    = lsGet('dellus-fg') || LAND.color      || '#000';
        let userCanvas = lsGet('dellus-bg') || LAND.background || '#ffffff';
        let activeProject = null;

        function setSitePair(ink, bg) {
            const root = document.documentElement;
            root.style.setProperty('--fg', ink);
            root.style.setProperty('--border-strong', ink);
            root.style.setProperty('--bg', bg);
            window.dispatchEvent(new CustomEvent('theme-change', { detail: { fg: ink, bg } }));
        }
        const setSiteInk = (hex) => setSitePair(hex, userCanvas);
        // Back to the visitor's own ink AND their own canvas — a project tint is
        // borrowed, never kept.
        function restoreUserTheme() {
            setSitePair(userInk, userCanvas);
        }
        // The whole page takes the project's pair. Anything the project does not
        // author falls back to the colour the site was already wearing.
        function tintSite(project) {
            const ink = inkOf(project), bg = bgOf(project);
            if (!ink && !bg) restoreUserTheme();
            else setSitePair(ink || userInk, bg || userCanvas);
        }
        // Push a project's (possibly just-changed) colour everywhere it shows:
        // the site tint if it is the active one, its own windows, and its menu
        // row's --sig.
        function repaintProject(project) {
            const ink = inkOf(project), bg = bgOf(project);
            const row = document.querySelector(`.proj-row[data-id="${project.id}"]`);
            if (row) { if (ink) row.style.setProperty('--sig', ink); else row.style.removeProperty('--sig'); }
            if (activeProject && activeProject.id === project.id) tintSite(project);
            projectWindows(project.id).forEach(el => {
                if (el.dataset.landing || !activeProject || activeProject.id !== project.id) tintFrame(el, ink, bg);
            });
        }

        // Keeps the Theme window's Colour project row in step with wherever the
        // visitor is. The row stays PRESENT but disabled with no active project,
        // so the window does not change height as you browse.
        function syncProjectColorRow() {
            const row = document.querySelector('.theme-proj-row');
            if (!row) return;
            const inkEl = row.querySelector('.theme-proj-ink');
            const bgEl  = row.querySelector('.theme-proj-bg');
            const name  = row.querySelector('.theme-proj-name');
            const reset = row.querySelector('.theme-proj-reset');
            const on    = !!activeProject;
            row.style.opacity = on ? '' : '0.4';
            inkEl.disabled = bgEl.disabled = reset.disabled = !on;
            name.textContent = on ? activeProject.title : 'No project open';
            if (on) {
                inkEl.value = inkOf(activeProject) || userInk;
                bgEl.value  = bgOf(activeProject)  || userCanvas;
            }
        }

        function clearTint() {
            activeProject = null;
            restoreUserTheme();
            syncMenuActive();
            syncProjectColorRow();
        }

            document.documentElement.style.setProperty('--font-scale', v);

        // The visitor's own ink choice — the ONLY path that writes to storage.
        // Choosing an ink (or a Canvas preset, which calls through to here) is
        // an explicit statement of preference, so it also drops any active
        // project tint: otherwise the picker would visibly do nothing while a
        // project was open. The project's windows stay put; clicking the
        // project again re-tints.
        function applyFg(hex) {
            userInk = hex;
            localStorage.setItem('dellus-fg', hex);
            if (activeProject) {
                activeProject = null;
                syncMenuActive();
                syncProjectColorRow();

            restoreUserTheme();

        function applyFont(fontId) {
            const f = FONTS.find(x => x.id === fontId);

            localStorage.setItem('dellus-font-id', fontId);
            document.querySelectorAll('.theme-font-btn[data-font-id]').forEach(b => {
                b.classList.toggle('active', b.dataset.fontId === fontId);
            });
        }
        function applyBg(hex, id) {
            userCanvas = hex;                       // the wash is mixed into this
            document.documentElement.style.setProperty('--bg', hex);
            localStorage.setItem('dellus-bg', hex);
            localStorage.setItem('dellus-bg-id', id || '__custom__');
            document.querySelectorAll('.theme-swatch[data-id]').forEach(s => {
                s.classList.toggle('active', s.dataset.id === (id || '__custom__'));
            });
            const theme = THEMES.find(t => t.id === id);
            if (theme) applyFg(theme.fg);
            window.dispatchEvent(new CustomEvent('theme-change', { detail: { bg: hex } }));
        }

        // ג"€ג"€ 3D VIEWER ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€
        class SimpleOrbit {
            constructor(camera, el) {
                this.camera = camera; this.el = el;
                this.target = new THREE.Vector3();
                this.radius = camera.position.length();
                this.rotX = 0; this.rotY = 0; this.tRotX = 0; this.tRotY = 0;
                this.autoSpeed = 0.003; this.isOrbit = false; this.isPan = false;
                this.pX = 0; this.pY = 0;

                this._ac = new AbortController();
                const sig = { signal: this._ac.signal };
                const skip = e => e.target.closest('.win-bottom-bar') || e.target.closest('.win-settings');
                this._pts = new Map();   // active pointers over the viewer
                this._pinch = null;      // pinch gesture start state
                this.el.style.touchAction = 'none';
                this.el.addEventListener('contextmenu', e => e.preventDefault());
                this.el.addEventListener('pointerdown', e => {
                    if (skip(e)) return;
                    this._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (this._pts.size === 2) {
                        // second finger: switch from orbit to pinch-zoom
                        const [a, b] = [...this._pts.values()];
                        this._pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), radius: this.radius };
                        this.isOrbit = false; this.isPan = false;
                        return;
                    }
                    if (e.button === 0) this.isOrbit = true;
                    if (e.button === 1 || e.button === 2) this.isPan = true;
                    this.pX = e.clientX; this.pY = e.clientY;
                });
                window.addEventListener('pointermove', e => {
                    if (this._pts.has(e.pointerId)) this._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    if (this._pinch && this._pts.size >= 2) {
                        const [a, b] = [...this._pts.values()];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d > 1) this.radius = Math.max(0.3, Math.min(200, this._pinch.radius * this._pinch.dist / d));
                        return;
                    }
                    if (!e.isPrimary) return;
                    const dx = e.clientX - this.pX, dy = e.clientY - this.pY;
                    if (this.isOrbit) {
                        this.tRotY += dx * 0.005; this.tRotX += dy * 0.005;
                        this.tRotX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, this.tRotX));
                    }
                    if (this.isPan) {
                        const s = this.radius * 0.0012;
                        const fwd = new THREE.Vector3(); this.camera.getWorldDirection(fwd);
                        const right = new THREE.Vector3().crossVectors(fwd, this.camera.up).normalize();
                        const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
                        this.target.addScaledVector(right, -dx * s);
                        this.target.addScaledVector(up, dy * s);
                    }
                    this.pX = e.clientX; this.pY = e.clientY;
                }, sig);
                const endPtr = e => {
                    this._pts.delete(e.pointerId);
                    if (this._pts.size < 2) this._pinch = null;
                    if (this._pts.size === 0) { this.isOrbit = false; this.isPan = false; }
                };
                window.addEventListener('pointerup', endPtr, sig);
                window.addEventListener('pointercancel', endPtr, sig);
                this.el.addEventListener('wheel', e => {
                    e.preventDefault();
                    this.radius = Math.max(0.3, Math.min(200, this.radius * (e.deltaY > 0 ? 1.1 : 0.9)));
                }, { passive: false });
            }
            dispose() { this._ac.abort(); }
            update() {
                if (!this.isOrbit && !this.isPan) this.tRotY += this.autoSpeed;
                this.rotX += (this.tRotX - this.rotX) * 0.08;
                this.rotY += (this.tRotY - this.rotY) * 0.08;
                this.camera.position.x = this.target.x + this.radius * Math.sin(this.rotY) * Math.cos(this.rotX);
                this.camera.position.y = this.target.y + this.radius * Math.sin(this.rotX);
                this.camera.position.z = this.target.z + this.radius * Math.cos(this.rotY) * Math.cos(this.rotX);
                this.camera.lookAt(this.target);
            }
        }

        class AsciiEffect {
            constructor(renderer, chars, opts = {}) {
                this.renderer = renderer;
                this._chars = chars; this._inv = opts.invert || false; this._res = opts.resolution || 0.4;
                this.domElement = document.createElement('div');
                Object.assign(this.domElement.style, {
                    whiteSpace: 'pre', fontFamily: "'Courier New',Courier,monospace",
                    letterSpacing: '0.05em', color: opts.color || '#000',
                    backgroundColor: opts.bg || '#f5fccc', overflow: 'hidden',
                });
                this._c = document.createElement('canvas');
                this._x = this._c.getContext('2d', { willReadFrequently: true });
                this._w = 0; this._h = 0;
                // When set to { glyphs }, the scene is expected to be rendering
                // flat per-part id colours and each part gets its own character
                // instead of a shading ramp. See buildPartGlyphs() in open3D.
                this.partPass = null;
            }
            get characters() { return this._chars; } set characters(v) { this._chars = v; }
            get invert() { return this._inv; } set invert(v) { this._inv = v; }
            get resolution() { return this._res; } set resolution(v) { this._res = v; if (this._w) this.setSize(this._w, this._h); }
            setSize(w, h) {
                this._w = w; this._h = h;
                this._c.width  = Math.max(1, Math.floor(w * this._res));
                this._c.height = Math.max(1, Math.floor(h * this._res));
                this.renderer.setSize(w, h);
                const cols = this._c.width, rows = Math.ceil(this._c.height / 2);
                const fs = Math.max(0.4, Math.min(w / (cols * 0.601), h / rows));
                this.domElement.style.fontSize = fs.toFixed(2) + 'px';
                this.domElement.style.lineHeight = (h / rows / fs).toFixed(3);
            }
            render(scene, camera) {
                const cW = this._c.width, cH = this._c.height;
                if (this.partPass) return this._renderParts(scene, camera, cW, cH);
                this.renderer.render(scene, camera);
                this._x.imageSmoothingEnabled = true;
                this._x.clearRect(0, 0, cW, cH);
                this._x.drawImage(this.renderer.domElement, 0, 0, cW, cH);
                const d = this._x.getImageData(0, 0, cW, cH).data, ch = this._chars, inv = this._inv;
                let s = '';
                for (let y = 0; y < cH; y += 2) {
                    for (let x = 0; x < cW; x++) {
                        const i = (y * cW + x) * 4;
                        let b = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
                        if (inv) b = 1 - b;
                        s += ch[Math.min(Math.floor(b * (ch.length - 1)), ch.length - 1)];
                    }
                    s += '\n';
                }
                this.domElement.textContent = s;
            }
            // Each part is painted a flat colour on a 6-level-per-channel grid, so
            // rounding each channel back to that grid recovers the part id exactly.
            // The target has no multisampling and is already grid-sized, so no
            // filtering ever blends two parts into a third id that isn't on screen.
            // Render-target pixels stay in the working (linear) space, which is the
            // space buildPartGlyphs() writes the id colours in, so they round-trip.
            _renderParts(scene, camera, cW, cH) {
                if (!this._rt) this._rt = new THREE.WebGLRenderTarget(cW, cH);
                else if (this._rt.width !== cW || this._rt.height !== cH) this._rt.setSize(cW, cH);
                if (!this._idBuf || this._idBuf.length !== cW * cH * 4) this._idBuf = new Uint8Array(cW * cH * 4);
                const prev = this.renderer.getRenderTarget();
                this.renderer.setRenderTarget(this._rt);
                this.renderer.render(scene, camera);
                this.renderer.setRenderTarget(prev);
                this.renderer.readRenderTargetPixels(this._rt, 0, 0, cW, cH, this._idBuf);
                const d = this._idBuf, g = this.partPass.glyphs;
                let s = '';
                // readRenderTargetPixels hands back rows bottom-up.
                for (let y = cH - 1; y >= 0; y -= 2) {
                    const row = y * cW * 4;
                    for (let x = 0; x < cW; x++) {
                        const i = row + x * 4;
                        const id = Math.round(d[i] / 51) + 6 * Math.round(d[i + 1] / 51) + 36 * Math.round(d[i + 2] / 51);
                        s += id ? (g[id] || '#') : ' ';   // id 0 is the cleared background
                    }
                    s += '\n';
                }
                this.domElement.textContent = s;
            }
            dispose() { if (this._rt) { this._rt.dispose(); this._rt = null; } this._idBuf = null; }
        }

        function normalizeModel(group, targetSize = 3) {
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            group.position.sub(center);
            group.scale.multiplyScalar(targetSize / Math.max(size.x, size.y, size.z));
            const box2 = new THREE.Box3().setFromObject(group);
            group.position.sub(box2.getCenter(new THREE.Vector3()));
        }

        const gltfLoader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
        gltfLoader.setDRACOLoader(dracoLoader);
        const CHAR_SETS = [
            // 'Parts' is not a density ramp: it gives every authored part its own
            // character (see the part pass in AsciiEffect below).
            { name: 'Parts',    parts: true },
            { name: 'Standard', chars: ' .·:;=+x#%@' },
            { name: 'Detailed', chars: " .':;~=+*x#X%@$&" },
            { name: 'Blocky',   chars: ' ░▒▓█' },
