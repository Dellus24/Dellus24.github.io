                            <circle class="ld-arc" cx="22" cy="22" r="20" fill="none" stroke="currentColor" stroke-width="1.5"
                                stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" stroke-linecap="round" transform="rotate(-90 22 22)"/>
                        </svg>
                        <div class="ld-txt">Loading model</div>`;
                    body.appendChild(loadingEl);
                    const ldArc = loadingEl.querySelector('.ld-arc');
                    const ldTxt = loadingEl.querySelector('.ld-txt');

                    gltfLoader.loadAsync(project.model, e => {
                        if (!e.total) return; // no content-length: keep the spinner
                        const frac = Math.min(1, e.loaded / e.total);
                        loadingEl.classList.remove('indet');
                        ldArc.style.strokeDashoffset = CIRC * (1 - frac);
                        ldTxt.textContent = `Loading model ${Math.round(frac * 100)}%`;
                    }).then(gltf => {
                        loadingEl.remove();
                        if (!alive) return;
                        const group = gltf.scene;
                        normalizeModel(group, 3);
                        group.traverse(c => { if (c.isMesh && c.geometry) { c.material = matWhite; realMeshes.push(c); } });
                        scene.add(group);
                        modelGroup = group;
                        setMode(mode); // re-apply the active mode to the freshly loaded meshes
                    }).catch(err => {
                        console.error('3D load failed:', err);
                        loadingEl.classList.remove('indet');
                        loadingEl.querySelector('svg').remove();
                        ldTxt.textContent = 'Model unavailable.\nOpen via local server to load 3D files.';
                    });
                }

                // Edge/fill helper meshes are expensive to compute (EdgesGeometry
                // over the full mesh), so they're built on first use only.
                function ensureEdges() {
                    if (edgesBuilt || !modelGroup) return;
                    edgesBuilt = true;
                    const curBg = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff');
                    realMeshes.forEach(child => {
                        const eg = new THREE.EdgesGeometry(child.geometry, 15);
                        const lg = new LineSegmentsGeometry(); lg.setPositions(eg.attributes.position.array); eg.dispose();
                        const em = new LineSegments2(lg, wireEdgeMat);
                        em.position.copy(child.position); em.rotation.copy(child.rotation); em.scale.copy(child.scale);
                        em.visible = false; modelGroup.add(em); edgeMeshes.push(em);

                        const fm = new THREE.Mesh(child.geometry, new THREE.MeshBasicMaterial({
                            color: curBg, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.FrontSide
                        }));
                        fm.position.copy(child.position); fm.rotation.copy(child.rotation); fm.scale.copy(child.scale);
                        fm.visible = false; modelGroup.add(fm); wireFillMeshes.push(fm);
                    });
                }

                function resetMeshes() {
                    realMeshes.forEach(c => c.visible = true);
                    wireFillMeshes.forEach(f => f.visible = false);
                    edgeMeshes.forEach(e => e.visible = false);
                }
                function applyWire() {
                    if (!modelGroup) return; ensureEdges(); resetMeshes();
                    if (wireLinesMode === 'all') {
                        realMeshes.forEach(c => c.material = matWireAll);
                    } else if (wireLinesMode === 'edges') {
                        realMeshes.forEach(c => c.visible = false);
                        edgeMeshes.forEach(e => { e.material = wireEdgeMat; e.visible = true; });
                    } else {
                        realMeshes.forEach(c => c.visible = false);
                        wireFillMeshes.forEach(f => f.visible = true);
                        edgeMeshes.forEach(e => { e.material = wireEdgeMat; e.visible = true; });
                    }
                }
                function applySolid() {
                    if (!modelGroup) return;
                    if (solidEdges) ensureEdges();
                    resetMeshes();
                    realMeshes.forEach(c => c.material = matSolid);
                    edgeMeshes.forEach(e => { e.material = solidEdgeMat; e.visible = solidEdges; });
                }

                let mode = 'ascii';
                function setMode(m) {
                    mode = m;
                    body.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
                    body.querySelector('.ascii-settings').style.display = m === 'ascii'     ? '' : 'none';
                    body.querySelector('.wire-settings').style.display  = m === 'wireframe' ? '' : 'none';
                    body.querySelector('.solid-settings').style.display = m === 'solid'     ? '' : 'none';
                    if (modelGroup) {
                        if (m === 'ascii') { resetMeshes(); realMeshes.forEach(c => c.material = matWhite); }
                        else if (m === 'wireframe') applyWire();
                        else applySolid();
                    }
                    canvasCont.style.display = m === 'ascii' ? 'none'  : 'block';
                    asciiCont.style.display  = m === 'ascii' ? 'flex'   : 'none';
                }
                body.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
                setMode('ascii');

                // Bottom bar show/hide
                let barLocked = false, hideT = null;
                const showBar = () => { clearTimeout(hideT); bottomBar.classList.add('visible'); };
                const hideBar = () => { if (barLocked) return; hideT = setTimeout(() => bottomBar.classList.remove('visible'), 300); };
                bottomHover.addEventListener('mouseenter', showBar);
                bottomBar.addEventListener('mouseenter', () => clearTimeout(hideT));
                bottomBar.addEventListener('mouseleave', hideBar);
                // Touch has no hover: a tap on the viewer reveals the bar, which
                // hides itself after a few seconds (unless settings are open).
                body.addEventListener('pointerdown', e => {
                    if (e.pointerType === 'mouse') return;
                    if (e.target.closest('.win-bottom-bar, .win-settings')) return;
                    showBar();
                    hideT = setTimeout(() => { if (!barLocked) bottomBar.classList.remove('visible'); }, 3500);
                });
                settingsPanel.addEventListener('mouseenter', () => clearTimeout(hideT));
                settingsPanel.addEventListener('mouseleave', hideBar);
                settingsToggle.addEventListener('click', () => {
                    const opening = !settingsPanel.classList.contains('open');
                    settingsPanel.classList.toggle('open'); settingsToggle.classList.toggle('open');
                    barLocked = opening; if (!opening) hideBar();
                });

                // Controls
                body.querySelector('.res-slider').addEventListener('input', e => {
                    ascii.resolution = parseFloat(e.target.value); ascii.setSize(body.clientWidth, body.clientHeight);
                });
                body.querySelector('.speed-slider').addEventListener('input', e => { orbit.autoSpeed = parseFloat(e.target.value); });
                const invBtn = body.querySelector('.invert-toggle');
                invBtn.addEventListener('click', () => {
                    ascii.invert = !ascii.invert; invBtn.classList.toggle('on', ascii.invert); invBtn.textContent = ascii.invert ? 'On' : 'Off';
                });

                const charsetGrp = body.querySelector('.ascii-charset');
                CHAR_SETS.forEach((cs, i) => {
                    const btn = document.createElement('button');
                    btn.classList.add('charset-option'); if (i === 0) btn.classList.add('active');
                    btn.textContent = cs.name;
                    btn.addEventListener('click', () => {
                        ascii.characters = cs.chars;
                        charsetGrp.querySelectorAll('.charset-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                    charsetGrp.appendChild(btn);
                });

                body.querySelectorAll('.wire-lines-group .charset-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        wireLinesMode = btn.dataset.wire;
                        body.querySelectorAll('.wire-lines-group .charset-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        if (mode === 'wireframe') applyWire();
                    });
                });
                const wireW = body.querySelector('.wire-width-slider'), wireWVal = body.querySelector('.wire-width-val');
                wireW.addEventListener('input', e => { const v = parseFloat(e.target.value); wireEdgeMat.linewidth = v; wireWVal.textContent = v + 'px'; });

                const solidEdgesBtn = body.querySelector('.solid-edges-toggle');
                solidEdgesBtn.addEventListener('click', () => {
                    solidEdges = !solidEdges; solidEdgesBtn.classList.toggle('on', solidEdges); solidEdgesBtn.textContent = solidEdges ? 'On' : 'Off';
                    if (mode === 'solid') applySolid();
                });

                const _mc = new THREE.Vector3(0, 0, 0);
                focusBtn.addEventListener('click', () => { orbit.target.set(0, 0, 0); orbit.radius = 5; orbit.tRotX = 0.4; });

                function resizeVP() {
                    const w = body.clientWidth, h = body.clientHeight;
                    if (w < 1 || h < 1) return;
                    camera.aspect = w / h; camera.updateProjectionMatrix();
                    renderer.setSize(w, h); ascii.setSize(w, h);
                    wireEdgeMat.resolution.set(w, h); solidEdgeMat.resolution.set(w, h);
                }
                frame.addEventListener('win-resize', resizeVP);

                const onThemeChange = () => {
                    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
                    const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
                    const bgInt = parseInt(bg.replace('#',''), 16);
                    const fgInt = parseInt(fg.replace('#',''), 16);
                    ascii.domElement.style.color = fg;
                    ascii.domElement.style.backgroundColor = bg;
                    renderer.setClearColor(bgInt, 1);
                    scene.background.set(bgInt);
                    matWireAll.color.set(fgInt); wireEdgeMat.color.set(fgInt); solidEdgeMat.color.set(fgInt);
                    wireFillMeshes.forEach(f => f.material.color.set(bgInt));
                };
                window.addEventListener('theme-change', onThemeChange);
                frame.querySelector('.win-close').addEventListener('click', () => {
                    alive = false;
                    window.removeEventListener('theme-change', onThemeChange);
                    orbit.dispose();
                    // Free GPU memory held by geometries and materials
                    scene.traverse(o => {
                        if (o.geometry) o.geometry.dispose();
                        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
                    });
                    solidEdgeMat.dispose(); wireEdgeMat.dispose();
                    renderer.dispose();
                });

                (function loop() {
                    if (!alive) return;
                    requestAnimationFrame(loop);
                    orbit.update();
                    if (mode === 'ascii') ascii.render(scene, camera);
                    else renderer.render(scene, camera);
                    if (modelGroup) {
                        const ndc = _mc.clone().project(camera);
                        focusBtn.classList.toggle('visible', Math.abs(ndc.x) > 0.92 || Math.abs(ndc.y) > 0.92 || ndc.z > 1);
                    }
                })();
            });
        }

        // ================================================================
        // MENU WINDOW  (permanent — no close button)
        // ================================================================
        // ================================================================
        // ORDER LAYOUT
        // ================================================================
        function orderWindows() {
            const ws  = document.getElementById('workspace');
            const sw  = window.innerWidth, sh = window.innerHeight;
            const gap = 8,  leftX = 28, topY = 28;

            // Pin menu top-left
            const menuEl = document.getElementById('menu-body-inner')?.closest('.win-frame');
            if (menuEl) { menuEl.style.left = leftX + 'px'; menuEl.style.top = topY + 'px'; menuEl.style.zIndex = ++topZ; }

            // Pin theme below menu
            const themeFrame = openWins['theme'];
            const menuBottom = menuEl ? menuEl.offsetTop + menuEl.offsetHeight : topY;
            const leftColW   = menuEl ? menuEl.offsetWidth + gap : 228 + gap;
            if (themeFrame) {
                themeFrame.style.left = leftX + 'px';
                themeFrame.style.top  = (menuBottom + gap) + 'px';
                themeFrame.style.zIndex = ++topZ;
            }

            // Collect all movable windows + floating images + slideshows
            const frames = [...ws.querySelectorAll('.win-frame')].filter(f => f !== menuEl && f !== themeFrame);
            const floats = [...ws.querySelectorAll('.img-float')];
            const slides = [...ws.querySelectorAll('.slide-float')];
            const all    = [...frames, ...floats, ...slides];
            if (!all.length) return;

            // Weight determines relative area: heavier = more space
            function weight(f) {
                if (f.classList.contains('img-float')) return 1.5;
                if (f.classList.contains('slide-float')) return 3;
                if (f.querySelector('.cv-canvas')) return 4;
                if (f.querySelector('.gallery-body')) {
                    const n = f.querySelectorAll('.gallery-thumb').length || 1;
                    return n <= 2 ? 1.5 : n <= 6 ? 2.5 : 4;
                }
                return 1;
            }
            const totalW = arr => arr.reduce((s, f) => s + weight(f), 0);

            // Sort heaviest first so large windows anchor the layout
            all.sort((a, b) => weight(b) - weight(a));

            // BSP: recursively fill rect with windows
            function bsp(rect, wins) {
                if (!wins.length) return;

                if (wins.length === 1) {
                    const f = wins[0];
                    const w = Math.max(f.classList.contains('img-float') ? 120 : 260, rect.w);
                    const h = Math.max(f.classList.contains('img-float') ? 80  : 180, rect.h);
                    Object.assign(f.style, {
                        left: rect.x + 'px', top: rect.y + 'px',
                        width: w + 'px', height: h + 'px', zIndex: ++topZ
                    });
                    f.dispatchEvent(new CustomEvent('win-resize'));
                    return;
                }

                // Split: along the longer axis
                const splitH = rect.w >= rect.h;
                const half   = Math.ceil(wins.length / 2);
                const left   = wins.slice(0, half);
                const right  = wins.slice(half);
                const ratio  = totalW(left) / totalW(wins);

                if (splitH) {
                    const cut = Math.round(rect.x + (rect.w - gap) * ratio);
                    bsp({ x: rect.x,     y: rect.y, w: cut - rect.x,                    h: rect.h }, left);
                    bsp({ x: cut + gap,  y: rect.y, w: rect.x + rect.w - cut - gap,     h: rect.h }, right);
                } else {
                    const cut = Math.round(rect.y + (rect.h - gap) * ratio);
                    bsp({ x: rect.x, y: rect.y,     w: rect.w, h: cut - rect.y               }, left);
                    bsp({ x: rect.x, y: cut + gap,  w: rect.w, h: rect.y + rect.h - cut - gap }, right);
                }
            }

            const areaX = leftX + leftColW;
            bsp({ x: areaX, y: topY, w: sw - areaX - gap, h: sh - topY - gap }, all);
        }

        function buildMenuWindow() {
            const categories = [
                { id: 'academic',   label: 'Academic' },
                { id: 'employment', label: 'Employment' },
            ];

            const ws = document.getElementById('workspace');
            const frame = document.createElement('div');
            frame.className = 'win-frame spawning';
            frame.style.cssText = `left:28px;top:28px;width:220px;z-index:${++topZ};min-height:0;`;

            const projSections = categories.map(cat => {
                const projs = PROJECTS.filter(p => p.category === cat.id);
                return `
                    <div class="proj-row menu-cat-toggle" data-cat="${cat.id}" style="cursor:pointer;margin-top:4px;"
                         role="button" tabindex="0" aria-expanded="true" aria-controls="cat-list-${cat.id}"
                         aria-label="${cat.label} projects, collapse section">
                        <span class="proj-name" style="opacity:0.4;font-size:0.5rem;letter-spacing:0.14em;">${cat.label}</span>
                        <span class="cat-icon" style="font-size:0.5rem;opacity:0.3;user-select:none;" aria-hidden="true">&#x2212;</span>
                    </div>
                    <div class="cat-proj-list" data-cat-list="${cat.id}" id="cat-list-${cat.id}" role="group" aria-label="${cat.label} projects">
                        ${projs.map(p => `
                            <div class="proj-row" data-id="${p.id}" style="padding-left:8px;"
                                 role="button" tabindex="0"
                                 aria-label="Open ${p.title}">
                                <span class="proj-name">${p.title}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');

            frame.setAttribute('role', 'navigation');
            frame.setAttribute('aria-label', 'Site menu');
            frame.innerHTML = `
                <div class="win-titlebar" style="cursor:move;">
                    <span class="win-title">Nir Dellus</span>
                    <span class="menu-collapse" style="font-size:0.55rem;opacity:0.3;cursor:pointer;user-select:none;padding:0 2px;flex-shrink:0;"
                          role="button" tabindex="0" aria-expanded="true" aria-label="Collapse menu">&#x2212;</span>
                </div>
                <div class="win-body menu-body" id="menu-body-inner">
                    <div class="menu-landing-title">Nir Dellus</div>
                    <div class="menu-landing-sub">Architecture &amp; Design</div>
                    <hr class="menu-rule" style="margin-bottom:6px;">
                    ${projSections}
                    <hr class="menu-rule">
                    <div class="proj-row" data-static="about"   role="button" tabindex="0" aria-label="Open About"><span class="proj-name">About</span></div>
                    <div class="proj-row" data-static="cv"      role="button" tabindex="0" aria-label="Open CV"><span class="proj-name">CV</span></div>
                    <div class="proj-row" data-static="contact" role="button" tabindex="0" aria-label="Open Contact"><span class="proj-name">Contact</span></div>
                    <hr class="menu-rule">
                    <div class="proj-row" style="gap:8px;">
                        <span class="proj-name" data-action="theme"   style="cursor:pointer;" role="button" tabindex="0" aria-label="Open theme editor">Theme</span>
                        <span style="font-size:0.5rem;opacity:0.25;user-select:none;" aria-hidden="true">&#xb7;</span>
                        <span class="proj-name" data-action="arrange" style="cursor:pointer;" role="button" tabindex="0" aria-label="Arrange open windows">Arrange</span>
                    </div>
                </div>
            `;

            ws.appendChild(frame);
            frame.addEventListener('pointerdown', () => frame.style.zIndex = ++topZ);

            // Per-category collapse
            frame.querySelectorAll('.menu-cat-toggle').forEach(toggle => {
                const cat = toggle.dataset.cat;
                const list = frame.querySelector(`[data-cat-list="${cat}"]`);
                const icon = toggle.querySelector('.cat-icon');
                let open = true;
                const toggleCat = () => {
                    open = !open;
                    list.style.display = open ? '' : 'none';
                    icon.textContent = open ? String.fromCharCode(8722) : '+';
                    toggle.setAttribute('aria-expanded', String(open));
                    toggle.setAttribute('aria-label',
                        `${toggle.querySelector('.proj-name').textContent} projects, ${open ? 'collapse' : 'expand'} section`);
                };
                toggle.addEventListener('click', toggleCat);
                onActivateKey(toggle, toggleCat);
            });

            // Window collapse
            let collapsed = false;
            const body = frame.querySelector('#menu-body-inner');
            const toggleBtn = frame.querySelector('.menu-collapse');
            function toggleCollapse() {
                collapsed = !collapsed;
                body.style.display = collapsed ? 'none' : '';
                toggleBtn.textContent = collapsed ? '+' : String.fromCharCode(8722);
                toggleBtn.setAttribute('aria-expanded', String(!collapsed));
                toggleBtn.setAttribute('aria-label', collapsed ? 'Expand menu' : 'Collapse menu');
            }
            frame._toggleCollapse = toggleCollapse;
            frame._collapsed = () => collapsed;
            toggleBtn.addEventListener('click', e => { e.stopPropagation(); toggleCollapse(); });
            onActivateKey(toggleBtn, toggleCollapse);
            frame.querySelector('.win-titlebar').addEventListener('dblclick', toggleCollapse);

            // Drag
            const tb = frame.querySelector('.win-titlebar');
            let dragging = false, ox = 0, oy = 0;
            tb.addEventListener('pointerdown', e => {
                if (!e.isPrimary) return;
                if (e.target === toggleBtn) return;
                dragging = true;
                ox = e.clientX - frame.offsetLeft;
                oy = e.clientY - frame.offsetTop;
                document.body.classList.add('dragging'); e.preventDefault();
            });
            document.addEventListener('pointermove', e => {
                if (!dragging || !e.isPrimary) return;
                frame.style.left = Math.max(0, e.clientX - ox) + 'px';
                frame.style.top  = Math.max(0, e.clientY - oy) + 'px';
            });
            document.addEventListener('pointerup', () => {
                if (dragging) { dragging = false; document.body.classList.remove('dragging'); }
            });
            document.addEventListener('pointercancel', () => {
                if (dragging) { dragging = false; document.body.classList.remove('dragging'); }
            });

            // Bind click + Enter/Space together so every menu row is reachable
            // by keyboard, not just by pointer.
            const bind = (el, fn) => { el.addEventListener('click', fn); onActivateKey(el, fn); };

            frame.querySelectorAll('.proj-row[data-id]').forEach(el => {
                const project = PROJECTS.find(p => p.id === el.dataset.id);
                if (project) bind(el, () => openProject(project));
            });
            frame.querySelectorAll('.proj-row[data-static]').forEach(el => {
                bind(el, () => openText(el.dataset.static));
            });
            frame.querySelectorAll('[data-action]').forEach(el => {
                const action = el.dataset.action;
                if (action === 'theme')   bind(el, () => openTheme());
                if (action === 'arrange') bind(el, () => { orderWindows(); announce('Windows arranged'); });
            });

            // Roving arrow-key navigation between menu rows, so a keyboard
            // user can walk the project list without tabbing through every
            // interactive element in the window.
            frame.addEventListener('keydown', e => {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                const rows = [...frame.querySelectorAll('[role="button"][tabindex="0"]')]
                    .filter(r => r.offsetParent !== null);
                const i = rows.indexOf(document.activeElement);
                if (i === -1) return;
                e.preventDefault();
                rows[(i + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length].focus();
            });
        }
        // ── STRUCTURED DATA (SEO-06) ──────────────────────────────────────
        // Built from PROJECTS/STATIC at runtime rather than hand-written into
        // the markup, so it can never drift from the content the site shows
        // (the meta.md lesson — one source of truth, see assets/projects/README.md).
        //
        // Tradeoff: this requires the crawler to execute JS. Google does;
        // some others do not. Static JSON-LD would be more robust, but with
        // no build step in this repo it would mean a second copy of every
        // project's metadata. If a build step ever lands, prerender this.
        //
        // Deliberately omits email and date of birth — STATIC.cv holds both,
        // and structured data is exactly the wrong place to publish them.
        function injectStructuredData() {
            const SITE = 'https://dellus.xyz/';
            const person = {
                '@type': 'Person',
                '@id': SITE + '#nir-dellus',
                name: 'Nir Dellus',
                jobTitle: 'Architect and Researcher',
                url: SITE,
                alumniOf: { '@type': 'CollegeOrUniversity', name: 'Bezalel Academy of Arts and Design' },
                knowsAbout: ['Architecture', 'Computational Design', 'Architectural Theory', 'Digital Fabrication'],
            };
            const works = (typeof PROJECTS !== 'undefined' ? PROJECTS : []).map(p => {
                const w = {
                    '@type': 'CreativeWork',
                    name: p.title,
                    creator: { '@id': SITE + '#nir-dellus' },
                    isPartOf: { '@id': SITE + '#portfolio' },
                };
                if (p.year)        w.dateCreated     = p.year;
                if (p.location)    w.locationCreated = { '@type': 'Place', name: p.location };
                if (p.type)        w.genre           = p.type;
                // First line only — the full descriptions run to 4,000+ chars.
                if (p.description) w.description     = String(p.description).split('\n')[0].slice(0, 500);
                if (p.images && p.images.length) w.image = SITE + (p.images[0].src || p.images[0]);
                return w;
            });
            const graph = {
                '@context': 'https://schema.org',
                '@graph': [
                    person,
                    {
                        '@type': 'WebSite',
                        '@id': SITE + '#portfolio',
                        url: SITE,
                        name: 'Nir Dellus — Architecture & Design Portfolio',
                        inLanguage: 'en',
                        author: { '@id': SITE + '#nir-dellus' },
                    },
                    ...works,
                ],
            };
            const tag = document.createElement('script');
            tag.type = 'application/ld+json';
            // textContent, never innerHTML — project text is user-authored.
            tag.textContent = JSON.stringify(graph);
            document.head.appendChild(tag);
        }
        injectStructuredData();

        buildMenuWindow();
        openTheme();
        requestAnimationFrame(() => {
            const themeFrame = openWins['theme'];
            const menuEl = document.querySelector('.win-frame');
            if (themeFrame && menuEl) {
                themeFrame.style.left = '28px';
                themeFrame.style.top  = (menuEl.offsetTop + menuEl.offsetHeight + 8) + 'px';
            }
        });

        // Restore saved theme preferences on load
        const savedScale = parseFloat(localStorage.getItem('dellus-font-scale'));
        if (!isNaN(savedScale)) document.documentElement.style.setProperty('--font-scale', savedScale);
        const savedBg = localStorage.getItem('dellus-bg');
        if (savedBg) document.documentElement.style.setProperty('--bg', savedBg);
        const savedFg = localStorage.getItem('dellus-fg');
        if (savedFg) {
            document.documentElement.style.setProperty('--fg', savedFg);
            document.documentElement.style.setProperty('--border-strong', savedFg);
        }
        const savedFontId = localStorage.getItem('dellus-font-id');
        if (savedFontId) {
            const savedFont = FONTS.find(f => f.id === savedFontId);
            if (savedFont) {
                document.documentElement.style.setProperty('--font-family', savedFont.family);
                document.documentElement.style.setProperty('--font-var', savedFont.varSet);
            }
        }

        document.getElementById('err-banner').style.display = 'none';

    </script>
    <script>
        window.addEventListener('error', e => {
            const b = document.getElementById('err-banner');
            if (b) { b.style.display = 'block'; b.textContent = 'JS ERROR: ' + e.message + '\n' + (e.filename||'') + ':' + e.lineno; }
        });
        window.addEventListener('unhandledrejection', e => {
            const b = document.getElementById('err-banner');
            if (b) { b.style.display = 'block'; b.textContent = 'MODULE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason); }
        });
    </script>
</body>
</html>
