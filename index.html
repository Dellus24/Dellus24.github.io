    <!-- ── OPS-01: Cloudflare Web Analytics ──────────────────────────────
         Cookie-less, no cross-site tracking, no personal data collected, and

         TO ACTIVATE: Cloudflare dashboard -> Web Analytics -> Add a site
         (dellus.xyz) -> copy the token out of the snippet it gives you, and
         paste it as TOKEN below.

         The guard stays in place: blank the token and this block goes
         completely inert again, making no request at all.

         The token is not a secret — Cloudflare's own snippet puts it in
         client-side HTML on every page, so it is public by design. The only
         consequence is that someone could send junk beacons to it; that is
         inherent to the product, not to this setup.

         Loaded as type="module" to match the snippet Cloudflare issues —
         beacon.min.js is an ES module, and a classic script tag can fail on
         it. Module scripts are deferred by default, so no `defer` needed. -->
    <script>
        (function () {
            var TOKEN = '2c4403d505934e24b4b2fb86743dc101';
            if (!/^[0-9a-f]{32}$/i.test(TOKEN)) return;   // blanked / not configured
            var s = document.createElement('script');
            s.type = 'module';
            s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            s.setAttribute('data-cf-beacon', JSON.stringify({ token: TOKEN }));
            document.head.appendChild(s);

    <style>
        :root {
            --bg:            #ffffff;
            --fg:            #000;
            --border-strong: #000;
            /* Derived from the ink, not hardcoded black. Ten rules used to
               hand-write rgba(0,0,0,0.x) for this job, so every one of them
               stayed grey-black while the rest of the site took a project's
               colour — and stayed black on a dark theme too. */
            --border-soft:   color-mix(in srgb, var(--fg) 15%, transparent);
            --border-faint:  color-mix(in srgb, var(--fg) 8%, transparent);
            --font-family:   'JunicodeVF', serif;
            --font-var:      normal;
            --font-scale:    1.5;
        }

        @font-face {
            font-family: 'JunicodeVF';
            src: url('assets/fonts/Junicode/JunicodeVF-Roman.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'JunicodeVF';
            src: url('assets/fonts/Junicode/JunicodeVF-Italic.woff2') format('woff2');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: calc(var(--font-scale) * 16px); }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg); color: var(--fg);
            font-family: var(--font-family);
            font-variation-settings: var(--font-var);
            -webkit-font-smoothing: antialiased;
        }

        /* ── MENU WINDOW ───────────────────────────────────────
           Sentence case throughout, deliberately (2026-09-21). The tracking in
           these rules existed to open up capitals; with caps gone it read as
           stretched, so each letter-spacing came down in the same edit. Same
           change, and same reasoning, as the 3D viewer in 2026-09-13. */
        .menu-body { padding: 20px 20px 16px 20px; overflow-y: auto; }

        .menu-landing-title {
            font-size: 1.45rem; letter-spacing: 0.05em;
            font-weight: bold;
            user-select: none; line-height: 1;
            margin-bottom: 4px;
        }
        .menu-landing-sub {
            font-size: 0.45rem; letter-spacing: 0.04em;
            opacity: 0.35;
            user-select: none; margin-bottom: 16px;
        }

        .menu-title {
            font-size: 0.95rem; letter-spacing: 0.18em;
            text-transform: uppercase; font-weight: bold;
            margin-bottom: 18px; user-select: none;
        }

        .menu-nav {
            display: flex; align-items: center; gap: 5px;
            margin-bottom: 14px; flex-wrap: wrap;
        }

        .nav-link {
            font-size: 0.6rem; letter-spacing: 0.1em;
            text-transform: uppercase; cursor: pointer;
            opacity: 0.45; transition: opacity 0.15s, font-weight 0.15s;
            user-select: none;
        }
        .nav-link:hover { opacity: 1; font-weight: bold; }

        .nav-sep { font-size: 0.55rem; opacity: 0.25; user-select: none; }

        .menu-rule {
            border: none; border-top: 1px solid var(--border-soft);
            margin: 12px 0;
        }

        .cat-label {
            font-size: 0.5rem; letter-spacing: 0.14em;
            text-transform: uppercase; opacity: 0.3;
            margin: 10px 0 5px 0; user-select: none;
        }

        .proj-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 3px 0; cursor: pointer; gap: 6px;
        }

        .proj-name {
            font-size: 0.65rem; letter-spacing: 0.02em;
            opacity: 0.6;
            transition: opacity 0.15s, font-weight 0.15s;
            user-select: none; line-height: 1.4;
        }
        .proj-row:hover .proj-name { opacity: 1; font-weight: bold; }
        .proj-row.open .proj-name  { opacity: 0.3; }

        /* ── WORKSPACE ──────────────────────────────────────── */
        .workspace {
            position: fixed; top: 0;
            left: 0; right: 0; bottom: 0;
            overflow: auto;
        }

        body.dragging  { cursor: move !important; user-select: none; }
        .win-frame.win-draggable { cursor: grab; }
        .win-frame.win-draggable:active { cursor: grabbing; }
        body.resizing  { user-select: none; }

        /* Touch: drag surfaces must not pan/zoom the page */
        .win-titlebar, .win-resize-edge, .slide-float, .img-float,
        .slide-resize, .img-float-resize { touch-action: none; }

        /* ── Slideshow ── */
        .slide-float {
            position: absolute; overflow: hidden;
            background: var(--bg); border: 1px solid var(--border-strong);
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            user-select: none; transition: box-shadow 0.15s;
            cursor: grab;
        }
        .slide-float:active { cursor: grabbing; }
        .slide-float img {
            position: absolute; inset: 0 0 28px 0;
            width: 100%; height: calc(100% - 28px);
            object-fit: contain; display: block; pointer-events: none;
        }
        .slide-nav {
            position: absolute; top: 0; bottom: 28px; width: 22%;
            display: flex; align-items: center;
            cursor: pointer; opacity: 0; transition: opacity 0.15s;
        }
        .slide-float:hover .slide-nav { opacity: 1; }
        .slide-nav-prev { left: 0; justify-content: flex-start; padding-left: 10px; }
        .slide-nav-next { right: 0; justify-content: flex-end;  padding-right: 10px; }
        .slide-chevron {
            font-size: 1.1rem; color: var(--fg); opacity: 0.4;
            transition: opacity 0.1s; text-shadow: 0 0 6px var(--bg);
        }
        .slide-nav:hover .slide-chevron { opacity: 1; }
        .slide-bar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 28px;
            display: flex; align-items: center; padding: 0 8px; gap: 8px;
            border-top: 1px solid var(--border-strong);
            font-size: 0.55rem; opacity: 0; transition: opacity 0.2s;
        }
        .slide-float:hover .slide-bar { opacity: 1; }
        .slide-title  { flex: 1; opacity: 0.5; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .slide-counter { opacity: 0.35; flex-shrink: 0; }
        .slide-close  { opacity: 0.3; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; }
        .slide-close:hover { opacity: 0.9; }
        .slide-resize {
            position: absolute; bottom: 0; right: 0;
            width: 14px; height: 14px; cursor: nwse-resize;
        }

        /* ג"€ג"€ WINDOW FRAME ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .win-frame {
            position: absolute;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            display: flex; flex-direction: column;
            min-width: 260px; min-height: 180px;
        }
        .win-frame.focused { z-index: 500; }

        @keyframes winSpawn {
            from { opacity: 0; transform: scale(0.93); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes winClose {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0; transform: scale(0.93); }
        }
        .win-frame.spawning { animation: winSpawn 0.3s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
        .win-frame.closing  { animation: winClose 0.22s ease forwards; pointer-events: none; }

        .win-titlebar {
            height: 24px; min-height: 24px;
            border-bottom: 1px solid transparent;
            display: flex; align-items: center;
            padding: 0 8px; cursor: move;
            user-select: none; gap: 8px; flex-shrink: 0;
            transition: border-color 0.2s;
        }
        .win-frame:hover .win-titlebar { border-bottom-color: var(--border-strong); }

        /* Unlike the rest of the titlebar chrome, the title does NOT hide at
           rest (2026-09-21). A collapsed window is nothing but this bar, so a
           hover-reveal title left the landing state as a blank rectangle. It
           rests at the opacity hover used to give and lifts on hover, keeping
           the bar responsive. Sentence case + tracking down to match the menu. */
        .win-title {
            font-size: 0.5rem; letter-spacing: 0.03em;
            opacity: 0.5; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: opacity 0.2s;
        }
        .win-frame:hover .win-title { opacity: 0.8; }
        .win-type-tag { transition: opacity 0.2s; }
        .win-frame:hover .win-type-tag { opacity: 0.25; }

        .win-type-tag {
            font-size: 0.38rem; letter-spacing: 0.03em;
            opacity: 0;
            white-space: nowrap;
        }

        .win-close {
            font-size: 0.55rem; opacity: 0; cursor: pointer;
            transition: opacity 0.15s; padding: 0 2px;
            user-select: none; flex-shrink: 0;
        }
        .win-frame:hover .win-close { opacity: 0.3; }
        .win-close:hover { opacity: 0.9 !important; }
        .win-collapse {
            font-size: 0.55rem; opacity: 0; cursor: pointer;
            transition: opacity 0.15s; padding: 0 2px;
            user-select: none; flex-shrink: 0;
        }
        .win-frame:hover .win-collapse { opacity: 0.3; }
        .win-collapse:hover { opacity: 0.9 !important; }

        .win-body {
            flex: 1; overflow: auto; position: relative;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .win-body::-webkit-scrollbar { display: none; }

        .cscroll-track {
            position: absolute; right: 5px; width: 1px;
            background: var(--fg); opacity: 0; pointer-events: none;
            transition: opacity 0.2s;
        }
        .win-frame:hover .cscroll-track { opacity: 0.12; }
        .cscroll-thumb {
            position: absolute; left: -3px; right: -3px;
            height: 6px; border-radius: 50%;
            background: var(--fg); opacity: 0.45;
        }

        .win-resize-edge { position: absolute; z-index: 10; }
        .win-resize-edge[data-dir="n"]  { top: -3px; left: 10px; right: 10px; height: 7px; cursor: ns-resize; }
        .win-resize-edge[data-dir="s"]  { bottom: -3px; left: 10px; right: 10px; height: 7px; cursor: ns-resize; }
        .win-resize-edge[data-dir="e"]  { right: -3px; top: 10px; bottom: 10px; width: 7px; cursor: ew-resize; }
        .win-resize-edge[data-dir="w"]  { left: -3px; top: 10px; bottom: 10px; width: 7px; cursor: ew-resize; }
        .win-resize-edge[data-dir="nw"] { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
        .win-resize-edge[data-dir="ne"] { top: -3px; right: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-edge[data-dir="sw"] { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-edge[data-dir="se"] { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: nwse-resize; }

        /* ג"€ג"€ INFO WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        /* The box sizes itself to its text (see openInfo), so the BODY never
           scrolls — only .info-desc does, once the text passes the line cap.
           That keeps the meta line and the Slides/Gallery/3D buttons on screen
           at all times: they are what makes this box the project's menu, and
           when the whole body scrolled they were the first thing to disappear
           below the fold on 8 of 9 projects. */
        .info-body {
            padding: 16px 18px;
            display: flex; flex-direction: column; gap: 10px;
            overflow: hidden;
        }

        /* Meta and participants read at the same weight as the description —
           they were half-tone grey (0.4 / 0.35 against the text's 0.75) and
           uppercase, which made them look like chrome rather than part of the
           text. Tracking comes down with the caps, as everywhere else: it was
           there to space capitals. */
        .info-meta {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.5rem; letter-spacing: 0.03em;
            opacity: 0.75;
            flex-wrap: wrap; flex-shrink: 0;
        }
        /* Was 0.4 — a half-tone separator inside a line that is no longer
           half-tone. Kept a touch lighter than the text so it reads as
           punctuation, not as a word. */
        .info-meta-sep { opacity: 0.55; }

        /* Sits BELOW the description now, not above it — it is a credit, and it
           reads as one at the end of the text rather than as a header. */
        .info-participants {
            font-size: 0.5rem; letter-spacing: 0.03em;
            opacity: 0.75;
            flex-shrink: 0;
        }

        /* min-height:0 is load-bearing: without it a flex child refuses to
           shrink below its content and the max-height set by openInfo is
           ignored, so the box grows to the full text again. */
        .info-desc {
            font-size: 0.62rem; letter-spacing: 0.03em;
            line-height: 1.7; opacity: 0.75;
            flex: 1 1 auto; min-height: 0;
            overflow-y: auto;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .info-desc::-webkit-scrollbar { display: none; }
        /* Paragraphs as authored. margin collapse is avoided by zeroing the
           outer two, so the first line still sits flush with the meta above. */
        .info-desc p { margin: 0 0 0.85em; }
        .info-desc p:last-child { margin-bottom: 0; }

        /* The trailing credit — "Guided by …", "Curated by …". Reads as
           metadata like the participants line directly above it, not as a last
           paragraph of the description, which is how it used to look. */
        .info-credit {
            font-size: 0.5rem; letter-spacing: 0.03em;
            opacity: 0.75; flex-shrink: 0;
        }

        .info-tags {
            display: flex; flex-wrap: wrap; gap: 5px;
        }

        .tag {
            font-size: 0.38rem; letter-spacing: 0.1em;
            text-transform: uppercase; opacity: 0.3;
            border: 1px solid var(--border-soft); padding: 2px 6px;
        }

        .info-actions {
            display: flex; gap: 8px; margin-top: 4px;
            border-top: 1px solid var(--border-faint);
            padding-top: 10px; flex-shrink: 0;
        }

        /* The frame is kept but transparent, so the button occupies the same box
           at rest as it does on hover — nothing shifts when the fill appears.
           border-color, not `border: none`, for exactly that reason. */
        .action-btn {
            font-family: var(--font-family);
            font-size: 0.55rem; letter-spacing: 0.03em;
            background: none;
            border: 1px solid transparent; cursor: pointer;
            padding: 4px 10px; color: var(--fg); opacity: 0.6;
            transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
        }
        .action-btn:hover {
            opacity: 1; background: var(--fg); color: var(--bg);
            border-color: var(--fg);
        }
        /* Pull the first button back by its own padding + border so its TEXT
           lines up with the description above it. With the frame visible that
           inset read as the button's edge; invisible, it just looked misaligned. */
        .info-actions > .action-btn:first-child,
        .info-actions > .model-picker:first-child .action-btn { margin-left: -11px; }

        /* Model dropdown — only built when a project carries several models. */
        .model-picker { position: relative; display: inline-flex; }
        .action-caret { margin-left: 5px; font-size: 0.85em; }

        /* Opens UPWARD: these buttons sit at the bottom of the box, so a menu
           dropping down would fall outside the window. */
        .model-menu {
            position: absolute; bottom: 100%; left: 0; margin-bottom: 5px;
            background: var(--bg); border: 1px solid var(--border-strong);
            display: flex; flex-direction: column; min-width: 100%;
            z-index: 20; white-space: nowrap;
        }
        /* MUST come after the rule above. `display: flex` is an author style and
           beats the browser's own [hidden] { display: none }, so without this the
           menu renders even with the hidden attribute set — and `el.hidden`
           still reads true, which makes it easy to test and miss. */
        .model-menu[hidden] { display: none; }
        .model-menu-item {
            font-family: var(--font-family);
            font-size: 0.55rem; letter-spacing: 0.03em;
            background: none; border: none; cursor: pointer;
            padding: 5px 10px; color: var(--fg); opacity: 0.7;
            text-align: left; transition: opacity 0.15s, background 0.15s, color 0.15s;
        }
        .model-menu-item:hover { opacity: 1; background: var(--fg); color: var(--bg); }

        /* ג"€ג"€ GALLERY WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .gallery-body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1px; padding: 1px; overflow-y: auto; flex: 1;
        }

        .gallery-thumb {
            position: relative; aspect-ratio: 4/3;
            overflow: hidden; cursor: pointer; background: var(--border-faint);
        }
        .gallery-thumb img {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 0.2s; display: block;
        }
        .gallery-thumb:hover img { opacity: 0.75; }

        .thumb-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            font-size: 0.38rem; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 4px 6px;

        .gallery-present {

        /* -- THEME WINDOW -- */

        .theme-font-line { display: flex; align-items: center; gap: 10px; }

        .theme-slider {

        .theme-swatch-custom {
            background: transparent; border-style: dashed; opacity: 0.5;

        .theme-color-input {

        .theme-font-btns {

        .theme-font-btn {
            font-size: 0.42rem; letter-spacing: 0.08em;

        /* ג"€ג"€ TEXT WINDOW ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .text-body { padding: 20px 22px; overflow-y: auto; }

        .text-content {
            font-family: var(--font-family);
            font-size: 0.65rem; letter-spacing: 0.04em;
            line-height: 1.8; opacity: 0.75;
            white-space: pre-wrap; word-break: break-word;
        }

        /* ג"€ג"€ 3D VIEWER INTERNALS ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ג"€ */
        .viewer-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }

        .cv-canvas, .cv-ascii {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .cv-canvas canvas { width: 100% !important; height: 100% !important; display: block; }
        .cv-ascii { display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .viewer-loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; gap: 9px;
            color: var(--fg); opacity: 0.5; pointer-events: none; z-index: 5;
            text-align: center;

        .viewer-loading .ld-txt {
            font-size: 0.5rem; letter-spacing: 0.03em;
            white-space: pre-wrap; max-width: 200px;

        .viewer-loading .ld-track { opacity: 0.2; }
        .viewer-loading .ld-arc { transition: stroke-dashoffset 0.2s linear; }

        }
        @keyframes ldspin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .viewer-loading.indet .ld-arc { animation: none; }
            .viewer-loading .ld-arc { transition: none; }

        .focus-btn {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-family);
            font-size: 0.55rem; letter-spacing: 0.1em;
            background: none; border: none; cursor: pointer; color: var(--fg);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 15;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            white-space: nowrap; user-select: none;
        }
        .focus-label { font-size: 0.38rem; letter-spacing: 0.03em; opacity: 0.7; }
        .focus-btn.visible { opacity: 0.45; pointer-events: auto; }
        .focus-btn.visible:hover { opacity: 0.9; }

        .win-settings {
            position: absolute; bottom: 28px; left: 0; right: 0;
            background: var(--bg); border-top: 1px solid var(--border-strong); z-index: 20;
            overflow: hidden; max-height: 0; opacity: 0;
            pointer-events: none;
            transition: max-height 0.3s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.25s;
        }
        .win-settings.open { max-height: 200px; opacity: 1; pointer-events: auto; }

        .settings-inner { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
        /* Deconstruct and authored views apply in every render mode, so they sit in
           their own always-on block above the mode-specific settings. */
        .settings-inner.model-settings { border-bottom: 1px solid var(--border-soft); }

        .setting-row { display: flex; align-items: center; gap: 10px; }

        .setting-label {
            font-size: 0.42rem; letter-spacing: 0.03em; opacity: 0.35;
            white-space: nowrap; width: 62px; flex-shrink: 0;
        }
        /* A row label that is also the row's action. Underlined so it reads as
           clickable without adding a button box next to the slider it drives. */
        .setting-label.label-btn {
            font-family: var(--font-family); font-size: 0.42rem;
            background: none; border: none; padding: 0; margin: 0;
            color: var(--fg); opacity: 0.5; cursor: pointer; text-align: left;
            text-decoration: underline; text-underline-offset: 2px;
            text-decoration-thickness: 1px;

        .setting-label.label-btn:hover { opacity: 1; }

        .ctrl-slider {
            -webkit-appearance: none; appearance: none;

        .ctrl-slider::-webkit-slider-thumb {

            background: var(--fg); border-radius: 50%; cursor: pointer;
        }
        .ctrl-slider::-moz-range-thumb {
            width: 8px; height: 8px; background: var(--fg);
            border-radius: 50%; cursor: pointer; border: none;
        }

        .ctrl-toggle {
            font-family: var(--font-family);
            font-size: 0.42rem; letter-spacing: 0.03em;
            background: none; border: 1px solid var(--border-soft); cursor: pointer;
            padding: 2px 7px; color: var(--fg); opacity: 0.4;
            transition: opacity 0.2s, background 0.2s, color 0.2s;
        }
        .ctrl-toggle:hover { opacity: 0.65; }
        .ctrl-toggle.on { opacity: 1; background: var(--fg); color: var(--bg); }

        .charset-group { display: flex; gap: 5px; flex-wrap: wrap; }

        .charset-option {
            font-family: var(--font-family);
            font-size: 0.42rem; letter-spacing: 0.03em;
            background: none; border: 1px solid var(--border-soft); cursor: pointer;
            padding: 2px 6px; color: var(--fg); opacity: 0.3;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .charset-option:hover { opacity: 0.55; }
        .charset-option.active { opacity: 1; border-color: var(--fg); font-weight: bold; }

        /* Reveal strip. Matches the bar height so approaching the bottom edge from
           anywhere fills the bar in. It sits below the bar in z-order and never
           swallows the pointer events the orbit controller needs - pointerdown on
           it still bubbles to the viewer body. */
        .win-bottom-hover {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 28px; z-index: 20;
        }

        /* The bar is always mounted but rests BARE: no background, no rule, and only
           the Settings button visible, so the viewer reads clean while still
           advertising that it can be edited. Hover fills the rest in; clicking
           Settings pins it open until you click away.
           pointer-events stays none on the bar itself so the bottom 28px of the
           viewer stays draggable - only the Settings button opts back in. */
        .win-bottom-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 28px; border-top: 1px solid transparent;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; background: transparent; z-index: 21;
            pointer-events: none;
            transition: background 0.25s, border-color 0.25s;
        }
        .win-bottom-bar.visible {
            background: var(--bg); border-top-color: var(--border-strong);
            pointer-events: auto;
        }

        .wbb-left {
            display: flex; align-items: center; gap: 2px;
            opacity: 0; transform: translateY(4px); pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
        }
        .win-bottom-bar.visible .wbb-left { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .mode-btn {
            font-family: var(--font-family);
            font-size: 0.65rem; letter-spacing: 0.03em;
            background: none; border: none; cursor: pointer;
            padding: 3px 4px; color: var(--fg); opacity: 0.3;
            transition: opacity 0.2s, font-weight 0.15s; white-space: nowrap;
        }
        .mode-btn:hover { opacity: 0.55; }
        .mode-btn.active { opacity: 1; font-weight: bold; }

        /* The one control that is always visible, so it carries normal weight and
           full opacity rather than the bar's faded treatment. */
        .settings-toggle-btn {
            font-family: var(--font-family);
            font-size: 0.65rem; letter-spacing: 0.03em;
            background: none; border: none; cursor: pointer;
            padding: 3px 4px; color: var(--fg); opacity: 1;
            transition: opacity 0.2s; white-space: nowrap;
            display: flex; align-items: center; gap: 4px;
            pointer-events: auto;
        }
        .settings-toggle-btn:hover { opacity: 0.6; }

        .settings-arrow { font-size: 0.5rem; transition: transform 0.25s; display: inline-block; }
        .settings-toggle-btn.open .settings-arrow { transform: rotate(180deg); }

        .speed-inline {
            display: flex; align-items: center; gap: 5px;
            margin-left: 6px; opacity: 0.4; transition: opacity 0.2s;
        }
        .speed-inline:hover { opacity: 0.8; }
        .speed-inline .ctrl-slider { width: 55px; }
        .speed-inline-label {
            font-family: var(--font-family);
            font-size: 0.65rem; letter-spacing: 0.03em;
        }

        /* ── IMAGE VIEWER ─────────────────────────────────────── */
        .img-float {
            position: absolute;
            cursor: move;
            user-select: none;
        }
        .img-float-chrome {
            position: absolute; inset: 0;
            border: 1px solid var(--border-strong);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s ease;
        }
        .img-float:hover .img-float-chrome { opacity: 1; }
        .img-float-resize {
            position: absolute; bottom: 0; right: 0;
            width: 16px; height: 16px;
            cursor: nwse-resize; z-index: 10;
        }
        .img-float-resize::before {
            content: ''; position: absolute;
            bottom: 3px; right: 3px;
            width: 7px; height: 7px;
            border-right: 1px solid var(--border-soft);
            border-bottom: 1px solid var(--border-soft);
        }

        .img-float-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 24px;
            border-bottom: 1px solid var(--border-strong);
            background: var(--bg);
            display: flex; align-items: center;
            padding: 0 8px; gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s ease;
        }
        .img-float:hover .img-float-bar {
            opacity: 1;
            pointer-events: auto;
        }
        .img-float-title {
            font-size: 0.5rem; letter-spacing: 0.12em;
            text-transform: uppercase; opacity: 0.5; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            pointer-events: none;
        }
        .img-float-close {
            font-size: 0.55rem; opacity: 0.35; cursor: pointer;
            padding: 0 2px; flex-shrink: 0;
            transition: opacity 0.15s;
        }
        .img-float-close:hover { opacity: 1; }

        /* ── KEYBOARD ACCESSIBILITY (A11Y-02) ─────────────────────────────
           The UI is pointer-driven, so focus has to be visible and the
           hover-only affordances (close, collapse, slide arrows) must also
           appear when reached by keyboard. :focus-visible keeps rings off
           mouse clicks. */
        :focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }
        /* Frames get focus programmatically on open; a ring around the whole
           window would be noisy, so mark it with the titlebar instead. */
        .win-frame:focus { outline: none; }
        .win-frame:focus-visible { outline: none; }
        .win-frame:focus-visible > .win-titlebar,
        .slide-float:focus-visible > .slide-bar {
            outline: 2px solid var(--fg);
            outline-offset: -2px;
        }
        /* Reveal hover-gated controls for keyboard users. */
        .win-close:focus-visible,
        .win-collapse:focus-visible { opacity: 1 !important; }
        .slide-float:focus-within .slide-nav { opacity: 1; }
        .slide-nav:focus-visible,
        .slide-close:focus-visible { opacity: 1; }
        /* Skip link — first tab stop, lets keyboard users reach the menu
           without walking every open window. */
        .skip-link {
            position: absolute; left: 8px; top: -40px; z-index: 99999;
            background: var(--bg); color: var(--fg);
            border: 1px solid var(--fg);
            padding: 6px 10px; font-size: 0.6rem; text-decoration: none;
            transition: top 0.15s;
        }
        .skip-link:focus { top: 8px; }
        /* Screen-reader-only announcements (slide counter, window events). */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        /* ── PROJECT SIGNATURE ─────────────────────────────────────────────
           --sig is the project's own colour, set per menu row when the menu is
           built. It is deliberately scoped to the row: the menu stays a neutral
           black index, and a project's colour appears only where that project
           is being pointed at or is the one you are in. */
        .proj-row[data-id] .proj-name { transition: color 0.15s; }
        .proj-row[data-id].hot   .proj-name,
        .proj-row[data-id]:hover .proj-name,
        .proj-row[data-id].active .proj-name { color: var(--sig, inherit); }
        /* .open dims a row to 0.3 while that project is on screen, which would
           otherwise all but erase the one project you are actually in. */
        .proj-row[data-id].active .proj-name,
        .proj-row[data-id].hot   .proj-name { opacity: 1; }
        .proj-mark {
            width: 4px; height: 4px; flex-shrink: 0; margin-left: auto;
            background: var(--sig, currentColor);
            opacity: 0; transition: opacity 0.15s;
        }
        .proj-row[data-id].active .proj-mark { opacity: 1; }

        /* ── LANDING HATCH ─────────────────────────────────────────────────
           Follows .img-float-chrome: a full-cover overlay that is
           pointer-events:none AT REST, so the model underneath stays orbitable
           and thumbnails stay clickable. It only becomes clickable once it has
           actually appeared, which is what lets the window be live first and an
           invitation second. */
        .win-hatch {
            position: absolute; inset: 0; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.18s ease;
            background:
                repeating-linear-gradient(45deg,
                    color-mix(in srgb, var(--fg) 28%, transparent) 0 1px,
                    transparent 1px 7px),
                color-mix(in srgb, var(--bg) 84%, transparent);
        }
        /* Development-only layout tool (?layout). Deliberately plain and
           outside the theme — it is scaffolding, not part of the site. */
        #layout-tool {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 9000;
            background: #111; color: #eee; padding: 6px 10px 8px;
            font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
        }
        .layout-tool-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .layout-tool-head strong { font-weight: 600; }
        .layout-hint { opacity: 0.55; }
        #layout-tool button {
            font: inherit; background: #eee; color: #111; border: 0;
            padding: 2px 10px; cursor: pointer;
        }
        #layout-tool .layout-fold { padding: 2px 8px; }
        #layout-tool textarea {
            width: 100%; box-sizing: border-box; background: #000; color: #9f9;
            border: 1px solid #333; font: inherit; padding: 5px; resize: vertical;
        }
        /* Folded: one strip, Copy and Refresh still on it. */
        #layout-tool.folded { padding-bottom: 5px; }
        #layout-tool.folded .layout-tool-head { margin-bottom: 0; }
        #layout-tool.folded .layout-out,
        #layout-tool.folded .layout-hint { display: none; }
        .theme-proj-pair { display: flex; align-items: center; gap: 5px; margin: 3px 0 5px; }
        .theme-proj-pair .theme-row-sublabel { margin: 0 6px 0 0; }
        .win-hatch.shown { opacity: 1; pointer-events: auto; }
        /* An .img-float's frame is normally a hover-only reveal, which left a
           landing image showing no colour at rest — the one thing the landing
           exists to show. Landing images wear theirs permanently. */
        .img-float[data-landing] .img-float-chrome { opacity: 1; }
        .win-hatch-inner {
            display: flex; flex-direction: column; align-items: stretch; gap: 4px;
            background: var(--bg);
            border: 1px solid var(--border-strong);
            padding: 8px 10px;
        }
        .win-hatch button {
            font-family: var(--font-family);
            font-size: 0.55rem; letter-spacing: 0.03em;
            background: none; border: 1px solid transparent; cursor: pointer;
            padding: 3px 10px; color: var(--fg); opacity: 0.7;
            transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
        }
        .win-hatch button:hover { opacity: 1; background: var(--fg); color: var(--bg); border-color: var(--fg); }
        .win-hatch .win-hatch-stay { opacity: 0.45; font-size: 0.5rem; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
